<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>인프라 구성정보</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    /* === Design System === */
    :root {
      --bg-app: #f0f2f5; --bg-panel: #ffffff; --bg-input: #f8fafc;
      --text-main: #1e293b; --text-sub: #64748b; --border: #e2e8f0;
      --primary: #0f172a; --primary-hover: #334155; --accent: #3b82f6;
      --danger: #ef4444; --success: #10b981;
      --font-ui: "Pretendard", sans-serif;
      /* Modal Colors (from reference image) */
      --modal-primary: #8b3d50; 
      --modal-secondary: #fce4e8;
    }

    * { box-sizing: border-box; outline: none; margin: 0; padding: 0; }
    
    body {
      background: var(--bg-app); color: var(--text-main); font-family: var(--font-ui); 
      font-size: 14px; line-height: 1.6; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    /* === Header === */
    header {
      background: var(--bg-panel); height: 64px; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border); z-index: 50; flex-shrink: 0;
    }
    .logo { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 12px; }
    .toolbar { display: flex; gap: 10px; }
    .btn {
      height: 38px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--border);
      background: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-ui); font-weight: 600; font-size: 13px; color: var(--text-main); transition: 0.2s;
    }
    .btn:hover { background: #f8fafc; border-color: #cbd5e1; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); color: #fff; }

    /* === Main Layout === */
    main { flex: 1; display: flex; height: calc(100vh - 64px); overflow: hidden; }

    /* === Sidebar === */
    #sidebar {
      width: 280px; background: var(--bg-panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
    .list-scroll { flex: 1; overflow-y: auto; }
    
    .page-item {
      padding: 16px 20px; border-bottom: 1px solid #f1f5f9; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border-left: 3px solid transparent;
    }
    .page-item:hover { background: #f8fafc; }
    .page-item.active { background: #eff6ff; border-left-color: var(--accent); font-weight: 700; color: var(--accent); }
    
    /* === Editor Area (Dashboard) === */
    #editor-area { flex: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; align-items: center; background: var(--bg-app); }
    
    .page-header-row { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
    .page-main-title { font-size: 26px; font-weight: 800; color: var(--primary); }
    .page-meta { font-size: 13px; color: var(--text-sub); }

    .paper {
        width: 100%; max-width: 1200px; background: #fff; padding: 25px; border-radius: 12px; 
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid var(--border); margin-bottom: 30px; 
    }
    .paper-title { 
        font-size: 16px; font-weight: 800; color: var(--primary); 
        padding-bottom: 12px; border-bottom: 2px solid #f1f5f9; margin-bottom: 16px; 
    }

    /* === Data Table === */
    table { width: 100%; border-collapse: collapse; margin-bottom: 10px; table-layout: fixed; }
    th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: center; vertical-align: middle; word-break: break-all; font-size:13px; }
    th { background: #f8fafc; font-weight: 700; color: #475569; }
    td { background: #fff; }
    
    .copy-group { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; gap: 6px; text-align: left; }
    .copy-text { flex: 1; font-family: "Pretendard", monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .btn-icon { width: 26px; height: 26px; flex-shrink: 0; border: none; background: transparent; border-radius: 4px; color: var(--text-sub); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-icon:hover { background: #e2e8f0; color: var(--accent); }
    .btn-icon.text-danger:hover { color: var(--danger); background: #fee2e2; }

    .edit-input { width: 100%; padding: 6px; border: 1px solid var(--accent); border-radius: 4px; font-family: var(--font-ui); font-size: 12px; outline: none; background: #eff6ff; }
    
    .action-cell { display: flex; gap: 4px; justify-content: center; border: none; }
    .btn-action { padding: 4px 8px; border: none; border-radius: 4px; font-weight: 600; font-size: 12px; cursor: pointer; }
    .btn-save { background: var(--primary); color: #fff; }
    .btn-cancel { background: #e2e8f0; color: #475569; }

    .btn-add-row { width: 100%; padding: 10px; margin-top: 10px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; color: #64748b; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-add-row:hover { background: #f1f5f9; border-color: #94a3b8; color: var(--primary); }

    /* === Custom Modal (Reference Image Style) === */
    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(2px);
        display: flex; justify-content: center; align-items: center; z-index: 9999;
        opacity: 0; visibility: hidden; transition: 0.2s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-box {
        background: #fff; width: 100%; max-width: 450px; border-radius: 12px; padding: 25px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15); transform: translateY(-20px); transition: 0.3s;
    }
    .modal-overlay.active .modal-box { transform: translateY(0); }
    
    .modal-title { font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 12px; }
    .modal-message { font-size: 15px; color: var(--text-main); margin-bottom: 15px; white-space: pre-wrap; }
    
    .modal-input-field {
        width: 100%; padding: 12px 14px; border: 2px solid var(--modal-primary); border-radius: 8px;
        font-family: var(--font-ui); font-size: 15px; margin-bottom: 25px; display: none;
    }
    .modal-input-field:focus { box-shadow: 0 0 0 3px var(--modal-secondary); }
    .modal-input-field::selection { background: var(--modal-secondary); }

    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .modal-btn {
        padding: 10px 24px; border: none; border-radius: 20px; font-family: var(--font-ui); 
        font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .modal-btn-confirm { background: var(--modal-primary); color: #fff; }
    .modal-btn-confirm:hover { filter: brightness(1.1); }
    .modal-btn-cancel { background: var(--modal-secondary); color: var(--modal-primary); }
    .modal-btn-cancel:hover { filter: brightness(0.95); }

    /* === Updated Toast Notification === */
    #toast-area { 
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
        z-index: 3000; display:flex; flex-direction:column; gap:10px; align-items:center; pointer-events: none;
    }
    .toast { 
        background: #000; color: #fff; padding: 12px 24px; border-radius: 50px; 
        font-size: 13px; font-weight: 500; box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
        animation: fadeUp 0.2s forwards; opacity: 0;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(15px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
  </style>
</head>
<body>

<header>
  <div class="logo"><i class="fas fa-server"></i> 인프라 구성정보</div>
  <div class="toolbar">
    <input type="file" id="inp-import" accept=".json" style="display: none;">
    <button class="btn" id="btn-export" onclick="exportJSON()"><i class="fas fa-download"></i> 전체 페이지 백업</button>
    <button class="btn" id="btn-import" onclick="document.getElementById('inp-import').click()"><i class="fas fa-upload"></i> 전체 페이지 복구</button>
  </div>
</header>

<main>
  <aside id="sidebar">
    <div class="sidebar-header">
      <button class="btn btn-primary" onclick="createNewPage()" style="width:100%; justify-content:center;">
        <i class="fas fa-plus"></i> 새 페이지 추가
      </button>
    </div>
    <div class="list-scroll" id="pageList"></div>
  </aside>

  <section id="editor-area">
    <div id="empty-state" style="display:none; text-align:center; margin-top:100px; color:#94a3b8;">
        <i class="fas fa-folder-open fa-4x" style="margin-bottom:20px;"></i>
        <h2>선택된 페이지가 없습니다.</h2>
        <p>왼쪽에서 페이지를 선택하거나 새로 만들어주세요.</p>
    </div>
    
    <div id="dashboard-content" style="width:100%; display:flex; flex-direction:column; align-items:center;">
        <div class="page-header-row">
            <div>
                <h1 id="lbl-page-title" class="page-main-title">페이지 이름</h1>
                <div id="lbl-page-date" class="page-meta">마지막 수정: -</div>
            </div>
            <div>
                <button class="btn" onclick="editPageName()"><i class="fas fa-pen"></i> 이름 변경</button>
                <button class="btn" style="color:var(--danger); border-color:#fecaca;" onclick="deleteCurrentPage()"><i class="fas fa-trash-alt"></i> 페이지 삭제</button>
            </div>
        </div>
        <div id="tables-container" style="width:100%; max-width:1200px;"></div>
    </div>
  </section>
</main>

<!-- 커스텀 모달 UI -->
<div id="custom-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-title" id="modal-title">이 페이지 내용:</div>
        <div class="modal-message" id="modal-message"></div>
        <input type="text" class="modal-input-field" id="modal-input" autocomplete="off" />
        <div class="modal-actions">
            <button class="modal-btn modal-btn-confirm" id="modal-btn-confirm">확인</button>
            <button class="modal-btn modal-btn-cancel" id="modal-btn-cancel">취소</button>
        </div>
    </div>
</div>

<div id="toast-area"></div>

<script>
    /* =========================================================
       0. Custom Modal Component
       ========================================================= */
    const CustomModal = {
        overlay: document.getElementById('custom-modal'),
        title: document.getElementById('modal-title'),
        message: document.getElementById('modal-message'),
        input: document.getElementById('modal-input'),
        btnConfirm: document.getElementById('modal-btn-confirm'),
        btnCancel: document.getElementById('modal-btn-cancel'),
        
        show: function(options) {
            return new Promise((resolve) => {
                this.title.textContent = options.title || "알림";
                this.message.textContent = options.message || "";
                
                if (options.type === "prompt") {
                    this.input.style.display = "block";
                    this.input.value = options.defaultValue || "";
                    setTimeout(() => { this.input.focus(); this.input.select(); }, 100);
                } else {
                    this.input.style.display = "none";
                    this.input.value = "";
                }

                this.overlay.classList.add('active');

                const closeModal = (result) => {
                    this.overlay.classList.remove('active');
                    this.btnConfirm.onclick = null;
                    this.btnCancel.onclick = null;
                    this.input.onkeydown = null;
                    resolve(result);
                };

                this.btnConfirm.onclick = () => {
                    closeModal(options.type === "prompt" ? this.input.value.trim() : true);
                };
                
                this.btnCancel.onclick = () => {
                    closeModal(options.type === "prompt" ? null : false);
                };

                this.input.onkeydown = (e) => {
                    if (e.key === "Enter") this.btnConfirm.click();
                    if (e.key === "Escape") this.btnCancel.click();
                };
            });
        }
    };

    /* =========================================================
       1. IndexedDB Wrapper
       ========================================================= */
    const DB_NAME = "InfraDB";
    const STORE_NAME = "pages";
    
    const AppDB = {
        db: null,
        init: function() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if(!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "id" });
                    }
                };
                req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
                req.onerror = (e) => reject(e);
            });
        },
        getAllPages: function() {
            return new Promise(r => {
                const req = this.db.transaction(STORE_NAME).objectStore(STORE_NAME).getAll();
                req.onsuccess = () => r(req.result || []);
            });
        },
        savePage: function(pageData) {
            return new Promise(r => {
                const req = this.db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).put(pageData);
                req.onsuccess = () => r(true);
            });
        },
        deletePage: function(id) {
            return new Promise(r => {
                const req = this.db.transaction(STORE_NAME, "readwrite").objectStore(STORE_NAME).delete(id);
                req.onsuccess = () => r(true);
            });
        }
    };

    /* =========================================================
       2. Data Schemas & State Management
       ========================================================= */
    const schemas = {
        infra: { title: "Cloud_Dev_Infra", icon: "fa-network-wired", cols: ['service', 'hostname', 'publicIp', 'privateIp', 'id', 'pw'], headers: ['서비스', 'HOSTNAME', 'Public IP', 'Private IP', 'ID', 'PW'] },
        db: { title: "Cloud_Dev_DB", icon: "fa-database", cols: ['service', 'hostname', 'publicDomain', 'privateDomain', 'id', 'pw'], headers: ['서비스', 'HOSTNAME', 'Public Domain', 'Private Domain', 'ID', 'PW'] },
        valkey: { title: "Cloud_Dev_Valkey DB", icon: "fa-memory", cols: ['service', 'hostname', 'publicDns', 'dns'], headers: ['서비스', 'HOSTNAME', 'Public DNS', 'DNS'] },
        lb: { title: "Cloud_Dev_LB", icon: "fa-project-diagram", cols: ['lbName', 'cname', 'ip'], headers: ['로드밸런서 이름', '접속정보(CNAME)', '접속 IP'] },
        account: { title: "Account Info", icon: "fa-users", cols: ['id', 'pw', 'email', 'sms'], headers: ['ID', 'PW', 'Email', 'SMS'] },
        solution: { title: "Solution Info", icon: "fa-cubes", cols: ['solName', 'url', 'id', 'pw'], headers: ['솔루션명', '접속주소', 'ID', 'PW'] }
    };

    const emptyDataTemplate = { infra: [], db: [], valkey: [], lb: [], account: [], solution: [] };

    let pages = [];
    let currentPageId = null;
    let editingState = { cat: null, index: null };

    const defaultInitData = {
        infra: [ { service: "개발 web", hostname: "dev-web-01", publicIp: "-", privateIp: "10.30.10.6", id: "root", pw: "" } ],
        db: [ { service: "ebridge-dev-cdb", hostname: "dev-cdb-001-9jyo", publicDomain: "-", privateDomain: "pg-49kbre.vpc-cdb-kr.ntruss.com", id: "", pw: "" } ],
        valkey: [ { service: "eb-dev-cache", hostname: "dev-rds-001-9jyp", publicDns: "-", dns: "cache-49kbsh.vpc-cdb.ntruss.com" } ],
        lb: [ { lbName: "dev-web-alb", cname: "dev-web-alb-144323025-b8b6de459634.kr.lb.navercp.com", ip: "101.79.21.166" } ],
        account: [ { id: "gd.eb", pw: "", email: "goodusdata_cloud@goodusdata.com", sms: "010-xxxx-xxxx" } ],
        solution: [ { solName: "예시 솔루션", url: "https://example.com", id: "admin", pw: "" } ]
    };

    /* =========================================================
       3. Initialization & Page Management
       ========================================================= */
    window.onload = async () => {
        await AppDB.init();
        await loadAllPages();
    };

    async function loadAllPages() {
        pages = await AppDB.getAllPages();
        
        if (pages.length === 0) {
            const initialPage = {
                id: "page_" + Date.now(),
                name: "기본 인프라 페이지",
                data: JSON.parse(JSON.stringify(defaultInitData)),
                updatedAt: new Date().toISOString()
            };
            await AppDB.savePage(initialPage);
            pages.push(initialPage);
        }

        renderSidebar();
        
        if (!currentPageId || !pages.find(p => p.id === currentPageId)) {
            selectPage(pages[0].id);
        } else {
            selectPage(currentPageId);
        }
    }

    function renderSidebar() {
        const list = document.getElementById("pageList");
        list.innerHTML = "";
        
        pages.sort((a,b) => a.name.localeCompare(b.name)).forEach(p => {
            const div = document.createElement("div");
            div.className = `page-item ${p.id === currentPageId ? 'active' : ''}`;
            div.innerHTML = `<span><i class="far fa-file-alt"></i> ${p.name}</span>`;
            div.onclick = () => selectPage(p.id);
            list.appendChild(div);
        });
    }

    async function selectPage(id) {
        if(editingState.cat !== null) {
            const confirmed = await CustomModal.show({ title: "이 페이지 내용:", message: "수정 중인 내용이 취소됩니다. 이동하시겠습니까?", type: "confirm" });
            if(!confirmed) return;
            editingState = { cat: null, index: null };
        }
        
        currentPageId = id;
        renderSidebar();
        
        const page = pages.find(p => p.id === id);
        if (page) {
            document.getElementById("empty-state").style.display = "none";
            document.getElementById("dashboard-content").style.display = "flex";
            document.getElementById("lbl-page-title").textContent = page.name;
            document.getElementById("lbl-page-date").textContent = "마지막 수정: " + new Date(page.updatedAt).toLocaleString();
            
            buildDashboardDOM();
            renderDashboardData();
        } else {
            document.getElementById("empty-state").style.display = "block";
            document.getElementById("dashboard-content").style.display = "none";
        }
    }

    async function createNewPage() {
        const name = await CustomModal.show({ 
            title: "이 페이지 내용:", 
            message: "새 페이지 이름을 입력하세요:", 
            type: "prompt", 
            defaultValue: "새 인프라 페이지" 
        });
        
        if (!name) return;

        const newPage = {
            id: "page_" + Date.now(),
            name: name,
            data: JSON.parse(JSON.stringify(emptyDataTemplate)),
            updatedAt: new Date().toISOString()
        };
        await AppDB.savePage(newPage);
        pages.push(newPage);
        showToast(`'${name}' 페이지가 생성되었습니다.`);
        selectPage(newPage.id);
    }

    async function deleteCurrentPage() {
        if (!currentPageId) return;
        const page = pages.find(p => p.id === currentPageId);
        
        const confirmed = await CustomModal.show({ 
            title: "페이지 삭제", 
            message: `'${page.name}' 페이지를 정말 삭제하시겠습니까?\n이 작업은 복구할 수 없습니다.`, 
            type: "confirm" 
        });

        if (confirmed) {
            await AppDB.deletePage(currentPageId);
            pages = pages.filter(p => p.id !== currentPageId);
            currentPageId = null;
            showToast("페이지가 삭제되었습니다.");
            loadAllPages();
        }
    }

    async function editPageName() {
        const page = pages.find(p => p.id === currentPageId);
        
        const newName = await CustomModal.show({ 
            title: "이 페이지 내용:", 
            message: "새로운 페이지 이름을 입력하세요:", 
            type: "prompt", 
            defaultValue: page.name 
        });

        if (newName && newName !== page.name) {
            page.name = newName;
            page.updatedAt = new Date().toISOString();
            await AppDB.savePage(page);
            showToast("페이지 이름이 변경되었습니다.");
            renderSidebar();
            document.getElementById("lbl-page-title").textContent = page.name;
        }
    }

    async function saveCurrentPageData() {
        const page = pages.find(p => p.id === currentPageId);
        page.updatedAt = new Date().toISOString();
        await AppDB.savePage(page);
        document.getElementById("lbl-page-date").textContent = "마지막 수정: " + new Date(page.updatedAt).toLocaleString();
    }

    /* =========================================================
       4. Dashboard CRUD Rendering
       ========================================================= */
    function buildDashboardDOM() {
        const container = document.getElementById("tables-container");
        container.innerHTML = "";
        
        Object.keys(schemas).forEach(cat => {
            const schema = schemas[cat];
            let thHtml = "";
            schema.headers.forEach(h => { thHtml += `<th>${h}</th>`; });
            
            const html = `
            <div class="paper">
                <div class="paper-title"><i class="fas ${schema.icon}"></i> ${schema.title}</div>
                <table>
                    <thead><tr>${thHtml}<th style="width:90px;">관리</th></tr></thead>
                    <tbody id="tbody-${cat}"></tbody>
                </table>
                <button class="btn-add-row" onclick="addRow('${cat}')"><i class="fas fa-plus"></i> 항목 추가</button>
            </div>`;
            container.insertAdjacentHTML('beforeend', html);
        });
    }

    function renderDashboardData() {
        const page = pages.find(p => p.id === currentPageId);
        if (!page) return;

        Object.keys(schemas).forEach(cat => {
            const tbody = document.getElementById(`tbody-${cat}`);
            if(!tbody) return;
            tbody.innerHTML = '';
            const schema = schemas[cat];
            const dataArr = page.data[cat] || [];

            dataArr.forEach((item, index) => {
                const tr = document.createElement('tr');
                const isEditing = (editingState.cat === cat && editingState.index === index);

                schema.cols.forEach(key => {
                    const td = document.createElement('td');
                    const val = item[key] || '';
                    if (isEditing) {
                        td.innerHTML = `<input type="text" class="edit-input" id="edit-${cat}-${key}" value="${val}">`;
                    } else {
                        td.innerHTML = `<div class="copy-group"><span class="copy-text" title="${val}">${val}</span><button class="btn-icon" onclick="copyText(this)" title="복사"><i class="far fa-copy"></i></button></div>`;
                    }
                    tr.appendChild(td);
                });

                const tdAction = document.createElement('td');
                if (isEditing) {
                    tdAction.innerHTML = `
                        <div class="action-cell">
                            <button class="btn-action btn-save" onclick="saveRow('${cat}', ${index})"><i class="fas fa-check"></i></button>
                            <button class="btn-action btn-cancel" onclick="cancelEdit()"><i class="fas fa-times"></i></button>
                        </div>`;
                } else {
                    tdAction.innerHTML = `
                        <div class="action-cell">
                            <button class="btn-icon" onclick="setEdit('${cat}', ${index})" title="수정"><i class="fas fa-pen"></i></button>
                            <button class="btn-icon text-danger" onclick="deleteRow('${cat}', ${index})" title="삭제"><i class="fas fa-trash-alt"></i></button>
                        </div>`;
                }
                tr.appendChild(tdAction);
                tbody.appendChild(tr);
            });

            if(dataArr.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${schema.cols.length + 1}" style="color:#94a3b8; padding:15px;">데이터가 없습니다.</td></tr>`;
            }
        });
    }

    async function setEdit(cat, index) {
        if(editingState.cat !== null) {
            const confirmed = await CustomModal.show({ 
                title: "이 페이지 내용:", 
                message: "수정 중인 항목이 있습니다. 무시하고 진행하시겠습니까?", 
                type: "confirm" 
            });
            if(!confirmed) return;
        }
        editingState = { cat, index };
        renderDashboardData();
    }

    function cancelEdit() {
        const page = pages.find(p => p.id === currentPageId);
        if(editingState.cat !== null) {
            const item = page.data[editingState.cat][editingState.index];
            const isEmpty = schemas[editingState.cat].cols.every(k => !item[k]);
            if(isEmpty) page.data[editingState.cat].splice(editingState.index, 1);
        }
        editingState = { cat: null, index: null };
        renderDashboardData();
    }

    function addRow(cat) {
        if(editingState.cat !== null) return showToast("진행 중인 수정을 완료해주세요.");
        const page = pages.find(p => p.id === currentPageId);
        
        const newItem = {};
        schemas[cat].cols.forEach(k => newItem[k] = "");
        if(!page.data[cat]) page.data[cat] = [];
        page.data[cat].push(newItem);
        
        editingState = { cat: cat, index: page.data[cat].length - 1 };
        renderDashboardData();
    }

    async function saveRow(cat, index) {
        const page = pages.find(p => p.id === currentPageId);
        const updatedItem = {};
        
        schemas[cat].cols.forEach(key => {
            const input = document.getElementById(`edit-${cat}-${key}`);
            updatedItem[key] = input ? input.value : "";
        });

        page.data[cat][index] = updatedItem;
        editingState = { cat: null, index: null };
        
        await saveCurrentPageData();
        renderDashboardData();
        showToast("항목이 저장되었습니다.");
    }

    async function deleteRow(cat, index) {
        const confirmed = await CustomModal.show({ 
            title: "항목 삭제", 
            message: "이 항목을 삭제하시겠습니까?", 
            type: "confirm" 
        });

        if(confirmed) {
            const page = pages.find(p => p.id === currentPageId);
            page.data[cat].splice(index, 1);
            if(editingState.cat === cat && editingState.index === index) {
                editingState = { cat: null, index: null };
            }
            await saveCurrentPageData();
            renderDashboardData();
            showToast("삭제되었습니다.");
        }
    }

    /* =========================================================
       5. JSON Export & Import
       ========================================================= */
    function exportJSON() {
        if (pages.length === 0) return showToast("백업할 데이터가 없습니다.");
        
        const blob = new Blob([JSON.stringify(pages, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `페이지_전체백업_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    document.getElementById("inp-import").addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
            try {
                const importedData = JSON.parse(event.target.result);
                
                if (!Array.isArray(importedData)) throw new Error("전체 백업 파일 형식이 아닙니다.");

                const confirmed = await CustomModal.show({ 
                    title: "데이터 복구", 
                    message: "백업 파일 데이터를 적용하시겠습니까?\n(동일한 페이지는 업데이트, 새 페이지는 추가됩니다.)", 
                    type: "confirm" 
                });

                if (confirmed) {
                    let updateCount = 0;
                    let addCount = 0;

                    for (const importedPage of importedData) {
                        if (!importedPage.id || !importedPage.data) continue;
                        
                        const existingPageIndex = pages.findIndex(p => p.id === importedPage.id);

                        if (existingPageIndex >= 0) {
                            const localPage = pages[existingPageIndex];
                            localPage.name = importedPage.name || localPage.name;
                            Object.keys(schemas).forEach(cat => {
                                if (importedPage.data[cat]) localPage.data[cat] = importedPage.data[cat];
                            });
                            localPage.updatedAt = new Date().toISOString();
                            await AppDB.savePage(localPage);
                            updateCount++;
                        } else {
                            await AppDB.savePage(importedPage);
                            addCount++;
                        }
                    }

                    await loadAllPages();
                    showToast(`복구 완료: ${updateCount}개 업데이트, ${addCount}개 추가됨`);
                }
            } catch (error) {
                console.error(error);
                CustomModal.show({ title: "오류", message: "JSON 파일을 불러오는 중 오류가 발생했습니다.", type: "confirm" });
            }
            e.target.value = ""; 
        };
        reader.readAsText(file);
    });

    /* =========================================================
       6. Utils (Toast)
       ========================================================= */
    function copyText(btn) {
        const text = btn.previousElementSibling.textContent;
        if(text) {
            navigator.clipboard.writeText(text).then(() => showToast("복사되었습니다."));
        }
    }

    function showToast(msg) {
        const area = document.getElementById("toast-area");
        const el = document.createElement("div"); 
        el.className = "toast"; 
        el.textContent = msg;
        area.appendChild(el); 
        
        // 1초 후 제거
        setTimeout(() => el.remove(), 1000);
    }
</script>
</body>
