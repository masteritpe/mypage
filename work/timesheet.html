<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIME SHEET</title>
    <!-- 고급스러운 폰트 적용 (Pretendard) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    
    <style>
        :root {
            /* 프리미엄 컬러 팔레트 */
            --bg-color: #F8FAFC;         /* 아주 밝은 쿨그레이 배경 */
            --surface: #FFFFFF;          /* 요소 배경 */
            --text-main: #1E293B;        /* 진한 슬레이트 텍스트 */
            --text-muted: #64748B;       /* 보조 텍스트 */
            --border: #E2E8F0;           /* 경계선 */
            --border-hover: #CBD5E1;
            
            --primary: #0F172A;          /* 주요 포인트 컬러 (다크) */
            --accent: #2563EB;           /* 액션 버튼 블루 */
            --accent-hover: #1D4ED8;
            --accent-light: #EFF6FF;
            
            --success-bg: #ECFDF5;       /* 시간 입력 배경 */
            --success-text: #047857;     /* 시간 입력 텍스트 */
            --weekend-bg: #F1F5F9;       /* 주말 배경 */
            
            --radius-xl: 16px;
            --radius-lg: 12px;
            --radius-md: 8px;
            
            /* 부드럽고 입체적인 그림자 */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.05);
            
            /* 컬럼 너비 및 고정 위치 변수 */
            --cw-0: 100px; --cw-1: 140px; --cw-2: 250px;
            --cw-3: 100px; --cw-4: 100px; --cw-5: 80px;
            --cw-6: 80px; --cw-7: 200px; --cw-8: 80px;
            --left-0: 0px; --left-1: 100px; --left-2: 240px;
        }

        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            /* 상단 여백 축소 */
            padding: 20px 32px 32px 32px; 
            font-size: 14px; 
            -webkit-font-smoothing: antialiased;
        }
        
        .container { max-width: 1600px; margin: 0 auto; }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 8px; border: 2px solid var(--surface); }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

        /* 헤더 및 툴바 (수직 중앙 정렬 반영) */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; /* 수직 중앙 정렬 */
            margin-bottom: 24px; 
        }
        
        .title-wrapper { display: flex; align-items: center; gap: 10px; }
        .title-wrapper h2 { 
            margin: 0; 
            font-size: 22px; 
            font-weight: 700; 
            letter-spacing: -0.02em; 
            color: var(--primary);
        }
        
        .toolbar { 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            background: var(--surface); 
            padding: 10px 16px; 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border); 
        }
        
        /* 공통 폼 요소 스타일 */
        input[type="month"], select, input[type="date"] { 
            padding: 8px 12px; 
            border: 1px solid var(--border); 
            border-radius: var(--radius-md); 
            font-family: inherit; 
            font-size: 14px; 
            outline: none; 
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
            background-color: var(--surface);
        }
        input[type="month"]:focus, select:focus, input[type="date"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        
        /* 버튼 스타일 고급화 */
        .btn { 
            padding: 8px 16px; 
            border-radius: var(--radius-md); 
            font-family: inherit; 
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            border: none; 
            transition: all 0.2s ease; 
        }
        .btn-primary { 
            background: var(--accent); 
            color: white; 
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }
        .btn-primary:hover { 
            background: var(--accent-hover); 
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.25);
        }
        .btn-outline { 
            background: white; 
            border: 1px solid var(--border); 
            color: var(--text-main); 
        }
        .btn-outline:hover { 
            background: var(--bg-color); 
            border-color: var(--border-hover);
        }
        .btn-danger-outline { 
            color: #DC2626; 
            border: 1px solid #FECACA; 
            background: white; 
            margin-left: 8px; 
        }
        .btn-danger-outline:hover { 
            background: #FEF2F2; 
            border-color: #F87171;
        }

        /* 뷰 토글 버튼 */
        .view-toggle { 
            display: flex; 
            background: var(--bg-color); 
            padding: 4px; 
            border-radius: var(--radius-md); 
            border: 1px solid var(--border); 
            margin-left: 8px; 
        }
        .view-toggle button { 
            background: transparent; 
            border: none; 
            padding: 6px 16px; 
            border-radius: 6px; 
            font-weight: 600; 
            color: var(--text-muted); 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .view-toggle button.active { 
            background: var(--surface); 
            color: var(--accent); 
            box-shadow: var(--shadow-sm); 
        }

        /* KPI 요약 카드 */
        .summary-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
            margin-bottom: 24px; 
        }
        .summary-card { 
            background: var(--surface); 
            padding: 24px; 
            border-radius: var(--radius-xl); 
            border: 1px solid var(--border); 
            box-shadow: var(--shadow-sm); 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .summary-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .summary-label { 
            font-size: 13px; 
            font-weight: 600; 
            color: var(--text-muted); 
            margin-bottom: 8px;
        }
        .summary-value { 
            font-size: 28px; 
            font-weight: 700; 
            color: var(--primary); 
            letter-spacing: -0.02em;
        }
        .summary-value span { 
            font-size: 14px; 
            font-weight: 500; 
            color: var(--text-muted); 
            margin-left: 4px;
        }

        /* 테이블 래퍼 */
        .table-card { 
            background: var(--surface); 
            border-radius: var(--radius-xl); 
            border: 1px solid var(--border); 
            box-shadow: var(--shadow-md); 
            overflow-x: auto; 
        }
        table { 
            border-collapse: separate; 
            border-spacing: 0; 
            width: max-content; 
            min-width: 100%; 
            text-align: center; 
            white-space: nowrap; 
        }
        th, td { 
            border-bottom: 1px solid var(--border); 
            border-right: 1px solid var(--border); 
            vertical-align: middle; 
            padding: 0; 
        }
        th { 
            background-color: #F1F5F9; 
            font-weight: 600; 
            color: #475569;
            padding: 0; 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            height: 48px; 
        }
        th > span { 
            display: block; 
            padding: 14px 16px; 
            pointer-events: none; 
        }

        /* 동적 너비 및 틀고정 */
        .dyn-col-0 { width: var(--cw-0); min-width: var(--cw-0); max-width: var(--cw-0); }
        .dyn-col-1 { width: var(--cw-1); min-width: var(--cw-1); max-width: var(--cw-1); }
        .dyn-col-2 { width: var(--cw-2); min-width: var(--cw-2); max-width: var(--cw-2); }
        .dyn-col-3 { width: var(--cw-3); min-width: var(--cw-3); max-width: var(--cw-3); }
        .dyn-col-4 { width: var(--cw-4); min-width: var(--cw-4); max-width: var(--cw-4); }
        .dyn-col-5 { width: var(--cw-5); min-width: var(--cw-5); max-width: var(--cw-5); }
        .dyn-col-6 { width: var(--cw-6); min-width: var(--cw-6); max-width: var(--cw-6); }
        .dyn-col-7 { width: var(--cw-7); min-width: var(--cw-7); max-width: var(--cw-7); }
        .dyn-col-8 { width: var(--cw-8); min-width: var(--cw-8); max-width: var(--cw-8); }

        .fixed-col-0 { position: sticky !important; left: var(--left-0); z-index: 5; background: var(--surface); }
        .fixed-col-1 { position: sticky !important; left: var(--left-1); z-index: 5; background: var(--surface); }
        .fixed-col-2 { position: sticky !important; left: var(--left-2); z-index: 5; background: var(--surface); border-right: 2px solid var(--border-hover) !important; }
        
        th.fixed-col-0, th.fixed-col-1, th.fixed-col-2 { z-index: 15; background: #F1F5F9; }
        tbody tr:hover td:not(.fixed-col-0):not(.fixed-col-1):not(.fixed-col-2) { background-color: #F8FAFC; }

        /* 컬럼 리사이저 */
        .resizer { 
            position: absolute; right: 0; top: 0; width: 6px; height: 100%; 
            cursor: col-resize; z-index: 20; user-select: none; transition: background-color 0.2s;
        }
        .resizer:hover, .resizer.active { background-color: var(--accent); opacity: 0.3; }

        /* 셀 에디팅 */
        .editable-cell { cursor: pointer; position: relative; transition: background-color 0.2s; }
        .editable-cell:hover { background-color: var(--accent-light); }
        .display-value { 
            display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; 
            min-height: 48px; padding: 0 12px; box-sizing: border-box; font-size: 13px; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .edit-input { 
            width: 100%; height: 100%; min-height: 48px; box-sizing: border-box; 
            border: 2px solid var(--accent); text-align: center; font-size: 13px; 
            font-family: inherit; outline: none; background: #fff; padding: 0 8px; 
            color: var(--text-main); font-weight: 500;
        }
        .edit-input::-webkit-outer-spin-button, .edit-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* 시간 렌더링 상태 */
        .time-cell { min-width: 65px; }
        .weekend { background-color: var(--weekend-bg); color: var(--text-muted); }
        .entered-hours { background-color: var(--success-bg) !important; color: var(--success-text); font-weight: 600; }
        .hidden { display: none !important; }

        /* 푸터 액션 */
        .tfoot-actions { 
            padding: 16px 20px; background: #F8FAFC; text-align: left; 
            border-right: none; position: sticky; left: 0; z-index: 10; 
            border-top: 1px solid var(--border); border-bottom-left-radius: var(--radius-xl);
        }

        /* 모달 스타일 (블러 효과 및 페이드) */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); 
            display: flex; align-items: center; justify-content: center; z-index: 100; 
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal-content { 
            background: var(--surface); padding: 32px; border-radius: var(--radius-xl); 
            width: 420px; box-shadow: var(--shadow-lg); transform: translateY(15px); transition: all 0.3s ease;
        }
        .modal-overlay.show .modal-content { transform: translateY(0); }
        .modal-header { font-size: 20px; font-weight: 700; margin-bottom: 24px; color: var(--primary); letter-spacing: -0.02em; }
        
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; font-weight: 600; color: var(--text-main); }
        
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 28px; }
        .result-box { margin-top: 24px; padding: 16px 20px; background: var(--bg-color); border: 1px solid var(--border); border-radius: var(--radius-lg); }
        .result-box p { margin: 10px 0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .result-box p strong { color: var(--accent); font-size: 18px; font-weight: 700; }
        hr.divider { border: 0; border-top: 1px dashed var(--border-hover); margin: 16px 0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 헤더 수직 정렬 완료 -->
        <div class="header">
            <div class="title-wrapper">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                    <circle cx="12" cy="16" r="3.5"></circle>
                    <polyline points="12 14 12 16 13.5 16"></polyline>
                </svg>
                <h2>TIME SHEET</h2>
            </div>
            
            <div class="toolbar">
                <input type="month" id="monthPicker">
                <button id="btnOpenCalc" class="btn btn-primary">기간 산정</button>
                <div class="view-toggle">
                    <button id="btnMonth" class="active" onclick="setViewMode('month')">월간</button>
                    <button id="btnWeek" onclick="setViewMode('week')">주간</button>
                </div>
                <select id="weekSelector" class="hidden" onchange="changeWeek()"></select>
            </div>
        </div>

        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-label">기준 워킹데이 (해당 월)</div>
                <div class="summary-value" id="kpi-working-days">0 <span>일 (0시간)</span></div>
            </div>
            <div class="summary-card">
                <div class="summary-label">총 입력 시간 (해당 월)</div>
                <div class="summary-value" id="kpi-total-hours">0.0 <span>시간</span></div>
            </div>
            <div class="summary-card">
                <div class="summary-label">월간 M/M 산출</div>
                <div class="summary-value" id="kpi-total-mm" style="color: #2563EB;">0.00 <span>M/M</span></div>
            </div>
        </div>

        <div class="table-card">
            <table id="timesheetTable">
                <thead><tr id="headerRow"></tr></thead>
                <tbody id="tableBody"></tbody>
                <tfoot id="tableFoot">
                    <tr>
                        <td id="tfootActionCell" class="tfoot-actions">
                            <button class="btn btn-outline" onclick="addRow()">+ 라인 추가</button>
                            <button class="btn btn-danger-outline" onclick="removeRow()">- 마지막 라인 삭제</button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <!-- M/M 산정 모달 -->
    <div id="calcModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">기간별 M/M 산정계산</div>
            <div class="form-group"><label>시작일</label><input type="date" id="calcStart"></div>
            <div class="form-group"><label>종료일</label><input type="date" id="calcEnd"></div>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeCalcModal()">취소</button>
                <button class="btn btn-primary" onclick="executeCalculation()">계산하기</button>
            </div>
            <div id="calcResult" class="result-box hidden"></div>
        </div>
    </div>

    <script>
        const state = {
            year: 2026, month: 8, viewMode: 'month', selectedWeekIndex: 0, weeks: [],
            data: [] // IndexedDB 로드
        };

        const fixedColumns = ["귀속처유형", "귀속처코드", "귀속처명칭", "요소기술", "CI#", "유/무상", "단계", "업무내용", "휴무구분"];
        const dayNames = ["일", "월", "화", "수", "목", "금", "토"];

        let colWidths = [100, 140, 250, 100, 100, 80, 80, 200, 80];

        // --- IndexedDB ---
        const dbName = "TimeSheetDB";
        const storeName = "timesheets";
        let db;

        function initDB(callback) {
            const request = indexedDB.open(dbName, 1);
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains(storeName)) db.createObjectStore(storeName, { keyPath: "id" });
            };
            request.onsuccess = (e) => { db = e.target.result; callback(); };
            request.onerror = (e) => console.error("IndexedDB 연결 실패:", e);
        }

        function loadData(callback) {
            const transaction = db.transaction([storeName], "readonly");
            const store = transaction.objectStore(storeName);
            const request = store.get("main");
            request.onsuccess = (e) => {
                if (e.target.result && e.target.result.data) { state.data = e.target.result.data; } 
                else { while(state.data.length < 5) addEmptyRowToState(); }
                callback();
            };
        }

        function saveData() {
            if (!db) return;
            const transaction = db.transaction([storeName], "readwrite");
            const store = transaction.objectStore(storeName);
            store.put({ id: "main", data: state.data });
        }

        function addEmptyRowToState() {
            let emptyRow = { hours: {} };
            fixedColumns.forEach(col => emptyRow[col] = "");
            state.data.push(emptyRow);
        }

        function applyColWidths() {
            const root = document.documentElement;
            let leftAccum = 0;
            colWidths.forEach((w, idx) => {
                root.style.setProperty(`--cw-${idx}`, w + 'px');
                if (idx < 3) {
                    root.style.setProperty(`--left-${idx}`, leftAccum + 'px');
                    leftAccum += w;
                }
            });
        }

        function init() {
            applyColWidths();
            const picker = document.getElementById('monthPicker');
            picker.value = `${state.year}-${String(state.month).padStart(2, '0')}`;
            picker.addEventListener('change', (e) => {
                const [y, m] = e.target.value.split('-');
                state.year = parseInt(y); state.month = parseInt(m); state.selectedWeekIndex = 0;
                calculateWeeks(); renderTable();
            });
            document.getElementById('btnOpenCalc').addEventListener('click', openCalcModal);
            
            initDB(() => { loadData(() => { calculateWeeks(); renderTable(); }); });
        }

        function calculateWeeks() {
            state.weeks = []; let currentWeek = []; const daysInMonth = new Date(state.year, state.month, 0).getDate();
            for (let i = 1; i <= daysInMonth; i++) {
                const dateObj = new Date(state.year, state.month - 1, i);
                currentWeek.push({ day: i, dayOfWeek: dateObj.getDay() });
                if (dateObj.getDay() === 6 || i === daysInMonth) { state.weeks.push([...currentWeek]); currentWeek = []; }
            }
            updateWeekSelector();
        }

        function setViewMode(mode) {
            state.viewMode = mode;
            document.getElementById('btnMonth').classList.toggle('active', mode === 'month');
            document.getElementById('btnWeek').classList.toggle('active', mode === 'week');
            document.getElementById('weekSelector').classList.toggle('hidden', mode !== 'week');
            renderTable();
        }

        function changeWeek() { state.selectedWeekIndex = parseInt(document.getElementById('weekSelector').value); renderTable(); }

        function updateWeekSelector() {
            const selector = document.getElementById('weekSelector'); selector.innerHTML = '';
            state.weeks.forEach((week, idx) => {
                const opt = document.createElement('option'); opt.value = idx;
                opt.textContent = `${idx + 1}주차 (${state.month}/${week[0].day} ~ ${state.month}/${week[week.length-1].day})`;
                if (idx === state.selectedWeekIndex) opt.selected = true; selector.appendChild(opt);
            });
        }

        function addRow() { addEmptyRowToState(); saveData(); renderTable(); }
        function removeRow() {
            if (state.data.length > 1) { state.data.pop(); saveData(); renderTable(); } 
            else { alert("더 이상 삭제할 라인이 없습니다."); }
        }

        let startX, startWidth, resizingColIdx = -1;
        function startResize(e, idx) {
            e.preventDefault(); e.stopPropagation();
            startX = e.clientX; startWidth = colWidths[idx]; resizingColIdx = idx;
            document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
            document.addEventListener('mousemove', onMouseMove); document.addEventListener('mouseup', onMouseUp);
        }
        function onMouseMove(e) {
            if (resizingColIdx === -1) return;
            const deltaX = e.clientX - startX;
            let newWidth = Math.max(60, startWidth + deltaX);
            colWidths[resizingColIdx] = newWidth; applyColWidths();
        }
        function onMouseUp(e) {
            resizingColIdx = -1; document.body.style.cursor = ''; document.body.style.userSelect = '';
            document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp);
        }

        function getStandardMonthlyHours(year, month) {
            const daysInMonth = new Date(year, month, 0).getDate(); let workingDays = 0;
            for (let i = 1; i <= daysInMonth; i++) {
                const dayOfWeek = new Date(year, month - 1, i).getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) workingDays++;
            }
            return { workingDays, standardHours: workingDays * 8 };
        }

        function updateKPIs() {
            const { workingDays, standardHours } = getStandardMonthlyHours(state.year, state.month);
            let totalMonthlyHours = 0;
            state.data.forEach(row => {
                for (const dateStr in row.hours) {
                    if (dateStr.startsWith(`${state.year}-${String(state.month).padStart(2, '0')}`)) { totalMonthlyHours += parseFloat(row.hours[dateStr]); }
                }
            });
            const totalMM = standardHours > 0 ? (totalMonthlyHours / standardHours) : 0;
            document.getElementById('kpi-working-days').innerHTML = `${workingDays} <span>일 (${standardHours}시간)</span>`;
            document.getElementById('kpi-total-hours').innerHTML = `${totalMonthlyHours.toFixed(1)} <span>시간</span>`;
            document.getElementById('kpi-total-mm').innerHTML = `${totalMM.toFixed(2)} <span>M/M</span>`;
        }

        function activateEditor(td, rowIndex, key, isTimeCell = false) {
            if (td.querySelector('.edit-input')) return; 
            let currentVal = isTimeCell ? (state.data[rowIndex].hours[key] || '') : (state.data[rowIndex][key] || '');
            let inputType = isTimeCell ? 'number' : 'text';
            let extraAttrs = isTimeCell ? 'step="0.5" min="0" max="24"' : '';
            td.innerHTML = `<input type="${inputType}" class="edit-input" value="${currentVal}" ${extraAttrs}>`;
            const input = td.querySelector('input'); input.focus();
            
            const saveAndClose = () => {
                if (isTimeCell) {
                    const num = parseFloat(input.value);
                    if (!isNaN(num) && num > 0) state.data[rowIndex].hours[key] = num;
                    else delete state.data[rowIndex].hours[key];
                } else { state.data[rowIndex][key] = input.value; }
                
                saveData(); renderTable(); 
            };
            input.addEventListener('blur', saveAndClose);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
        }

        function renderTable() {
            const headerRow = document.getElementById('headerRow');
            const tableBody = document.getElementById('tableBody');
            let daysToRender = state.viewMode === 'month' ? [].concat(...state.weeks) : (state.weeks[state.selectedWeekIndex] || []);

            document.getElementById('tfootActionCell').colSpan = fixedColumns.length + daysToRender.length;

            headerRow.innerHTML = '';
            fixedColumns.forEach((col, idx) => {
                const th = document.createElement('th'); th.classList.add(`dyn-col-${idx}`); 
                if (idx < 3) th.classList.add(`fixed-col-${idx}`);
                th.innerHTML = `<span>${col}</span>`;
                
                const resizer = document.createElement('div'); resizer.className = 'resizer';
                resizer.onmousedown = (e) => startResize(e, idx); th.appendChild(resizer);
                headerRow.appendChild(th);
            });
            daysToRender.forEach(d => {
                const th = document.createElement('th'); th.innerHTML = `<span>${d.day}일 ${dayNames[d.dayOfWeek]}</span>`;
                th.classList.add('time-cell');
                if (d.dayOfWeek === 0 || d.dayOfWeek === 6) th.classList.add('weekend');
                headerRow.appendChild(th);
            });

            tableBody.innerHTML = '';
            state.data.forEach((row, rowIndex) => {
                const tr = document.createElement('tr');
                fixedColumns.forEach((col, idx) => {
                    const td = document.createElement('td');
                    td.classList.add('editable-cell', 'text-cell', `dyn-col-${idx}`);
                    if (idx < 3) td.classList.add(`fixed-col-${idx}`);
                    
                    const val = row[col];
                    td.innerHTML = `<div class="display-value">${val || ''}</div>`;
                    td.onclick = () => activateEditor(td, rowIndex, col, false);
                    tr.appendChild(td);
                });

                daysToRender.forEach(d => {
                    const dateStr = `${state.year}-${String(state.month).padStart(2, '0')}-${String(d.day).padStart(2, '0')}`;
                    const td = document.createElement('td');
                    td.classList.add('editable-cell', 'time-cell');
                    if (d.dayOfWeek === 0 || d.dayOfWeek === 6) td.classList.add('weekend');
                    const val = row.hours[dateStr];
                    if (val) { td.classList.add('entered-hours'); td.innerHTML = `<div class="display-value">승인- ${val.toFixed(1)}</div>`; } 
                    else { td.innerHTML = `<div class="display-value"></div>`; }
                    td.onclick = () => activateEditor(td, rowIndex, dateStr, true);
                    tr.appendChild(td);
                });
                tableBody.appendChild(tr);
            });
            updateKPIs();
        }

        const calcModal = document.getElementById('calcModal');
        const calcResultBox = document.getElementById('calcResult');

        function openCalcModal() {
            document.getElementById('calcStart').value = `${state.year}-${String(state.month).padStart(2, '0')}-01`;
            const lastDay = new Date(state.year, state.month, 0).getDate();
            document.getElementById('calcEnd').value = `${state.year}-${String(state.month).padStart(2, '0')}-${lastDay}`;
            calcResultBox.classList.add('hidden'); 
            calcModal.classList.add('show');
        }

        function closeCalcModal() { calcModal.classList.remove('show'); }

        function executeCalculation() {
            const startStr = document.getElementById('calcStart').value;
            const endStr = document.getElementById('calcEnd').value;
            if (!startStr || !endStr || startStr > endStr) { alert("올바른 시작일과 종료일을 선택해주세요."); return; }

            let start = new Date(startStr); let end = new Date(endStr); let totalHoursRange = 0; let monthMap = {}; 

            for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                let y = d.getFullYear(); let m = d.getMonth() + 1; let day = d.getDate();
                let dateKey = `${y}-${String(m).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                let monthKey = `${y}-${String(m).padStart(2, '0')}`;
                if (!monthMap[monthKey]) monthMap[monthKey] = { hours: 0, standardHours: getStandardMonthlyHours(y, m).standardHours };
                state.data.forEach(row => { if (row.hours && row.hours[dateKey]) { let h = parseFloat(row.hours[dateKey]); monthMap[monthKey].hours += h; totalHoursRange += h; } });
            }

            let totalMMRange = 0;
            for (let key in monthMap) { let mData = monthMap[key]; if (mData.standardHours > 0) totalMMRange += (mData.hours / mData.standardHours); }
            calcResultBox.innerHTML = `
                <p>조회 기간 <span style="color:var(--text-muted);">${startStr} ~ ${endStr}</span></p>
                <hr class="divider">
                <p>총 입력 시간 <strong style="color:var(--text-main);">${totalHoursRange.toFixed(1)} 시간</strong></p>
                <p>산출 총 M/M <strong>${totalMMRange.toFixed(2)} M/M</strong></p>`;
            calcResultBox.classList.remove('hidden');
        }

        init();
    </script>
</body>
</html>
