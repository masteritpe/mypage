<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to Page</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // PDF.js 워커(Worker) 설정
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    :root {
      --bg-body: #F9FAFB;
      --bg-surface: #FFFFFF;
      --border-light: #F3F4F6;
      --border-base: #E5E7EB;
      --text-main: #111827;
      --text-muted: #6B7280;
      --primary: #EF4444; 
      --primary-hover: #DC2626;
      --secondary: #FFFFFF;
      --secondary-hover: #F9FAFB;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding: 40px;
      -webkit-font-smoothing: antialiased;
    }
    
    body.dragging {
      user-select: none; /* 드래그 중 텍스트 선택 방지 */
    }

    .dashboard-header {
      max-width: 100%;
      margin: 0 auto 24px auto;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .title-area i { font-size: 28px; color: var(--primary); }
    h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    input[type="file"] { display: none; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: var(--radius-md);
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
    }
    .btn-primary {
      background: var(--primary); color: white;
      box-shadow: var(--shadow-sm);
    }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    
    .btn-outline {
      background: var(--secondary); color: var(--text-main);
      border-color: var(--border-base); box-shadow: var(--shadow-sm);
    }
    .btn-outline:hover { background: var(--secondary-hover); border-color: #D1D5DB; }

    /* 백업 컨트롤 영역 스타일 */
    .backup-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      padding: 6px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-base);
      box-shadow: var(--shadow-sm);
    }

    .instructions {
      display: flex; gap: 20px; align-items: center;
      font-size: 13px; color: var(--text-muted);
      background: var(--bg-surface); padding: 12px 20px;
      border-radius: var(--radius-md); border: 1px solid var(--border-base);
      flex-wrap: wrap;
    }
    .instructions span { display: inline-flex; align-items: center; gap: 6px; }
    .instructions i { font-size: 16px; }

    #content-wrapper {
      max-width: 100%; margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-lg);
      padding: 24px;
      min-height: 400px;
      box-shadow: var(--shadow-md);
      position: relative;
    }

    .empty-msg {
      padding: 80px 20px; text-align: center; color: var(--text-muted);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      height: 100%; justify-content: center;
    }
    .empty-msg i { font-size: 40px; color: #D1D5DB; }
    
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .ph-spinner { animation: spin 1s linear infinite; color: var(--primary) !important; }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .image-card {
      background: var(--bg-body);
      border: 2px solid var(--border-base);
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .image-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    /* 카드 좌측 상단 커스텀 체크박스 */
    .card-checkbox {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background-color: white;
      border: 1px solid var(--border-base);
      cursor: pointer;
      z-index: 10;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }
    
    /* 카드에 마우스를 올렸을 때 체크박스 시각적 피드백 */
    .image-card:hover .card-checkbox {
      border-color: #9CA3AF;
    }
    .card-checkbox:hover {
      background-color: #F3F4F6;
    }

    /* 선택된 카드 스타일 및 체크박스 활성화 스타일 */
    .image-card.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
    }
    .image-card.selected .card-checkbox {
      background-color: var(--primary);
      border-color: var(--primary);
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" viewBox="0 0 256 256"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path></svg>');
      background-size: 16px;
      background-position: center;
      background-repeat: no-repeat;
    }

    .image-preview {
      width: 100%;
      height: 240px; 
      object-fit: contain;
      background-color: #f3f4f6;
      border-bottom: 1px solid var(--border-light);
      cursor: zoom-in;
    }

    .image-info {
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-body);
    }

    .image-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px; 
    }

    .image-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover {
      background: var(--border-base);
      color: var(--primary);
    }

    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #111827; color: white;
      padding: 10px 20px; border-radius: 99px; font-size: 14px;
      box-shadow: var(--shadow-md); opacity: 0; visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
      z-index: 3000;
    }
    #toast.show { opacity: 1; visibility: visible; }

    /* 모달 (전체화면 이미지 뷰어) 스타일 */
    .modal-overlay {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .modal-content {
      max-width: 90%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: zoomIn 0.2s ease-out;
      background: white; 
    }
    
    .modal-controls {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      animation: zoomIn 0.2s ease-out;
    }
    .modal-controls .btn-primary { background: white; color: black; }
    .modal-controls .btn-outline {
      background: rgba(255, 255, 255, 0.1); color: white;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .modal-controls .btn-outline:hover { background: rgba(255, 255, 255, 0.2); }

    .modal-close {
      position: absolute;
      top: 20px; right: 30px;
      color: white; font-size: 40px; font-weight: 300;
      cursor: pointer; transition: color 0.2s; line-height: 1;
    }
    .modal-close:hover { color: #9CA3AF; }
    
    @keyframes zoomIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    
    /* 드래그 선택 영역(Marquee) 박스 */
    #selection-marquee {
      position: absolute;
      border: 1px solid var(--primary);
      background: rgba(239, 68, 68, 0.2);
      display: none;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <div class="dashboard-header">
    <div class="header-top">
      <div class="title-area">
        <i class="ph ph-file-pdf"></i>
        <h2>PDF to Page</h2>
      </div>
      
      <div class="actions">
        <label for="upload-pdf" class="btn btn-primary">
          <i class="ph ph-upload-simple"></i> 파일 불러오기
        </label>
        <input type="file" id="upload-pdf" accept=".pdf" />
        
        <button class="btn btn-outline" id="btn-clear" onclick="clearData()" style="display:none;">
          <i class="ph ph-trash"></i> 초기화
        </button>

        <div id="backup-controls" class="backup-group" style="display:none;">
          <button class="btn btn-outline" onclick="selectAllPages()" style="padding: 6px 12px; font-size: 13px;">전체 선택</button>
          <span style="color: var(--text-muted); font-size: 14px; margin: 0 8px;">
            <span id="selected-count" style="font-weight: 600; color: var(--primary);">0</span>개 선택됨
          </span>
          <button class="btn btn-primary" onclick="backupSelectedJSON()" style="padding: 6px 12px; font-size: 13px;">
            <i class="ph ph-file-arrow-down"></i> 선택 백업
          </button>
        </div>
      </div>
    </div>

    <!-- UI 설명 업데이트 -->
    <div class="instructions">
      <span><i class="ph ph-mouse-left"></i> <strong>드래그 또는 체크박스</strong>: 선택 (<strong>Ctrl+드래그</strong>: 추가 선택)</span>
      <span style="color: #D1D5DB;">|</span>
      <span><i class="ph ph-keyboard"></i> <strong>ESC</strong>: 전체 해제</span>
      <span style="color: #D1D5DB;">|</span>
      <span><i class="ph ph-arrows-out"></i> 이미지 클릭: 크게 보기</span>
    </div>
  </div>

  <div id="content-wrapper">
    <div class="empty-msg" id="empty-state">
      <i class="ph ph-file-pdf"></i>
      PDF 파일(.pdf)을 업로드하여 각 페이지를 이미지로 변환하세요
    </div>
    <div class="image-grid" id="image-grid" style="display: none;"></div>
  </div>

  <div id="toast">복사되었습니다!</div>

  <div id="image-modal" class="modal-overlay" onclick="closeModal()">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <img id="modal-img" class="modal-content" src="" onclick="event.stopPropagation();">
    
    <div class="modal-controls" onclick="event.stopPropagation();">
      <button class="btn btn-primary" onclick="copyModalImage()">
        <i class="ph ph-copy"></i> 이미지 복사
      </button>
      <button class="btn btn-outline" onclick="downloadModalImage()">
        <i class="ph ph-download-simple"></i> 다운로드
      </button>
    </div>
  </div>
  
  <div id="selection-marquee"></div>

  <script>
    const uploadInput = document.getElementById('upload-pdf');
    const emptyState = document.getElementById('empty-state');
    const imageGrid = document.getElementById('image-grid');
    const btnClear = document.getElementById('btn-clear');
    const backupControls = document.getElementById('backup-controls');
    const selectedCountEl = document.getElementById('selected-count');
    const selectionMarquee = document.getElementById('selection-marquee');
    
    let extractedImages = [];
    let selectedIndices = new Set();
    let currentModalIndex = -1;

    // 드래그 선택 관련 변수
    let isDragging = false;
    let dragThresholdMet = false;
    let startX = 0, startY = 0;
    let initialSelection = new Set();

    // 기본 이미지 드래그 방지
    document.addEventListener('dragstart', e => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });

    uploadInput.addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      extractedImages = [];
      selectedIndices.clear();
      
      emptyState.innerHTML = `
        <i class="ph ph-spinner"></i>
        <div style="text-align:center">
          <strong>PDF 변환 중입니다...</strong><br>
          <span style="font-size:13px; color:#9CA3AF">페이지 수에 따라 몇 초 정도 걸릴 수 있습니다.</span>
        </div>`;
      emptyState.style.display = 'flex';
      imageGrid.style.display = 'none';
      btnClear.style.display = 'none';
      backupControls.style.display = 'none';

      try {
        const arrayBuffer = await file.arrayBuffer();
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        const pdf = await loadingTask.promise;
        
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 2.0 }); 
          
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          
          ctx.fillStyle = "white";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          await page.render({ canvasContext: ctx, viewport: viewport }).promise;
          
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
          const originalName = file.name.replace(/\.[^/.]+$/, "");
          
          extractedImages.push({
            name: `${originalName}_page_${pageNum}.png`,
            mimeType: 'image/png',
            blob: blob,
            url: URL.createObjectURL(blob)
          });
        }
        renderImages();
      } catch (err) {
        console.error('PDF Processing Error:', err);
        alert('PDF 파일을 처리하는 중 오류가 발생했습니다.');
        clearData();
      } finally {
        uploadInput.value = '';
      }
    });

    function renderImages() {
      if (extractedImages.length === 0) {
        clearData();
        return;
      }

      emptyState.style.display = 'none';
      imageGrid.style.display = 'grid';
      btnClear.style.display = 'inline-flex';
      backupControls.style.display = 'flex';
      imageGrid.innerHTML = '';

      extractedImages.forEach((img, index) => {
        const card = document.createElement('div');
        card.className = 'image-card';
        card.setAttribute('data-index', index);
        
        card.innerHTML = `
          <div class="card-checkbox" data-index="${index}" title="선택/해제"></div>
          <img src="${img.url}" class="image-preview" data-index="${index}" title="클릭하여 크게 보기">
          <div class="image-info">
            <span class="image-name" title="${img.name}">${img.name}</span>
            <div class="image-actions">
              <button class="icon-btn action-copy" data-index="${index}" title="복사하기">
                <i class="ph ph-copy"></i>
              </button>
              <button class="icon-btn action-download" data-index="${index}" title="다운로드">
                <i class="ph ph-download-simple"></i>
              </button>
            </div>
          </div>
        `;
        imageGrid.appendChild(card);
      });
      
      selectAllPages(); 
    }

    // 클릭 이벤트 위임 (체크박스 클릭과 이미지 클릭 구분)
    imageGrid.addEventListener('click', e => {
      const copyBtn = e.target.closest('.action-copy');
      const downBtn = e.target.closest('.action-download');
      const checkbox = e.target.closest('.card-checkbox');
      const previewImg = e.target.closest('.image-preview');
      
      if (copyBtn) {
        copyImage(parseInt(copyBtn.dataset.index));
        return;
      }
      if (downBtn) {
        downloadImage(parseInt(downBtn.dataset.index));
        return;
      }

      // 드래그 중 발생한 클릭은 무시
      if (dragThresholdMet) return;

      // 좌측 상단 체크박스를 클릭했을 때 (선택/해제 토글)
      if (checkbox) {
        const idx = parseInt(checkbox.dataset.index);
        if (selectedIndices.has(idx)) {
          selectedIndices.delete(idx);
        } else {
          selectedIndices.add(idx);
        }
        updateSelectionVisuals();
        return;
      }

      // 썸네일 이미지를 클릭했을 때 (모달 띄우기)
      if (previewImg) {
        viewImageFullScreen(parseInt(previewImg.dataset.index));
        return;
      }
    });

    // --- 마우스 드래그 선택 기능 (Marquee) ---
    document.addEventListener('mousedown', e => {
      if (e.button !== 0) return; // 좌클릭만 허용
      const contentWrapper = document.getElementById('content-wrapper');
      if (!contentWrapper.contains(e.target)) return; 
      if (e.target.closest('.image-actions') || e.target.closest('.card-checkbox')) return; 

      isDragging = true;
      dragThresholdMet = false;
      startX = e.pageX;
      startY = e.pageY;
      document.body.classList.add('dragging');
      
      // Ctrl, Shift, Cmd 키를 누르지 않았을 때만 기존 선택 범위를 초기화
      if (!e.ctrlKey && !e.shiftKey && !e.metaKey) {
        initialSelection.clear();
      } else {
        // Ctrl 누르고 드래그 시 기존 선택 상태를 기억하여 추가 반영
        initialSelection = new Set(selectedIndices);
      }
    });

    document.addEventListener('mousemove', e => {
      if (!isDragging) return;

      const currentX = e.pageX;
      const currentY = e.pageY;

      // 움직인 거리가 5px 이상일 때만 드래그로 판정
      if (!dragThresholdMet) {
        const dist = Math.abs(currentX - startX) + Math.abs(currentY - startY);
        if (dist > 5) {
          dragThresholdMet = true;
          selectionMarquee.style.display = 'block';
        } else {
          return;
        }
      }

      const x = Math.min(startX, currentX);
      const y = Math.min(startY, currentY);
      const w = Math.abs(currentX - startX);
      const h = Math.abs(currentY - startY);

      selectionMarquee.style.left = x + 'px';
      selectionMarquee.style.top = y + 'px';
      selectionMarquee.style.width = w + 'px';
      selectionMarquee.style.height = h + 'px';

      const marqueeRect = selectionMarquee.getBoundingClientRect();
      const cards = document.querySelectorAll('.image-card');

      // 드래그 시작 시점의 선택 상태를 복사해 둔 후 겹치는 카드 추가
      selectedIndices = new Set(initialSelection);

      cards.forEach(card => {
        const cardRect = card.getBoundingClientRect();
        const index = parseInt(card.getAttribute('data-index'));

        const isOverlapping = !(
          marqueeRect.right < cardRect.left || 
          marqueeRect.left > cardRect.right || 
          marqueeRect.bottom < cardRect.top || 
          marqueeRect.top > cardRect.bottom
        );

        if (isOverlapping) {
          selectedIndices.add(index);
        }
      });
      updateSelectionVisuals();
    });

    document.addEventListener('mouseup', e => {
      if (isDragging) {
        isDragging = false;
        selectionMarquee.style.display = 'none';
        document.body.classList.remove('dragging');
      }
    });

    function updateSelectionVisuals() {
      document.querySelectorAll('.image-card').forEach(card => {
        const idx = parseInt(card.getAttribute('data-index'));
        if (selectedIndices.has(idx)) {
          card.classList.add('selected');
        } else {
          card.classList.remove('selected');
        }
      });
      selectedCountEl.innerText = selectedIndices.size;
    }
    // ------------------------------------

    function selectAllPages() {
      if (extractedImages.length === 0) return;
      selectedIndices.clear();
      extractedImages.forEach((_, i) => selectedIndices.add(i));
      updateSelectionVisuals();
    }

    function viewImageFullScreen(index) {
      currentModalIndex = index;
      const imgData = extractedImages[index];
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      
      modalImg.src = imgData.url;
      modal.style.display = 'flex';
    }

    function closeModal() {
      const modal = document.getElementById('image-modal');
      modal.style.display = 'none';
      currentModalIndex = -1;
    }

    // ESC 키 이벤트 수정 (모달 닫기 기능 외에 선택 영역 전체 해제 추가)
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        const modal = document.getElementById('image-modal');
        if (modal.style.display === 'flex' || modal.style.display === 'block') {
          closeModal();
        } else if (selectedIndices.size > 0) {
          // 모달이 꺼져있을 때 ESC를 누르면 선택 영역 초기화
          selectedIndices.clear();
          updateSelectionVisuals();
        }
      }
    });

    async function copyImage(index) {
      const imgData = extractedImages[index];
      try {
        const clipboardItem = new ClipboardItem({ [imgData.mimeType]: imgData.blob });
        await navigator.clipboard.write([clipboardItem]);
        showToast('이미지가 클립보드에 복사되었습니다.');
      } catch (err) {
        console.error('Clipboard copy failed:', err);
        alert('클립보드 복사에 실패했습니다.');
      }
    }

    function downloadImage(index) {
      const imgData = extractedImages[index];
      const a = document.createElement('a');
      a.href = imgData.url;
      a.download = imgData.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function copyModalImage() {
      if (currentModalIndex > -1) copyImage(currentModalIndex);
    }

    function downloadModalImage() {
      if (currentModalIndex > -1) downloadImage(currentModalIndex);
    }

    function clearData() {
      extractedImages.forEach(img => URL.revokeObjectURL(img.url)); 
      extractedImages = [];
      selectedIndices.clear();
      emptyState.innerHTML = `<i class="ph ph-file-pdf"></i>PDF 파일(.pdf)을 업로드하여 각 페이지를 이미지로 변환하세요`;
      emptyState.style.display = 'flex';
      imageGrid.style.display = 'none';
      btnClear.style.display = 'none';
      backupControls.style.display = 'none';
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function backupSelectedJSON() {
      if (selectedIndices.size === 0) {
        alert('백업할 페이지를 선택해주세요. (마우스 드래그로 선택 가능)');
        return;
      }
      
      const indicesToBackup = Array.from(selectedIndices).sort((a, b) => a - b);
      const selectedImages = indicesToBackup.map(idx => extractedImages[idx]);
      
      await processBackup(selectedImages, 'pdf_backup_');
    }

    async function processBackup(imagesArray, fileNamePrefix) {
      try {
        const imagesData = await Promise.all(
          imagesArray.map(async (img) => {
            const dataUrl = await blobToBase64(img.blob);
            return {
              name: img.name,
              mimeType: img.mimeType,
              dataUrl: dataUrl
            };
          })
        );

        const backupData = {
          version: "1.0",
          createdAt: new Date().toISOString(),
          totalCount: imagesData.length,
          images: imagesData
        };

        const jsonString = JSON.stringify(backupData, null, 2);
        const jsonBlob = new Blob([jsonString], { type: 'application/json' });
        const jsonUrl = URL.createObjectURL(jsonBlob);

        const a = document.createElement('a');
        a.href = jsonUrl;
        a.download = `${fileNamePrefix}${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(jsonUrl);

        showToast('JSON 백업 파일이 다운로드되었습니다.');
      } catch (err) {
        console.error('Backup failed:', err);
        alert('JSON 백업 생성 중 오류가 발생했습니다.');
      }
    }

    let toastTimeout;
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }
  </script>
</body>
</html>
