<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Flow</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    
    <style>
        :root {
            /* 라이트 테마 & 글래스모피즘 변수 */
            --bg-color: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #3b82f6;
            --header-height: 65px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text-primary);
            height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden; position: relative;
        }

        header {
            padding: 1rem 2rem;
            height: var(--header-height);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10;
        }

        header h1 {
            font-size: 1.25rem; font-weight: 600;
            background: linear-gradient(to right, #2563eb, #6366f1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        header p { font-size: 0.875rem; color: var(--text-secondary); }

        main {
            display: flex; flex: 1; padding: 1.5rem; gap: 1.5rem; 
            height: calc(100vh - var(--header-height));
        }

        .panel {
            flex: 1; background: var(--glass-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 12px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05);
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        .panel-header {
            padding: 0.75rem 1.5rem; background: rgba(0, 0, 0, 0.03);
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 0.05em;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* 단축키 팁 */
        .shortcut-tip {
            font-size: 0.65rem; color: #94a3b8; font-weight: normal; margin-left: 10px;
            text-transform: none; letter-spacing: normal;
        }

        /* 폰트 선택기 & 힌트(버튼) 디자인 */
        input.font-selector {
            background: rgba(255, 255, 255, 0.8); border: 1px solid var(--glass-border);
            border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.75rem;
            color: var(--text-primary); outline: none; font-family: inherit; width: 140px;
        }
        input.font-selector::placeholder { color: #94a3b8; }

        .hint-wrap { display: flex; align-items: center; gap: 8px; }

        .hint {
            font-size: 0.7rem; color: var(--accent-color);
            background: rgba(59, 130, 246, 0.1); padding: 0.3rem 0.6rem;
            border-radius: 20px; text-transform: none; letter-spacing: normal;
            cursor: pointer; transition: background 0.2s ease, color 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .hint:hover { background: rgba(59, 130, 246, 0.2); }

        /* 기능 버튼 특별 스타일 */
        #clean-btn {
            background: rgba(245, 158, 11, 0.1); color: #d97706;
            font-weight: 600;
        }
        #clean-btn:hover { background: rgba(245, 158, 11, 0.2); }

        #copy-rich-btn {
            background: rgba(16, 185, 129, 0.1); color: #059669;
            font-weight: 600;
        }
        #copy-rich-btn:hover { background: rgba(16, 185, 129, 0.2); }

        /* Toast UI Editor 스타일 & 표 안의 공백 방지 CSS */
        #wysiwyg-editor { flex: 1; background: transparent; }
        .toastui-editor-defaultUI { border: none !important; background: transparent !important; }
        .toastui-editor-toolbar { background: rgba(255, 255, 255, 0.6) !important; }
        .toastui-editor-contents, .toastui-editor-contents p, .ProseMirror { font-size: 16px !important; line-height: 1.7 !important; }
        
        /* 표 내부 강제 여백 최소화 수정: 행 삭제 버그 유발하는 display:none 제거 */
        .toastui-editor-contents td p, 
        .toastui-editor-contents th p {
            margin-bottom: 4px !important;
        }
        /* 삭제 또는 주석 처리됨 - .toastui-editor-contents td p:empty { display: none !important; } */

        /* 마크다운 출력 영역 */
        textarea#md-output {
            flex: 1; width: 100%; background: transparent; border: none; color: #4338ca;
            font-family: 'D2Coding', 'Consolas', monospace; font-size: 16px; line-height: 1.7;
            padding: 1.5rem; resize: none; outline: none;
            transition: background 0.4s ease, font-family 0.3s;
        }
        textarea#md-output:hover { background: rgba(67, 56, 202, 0.02); }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.25); }

        /* 모달 공통 UI */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; visibility: hidden; transition: 0.2s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 1.5rem; width: 450px; max-height: 80vh;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex; flex-direction: column; gap: 1rem;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); }
        .close-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-secondary); }
        
        /* 문서 목록 모달 전용 */
        .doc-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; overflow-y: auto; max-height: 60vh;}
        .doc-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.8rem 1rem; border-radius: 8px;
            background: rgba(255, 255, 255, 0.6); border: 1px solid var(--glass-border);
            transition: 0.2s; cursor: pointer;
        }
        .doc-item:hover { background: rgba(255, 255, 255, 0.9); }
        .doc-info { display: flex; flex-direction: column; gap: 0.2rem; flex: 1; }
        .doc-title { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
        .doc-date { font-size: 0.75rem; color: var(--text-secondary); }
        
        .del-btn { 
            background: rgba(239, 68, 68, 0.1); color: #ef4444; border: none; 
            border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.75rem; cursor: pointer; transition: 0.2s; 
        }
        .del-btn:hover { background: rgba(239, 68, 68, 0.2); }
        .empty-msg { text-align: center; color: var(--text-secondary); font-size: 0.9rem; padding: 2rem 0; }

        /* 문서 제목 입력 모달 전용 */
        .title-input-wrap { display: flex; flex-direction: column; gap: 1rem; margin-top: 0.5rem; }
        #doc-title-input {
            padding: 0.8rem; border-radius: 8px; border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.8); font-size: 1rem; font-family: inherit; outline: none;
            transition: border-color 0.2s;
        }
        #doc-title-input:focus { border-color: var(--accent-color); }
        #confirm-save-btn {
            padding: 0.8rem; border: none; border-radius: 8px;
            background: var(--accent-color); color: white; font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: background 0.2s;
        }
        #confirm-save-btn:hover { background: #2563eb; }

        /* 단축키 토글 기능 클래스 (Alt+1, Alt+2, Alt+3) - 헤더는 숨기지 않음 */
        body.wysiwyg-only #md-panel { display: none; }
        body.md-only #wysiwyg-panel { display: none; }

    </style>
</head>
<body class="wysiwyg-only">

    <header>
        <h1>MD Flow</h1>
        <p>Editor & Storage</p>
    </header>

    <main>
        <!-- WYSIWYG 패널 -->
        <div class="panel" id="wysiwyg-panel">
            <div class="panel-header">
                <div>WYSIWYG Editor</div>
                <div class="hint-wrap">
                    <span class="hint" id="new-btn" title="새로운 문서를 작성합니다">새 문서 📄</span>
                    <span class="hint" id="save-btn" title="작성 중인 문서를 브라우저에 저장합니다 (Ctrl+S)">저장 💾</span>
                    <span class="hint" id="history-btn" title="저장된 문서 목록을 엽니다">목록 🗂️</span>
                    
                    <input type="file" id="md-file-input" accept=".md" style="display: none;">
                    <span class="hint" id="load-btn" title="PC의 .md 파일을 불러옵니다">불러오기 📂</span>

                    <span class="hint" id="clean-btn" title="문서에 남아있는 불필요한 공백과 <br> 태그를 말끔히 청소합니다">여백 정리 🧹</span>
                    <span class="hint" id="copy-rich-btn" title="다른 에디터에 서식이 유지되도록 리치 텍스트(HTML)로 복사합니다">내용 복사 📋</span>
                </div>
            </div>
            <div id="wysiwyg-editor"></div>
        </div>

        <!-- 마크다운 패널 -->
        <div class="panel" id="md-panel">
            <div class="panel-header">
                <div>Markdown Source</div>
                <div class="hint-wrap">
                    <input type="text" id="font-selector" list="local-fonts" class="font-selector" value="D2Coding" placeholder="PC 폰트명 입력">
                    <datalist id="local-fonts">
                        <option value="D2Coding">
                        <option value="맑은 고딕">                          
                        <option value="Consolas">
                        <option value="Arial">
                    </datalist>
                    <span class="hint" id="copy-btn">클릭하여 복사 ✨</span>
                    <span class="hint" id="download-btn" title="마크다운 파일로 다운로드합니다">다운로드 ⬇️</span>
                </div>
            </div>
            <!-- readonly 속성 제거 -->
            <textarea id="md-output" title="마크다운 소스를 직접 수정할 수 있습니다."></textarea>
        </div>
    </main>

    <!-- 1. 문서 제목 입력 모달 -->
    <div class="modal-overlay" id="title-modal">
        <div class="modal-content" style="width: 380px;">
            <div class="modal-header">
                <h2>문서 저장</h2>
                <button class="close-btn" id="close-title-btn">✖</button>
            </div>
            <div class="title-input-wrap">
                <input type="text" id="doc-title-input" placeholder="문서 제목을 입력하세요" autocomplete="off">
                <button id="confirm-save-btn">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 2. 문서 목록 모달 -->
    <div class="modal-overlay" id="history-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>저장된 문서 목록</h2>
                <button class="close-btn" id="close-history-btn">✖</button>
            </div>
            <ul class="doc-list" id="document-list"></ul>
        </div>
    </div>

    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script>
        // --- 1. DOM 요소 및 에디터 초기화 ---
        const mdOutput = document.getElementById('md-output');
        const fontSelector = document.getElementById('font-selector');
        
        let isUpdating = false; // 양방향 동기화 무한루프 방지용 플래그

        const editor = new toastui.Editor({
            el: document.querySelector('#wysiwyg-editor'),
            height: '100%',
            initialEditType: 'wysiwyg', 
            previewStyle: 'vertical',
            hideModeSwitch: true,
            frontMatter: true, 
            initialValue: '',
            events: {
                change: () => {
                    if (isUpdating) return;
                    isUpdating = true;
                    mdOutput.value = editor.getMarkdown();
                    isUpdating = false;
                }
            }
        });

        mdOutput.value = editor.getMarkdown();

        // 마크다운 소스에서 수정 시 WYSIWYG 에디터로 반영 (양방향 동기화)
        mdOutput.addEventListener('input', (e) => {
            if (isUpdating) return;
            isUpdating = true;
            editor.setMarkdown(e.target.value);
            isUpdating = false;
        });

        // --- ★ 붙여넣기(Paste) 인터셉터 최종 수정 ---
        document.getElementById('wysiwyg-editor').addEventListener('paste', function(e) {
            if (e.isCustomPaste) return; // 무한 루프 방지
            
            const html = e.clipboardData.getData('text/html');
            const text = e.clipboardData.getData('text/plain');
            
            if (html) {
                e.preventDefault();
                
                let cleanedHtml = html;
                // 1. 빈 단락 완벽 제거
                cleanedHtml = cleanedHtml.replace(/<p>\s*<br\s*\/?>\s*<\/p>/gi, '');
                cleanedHtml = cleanedHtml.replace(/<p>\s*&nbsp;\s*<\/p>/gi, '');
                
                // 2. <br> 태그를 '띄어쓰기(공백)'로 치환하여 단어가 달라붙는 현상 방지
                cleanedHtml = cleanedHtml.replace(/<br\s*\/?>/gi, ' ');
                
                // 3. HTML 소스 안에 강제 입력된 **강조** 문구를 HTML <strong> 태그로 변환
                cleanedHtml = cleanedHtml.replace(/\*\*([\s\S]*?)\*\*/g, '<strong>$1</strong>');
                
                // 새로운 클립보드 이벤트 생성 후 전달
                const dataTransfer = new DataTransfer();
                dataTransfer.setData('text/html', cleanedHtml);
                dataTransfer.setData('text/plain', text);
                
                const pasteEvent = new ClipboardEvent('paste', {
                    clipboardData: dataTransfer,
                    bubbles: true,
                    cancelable: true
                });
                pasteEvent.isCustomPaste = true;
                e.target.dispatchEvent(pasteEvent);
            }
        }, true);

        // --- ★ 수동 여백 정리 버튼 기능 수정 ---
        const cleanBtn = document.getElementById('clean-btn');
        cleanBtn.addEventListener('click', () => {
            let md = editor.getMarkdown();
            
            // 1. 마크다운 내부에 남아있는 <br> 태그를 '띄어쓰기'로 치환
            md = md.replace(/<br\s*\/?>/gi, ' ');
            
            // 2. 문서 전체에 걸쳐 3줄 이상의 빈 엔터를 2줄로 깔끔하게 압축
            md = md.replace(/\n{3,}/g, '\n\n');
            
            editor.setMarkdown(md);
            mdOutput.value = editor.getMarkdown();
            
            const originalText = cleanBtn.innerText;
            cleanBtn.innerText = '정리 완료 ✨';
            setTimeout(() => { cleanBtn.innerText = originalText; }, 1500);
        });

        // --- 2. 단축키 (Alt+1, Alt+2, Alt+3, Ctrl+S) 화면 전환 및 저장 기능 ---
        document.addEventListener('keydown', (e) => {
            // CTRL+S (또는 CMD+S) 저장 단축키 추가
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault(); // 기본 브라우저 저장 방지
                document.getElementById('save-btn').click(); // 저장 버튼 클릭 이벤트 트리거
            } else if (e.altKey && e.key === '1') {
                e.preventDefault();
                // 이지윅 모드로 변경
                document.body.classList.remove('md-only');
                document.body.classList.add('wysiwyg-only'); 
            } else if (e.altKey && e.key === '2') {
                e.preventDefault();
                // 마크다운 모드로 변경
                document.body.classList.remove('wysiwyg-only');
                document.body.classList.add('md-only'); 
            } else if (e.altKey && e.key === '3') {
                e.preventDefault();
                // 두 패널 모두 표시 (클래스 제거)
                document.body.classList.remove('wysiwyg-only');
                document.body.classList.remove('md-only');
            }
        });

        // --- 3. 폰트, 복사, 불러오기 기능 ---
        fontSelector.addEventListener('focus', function() { this.dataset.oldValue = this.value; this.value = ''; });
        fontSelector.addEventListener('blur', function() {
            if (this.value.trim() === '') { this.value = this.dataset.oldValue || ''; mdOutput.style.fontFamily = `"${this.value}", monospace`; }
        });
        fontSelector.addEventListener('input', (e) => {
            const fontName = e.target.value.trim();
            if (fontName) mdOutput.style.fontFamily = `"${fontName}", monospace`;
        });

        // textarea가 입력 모드로 변경됨에 따라 복사 기능을 전용 버튼으로 이관
        const copyBtn = document.getElementById('copy-btn');
        copyBtn.addEventListener('click', async () => {
            if (!mdOutput.value) return;
            try {
                await navigator.clipboard.writeText(mdOutput.value);
                const originalText = copyBtn.innerText;
                copyBtn.innerText = '복사 완료 ✔️';
                setTimeout(() => { copyBtn.innerText = originalText; }, 1500);
            } catch (err) { console.error('복사 실패:', err); }
        });

        const mdFileInput = document.getElementById('md-file-input');
        document.getElementById('load-btn').addEventListener('click', () => mdFileInput.click());
        
        mdFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                let mdContent = event.target.result;
                mdContent = mdContent.replace(/\r\n|\r/g, '\n'); 
                mdContent = mdContent.replace(/^---\n[\s\S]*?\n---\n/, '');
                mdContent = mdContent.replace(/\{:[^\}]+\}/g, '');
                
                mdContent = mdContent.replace(/<br\s*\/?>/gi, ' ');
                mdContent = mdContent.replace(/\n{2,}/g, '\n');

                editor.setMarkdown(mdContent);
                mdOutput.value = editor.getMarkdown();
                currentDocId = null;
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        // --- 서식 유지 내용 복사 기능 ---
        const copyRichBtn = document.getElementById('copy-rich-btn');
        copyRichBtn.addEventListener('click', async () => {
            const htmlContent = editor.getHTML();
            const textContent = editor.getMarkdown();
            
            if (!textContent.trim()) return alert('복사할 내용이 없습니다.');

            try {
                const clipboardItem = new ClipboardItem({
                    'text/html': new Blob([htmlContent], { type: 'text/html' }),
                    'text/plain': new Blob([textContent], { type: 'text/plain' })
                });
                
                await navigator.clipboard.write([clipboardItem]);
                
                const originalText = copyRichBtn.innerText;
                copyRichBtn.innerText = '복사 완료 ✔️';
                
                setTimeout(() => { copyRichBtn.innerText = originalText; }, 2000);
            } catch (err) {
                console.error('복사 실패:', err);
                alert('클립보드 복사에 실패했습니다. 브라우저 권한을 확인해주세요.');
            }
        });

        // --- 4. IndexedDB 기반 저장소 및 모달 로직 ---
        const DB_NAME = 'MDFlowDB';
        const STORE_NAME = 'documents';
        let db;
        let currentDocId = null; 
        let pendingSaveContent = ''; 

        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
            }
        };
        request.onsuccess = (e) => db = e.target.result;

        document.getElementById('new-btn').addEventListener('click', () => {
            editor.setMarkdown('');
            mdOutput.value = '';
            currentDocId = null;
        });

        const titleModal = document.getElementById('title-modal');
        const titleInput = document.getElementById('doc-title-input');
        const confirmSaveBtn = document.getElementById('confirm-save-btn');
        const saveBtn = document.getElementById('save-btn');

        saveBtn.addEventListener('click', () => {
            const content = editor.getMarkdown();
            if (!content.trim()) return alert('저장할 내용이 없습니다.');

            if (currentDocId) {
                const tx = db.transaction(STORE_NAME, 'readonly');
                tx.objectStore(STORE_NAME).get(currentDocId).onsuccess = (e) => {
                    executeSave(e.target.result.title, content);
                };
            } else {
                pendingSaveContent = content;
                titleInput.value = ''; 
                titleModal.classList.add('active');
                setTimeout(() => titleInput.focus(), 100);
            }
        });

        function executeSave(title, content) {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const doc = { title, content, updatedAt: new Date().getTime() };
            if (currentDocId) doc.id = currentDocId; 
            
            const req = store.put(doc);
            req.onsuccess = (e) => {
                currentDocId = e.target.result; 
                showSaveSuccess();
                titleModal.classList.remove('active');
            };
        }

        confirmSaveBtn.addEventListener('click', () => {
            const title = titleInput.value.trim() || '새 마크다운 문서';
            executeSave(title, pendingSaveContent);
        });

        titleInput.addEventListener('keyup', (e) => {
            if(e.key === 'Enter') confirmSaveBtn.click();
        });

        document.getElementById('close-title-btn').addEventListener('click', () => titleModal.classList.remove('active'));
        titleModal.addEventListener('click', (e) => { if (e.target === titleModal) titleModal.classList.remove('active'); });

        function showSaveSuccess() {
            const originalText = saveBtn.innerText;
            saveBtn.innerText = '저장됨 ✔️';
            saveBtn.style.background = 'rgba(16, 185, 129, 0.15)';
            saveBtn.style.color = '#10b981';
            setTimeout(() => {
                saveBtn.innerText = originalText;
                saveBtn.style.background = '';
                saveBtn.style.color = '';
            }, 1500);
        }

        // --- 5. 문서 목록(History) 모달 로직 ---
        const historyModal = document.getElementById('history-modal');
        const docList = document.getElementById('document-list');

        document.getElementById('history-btn').addEventListener('click', loadDocumentList);
        document.getElementById('close-history-btn').addEventListener('click', () => historyModal.classList.remove('active'));
        historyModal.addEventListener('click', (e) => { if (e.target === historyModal) historyModal.classList.remove('active'); });

        function loadDocumentList() {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAll();

            req.onsuccess = (e) => {
                const docs = e.target.result.sort((a, b) => b.updatedAt - a.updatedAt);
                docList.innerHTML = '';
                
                if(docs.length === 0) {
                    docList.innerHTML = '<li class="empty-msg">저장된 문서가 없습니다.</li>';
                } else {
                    docs.forEach(doc => {
                        const li = document.createElement('li');
                        li.className = 'doc-item';
                        li.innerHTML = `
                            <div class="doc-info">
                                <span class="doc-title">${doc.title}</span>
                                <span class="doc-date">${new Date(doc.updatedAt).toLocaleString()}</span>
                            </div>
                            <button class="del-btn" data-id="${doc.id}">삭제</button>
                        `;

                        li.querySelector('.doc-info').addEventListener('click', () => {
                            editor.setMarkdown(doc.content);
                            mdOutput.value = doc.content;
                            currentDocId = doc.id;
                            historyModal.classList.remove('active');
                        });

                        li.querySelector('.del-btn').addEventListener('click', (ev) => {
                            ev.stopPropagation();
                            if (confirm(`'${doc.title}' 문서를 삭제하시겠습니까?`)) deleteDocument(doc.id);
                        });

                        docList.appendChild(li);
                    });
                }
                historyModal.classList.add('active');
            };
        }

        function deleteDocument(id) {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).delete(id);
            tx.oncomplete = () => {
                if (currentDocId === id) { currentDocId = null; } 
                loadDocumentList();
            };
        }

        // --- 6. MD 다운로드 기능 추가 ---
        document.getElementById('download-btn').addEventListener('click', () => {
            const content = mdOutput.value;
            if (!content.trim()) return alert('다운로드할 내용이 없습니다.');

            const processDownload = (fileName) => {
                const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
            };

            if (currentDocId && db) {
                const tx = db.transaction(STORE_NAME, 'readonly');
                tx.objectStore(STORE_NAME).get(currentDocId).onsuccess = (e) => {
                    const doc = e.target.result;
                    const fileName = (doc && doc.title) ? `${doc.title}.md` : 'document.md';
                    processDownload(fileName);
                };
            } else {
                processDownload('document.md');
            }
        });
    </script>
</body>
</html>
