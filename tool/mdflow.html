<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Flow</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #3b82f6;
            --header-height: 65px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: var(--text-primary);
            height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden; position: relative;
        }

        /* Header Styles */
        header {
            padding: 1rem 2rem;
            height: var(--header-height);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10;
        }
        header h1 {
            font-size: 1.25rem; font-weight: 600;
            background: linear-gradient(to right, #2563eb, #6366f1);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        header p { font-size: 0.875rem; color: var(--text-secondary); font-weight: 500; }

        /* Main Layout */
        main {
            display: flex; flex: 1; padding: 1.5rem; gap: 1.5rem; 
            height: calc(100vh - var(--header-height));
        }

        .panel {
            flex: 1; background: var(--glass-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 12px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05);
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }
        .panel-header {
            padding: 0.75rem 1.5rem; background: rgba(0, 0, 0, 0.03);
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 0.05em;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* Tool & Hint Buttons */
        .hint-wrap { display: flex; align-items: center; gap: 8px; }
        .hint {
            font-size: 0.7rem; color: var(--accent-color);
            background: rgba(59, 130, 246, 0.1); padding: 0.3rem 0.6rem;
            border-radius: 20px; text-transform: none; letter-spacing: normal;
            cursor: pointer; transition: background 0.2s ease, color 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .hint:hover { background: rgba(59, 130, 246, 0.2); }
        
        #toggle-code-btn { background: rgba(236, 72, 153, 0.1); color: #db2777; font-weight: 600; }
        #toggle-code-btn:hover { background: rgba(236, 72, 153, 0.2); }
        #toggle-code-btn.active { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        
        #clean-btn { background: rgba(245, 158, 11, 0.1); color: #d97706; font-weight: 600; }
        #clean-btn:hover { background: rgba(245, 158, 11, 0.2); }
        #copy-rich-btn { background: rgba(16, 185, 129, 0.1); color: #059669; font-weight: 600; }
        #copy-rich-btn:hover { background: rgba(16, 185, 129, 0.2); }
        #html-download-btn { background: rgba(139, 92, 246, 0.1); color: #7c3aed; font-weight: 600; }
        #html-download-btn:hover { background: rgba(139, 92, 246, 0.2); }

        input.font-selector {
            background: rgba(255, 255, 255, 0.8); border: 1px solid var(--glass-border);
            border-radius: 6px; padding: 0.3rem 0.5rem; font-size: 0.75rem;
            color: var(--text-primary); outline: none; font-family: inherit; width: 140px;
        }
        input.font-selector::placeholder { color: #94a3b8; }

        /* Toast UI Editor Overrides */
        #wysiwyg-editor { flex: 1; background: transparent; }
        .toastui-editor-defaultUI { border: none !important; background: transparent !important; }
        .toastui-editor-toolbar { background: rgba(255, 255, 255, 0.6) !important; }
        .toastui-editor-contents, .toastui-editor-contents p, .ProseMirror { font-size: 16px !important; line-height: 1.7 !important; }
        .toastui-editor-contents td p, .toastui-editor-contents th p { margin-bottom: 4px !important; }

        /* Markdown Output Area */
        textarea#md-output {
            flex: 1; width: 100%; background: transparent; border: none; color: #4338ca;
            font-family: 'D2Coding', 'Consolas', monospace; font-size: 16px; line-height: 1.7;
            padding: 1.5rem; resize: none; outline: none;
            transition: background 0.4s ease, font-family 0.3s;
        }
        textarea#md-output:hover { background: rgba(67, 56, 202, 0.02); }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.25); }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; visibility: hidden; transition: 0.2s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 1.5rem; width: 450px; max-height: 80vh;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex; flex-direction: column; gap: 1rem;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); }
        .close-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-secondary); }
        
        /* Modal - Document List */
        .doc-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; overflow-y: auto; max-height: 60vh;}
        .doc-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.8rem 1rem; border-radius: 8px;
            background: rgba(255, 255, 255, 0.6); border: 1px solid var(--glass-border);
            transition: 0.2s; cursor: pointer;
        }
        .doc-item:hover { background: rgba(255, 255, 255, 0.9); }
        .doc-info { display: flex; flex-direction: column; gap: 0.2rem; flex: 1; }
        .doc-title { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
        .doc-date { font-size: 0.75rem; color: var(--text-secondary); }
        .del-btn { 
            background: rgba(239, 68, 68, 0.1); color: #ef4444; border: none; 
            border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.75rem; cursor: pointer; transition: 0.2s; 
        }
        .del-btn:hover { background: rgba(239, 68, 68, 0.2); }
        .empty-msg { text-align: center; color: var(--text-secondary); font-size: 0.9rem; padding: 2rem 0; }

        /* Modal - Save Title */
        .title-input-wrap { display: flex; flex-direction: column; gap: 1rem; margin-top: 0.5rem; }
        #doc-title-input {
            padding: 0.8rem; border-radius: 8px; border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.8); font-size: 1rem; font-family: inherit; outline: none;
            transition: border-color 0.2s;
        }
        #doc-title-input:focus { border-color: var(--accent-color); }
        #confirm-save-btn {
            padding: 0.8rem; border: none; border-radius: 8px;
            background: var(--accent-color); color: white; font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: background 0.2s;
        }
        #confirm-save-btn:hover { background: #2563eb; }

        /* Layout Toggles */
        body.wysiwyg-only #md-panel { display: none; }
        body.md-only #wysiwyg-panel { display: none; }
    </style>
</head>
<body class="wysiwyg-only">

    <header>
        <h1>MD Flow</h1>
        <p id="header-file-name">Editor & Storage</p>
    </header>

    <main>
        <div class="panel" id="wysiwyg-panel">
            <div class="panel-header">
                <div>WYSIWYG Editor</div>
                <div class="hint-wrap">
                    <span class="hint" id="new-btn" title="새로운 문서를 작성합니다">새 문서 📄</span>
                    <span class="hint" id="save-btn" title="작성 중인 문서를 브라우저에 저장합니다 (Ctrl+S)">저장 💾</span>
                    <span class="hint" id="history-btn" title="저장된 문서 목록을 엽니다">목록 🗂️</span>
                    
                    <input type="file" id="md-file-input" accept=".md" style="display: none;">
                    <span class="hint" id="load-btn" title="PC의 .md 파일을 불러옵니다">불러오기 📂</span>

                    <span class="hint" id="toggle-code-btn" title="코드 블록을 일반 텍스트로 풀어 툴바를 사용할 수 있게 합니다">코드 해제 🔓</span>
                    <span class="hint" id="clean-btn" title="문서에 남아있는 불필요한 공백과 <br> 태그를 말끔히 청소합니다">여백 정리 🧹</span>
                    <span class="hint" id="copy-rich-btn" title="다른 에디터에 서식이 유지되도록 리치 텍스트(HTML)로 복사합니다">내용 복사 📋</span>
                    <span class="hint" id="html-download-btn" title="현재 문서를 HTML 파일로 다운로드합니다">HTML 다운 🌐</span>
                </div>
            </div>
            <div id="wysiwyg-editor"></div>
        </div>

        <div class="panel" id="md-panel">
            <div class="panel-header">
                <div>Markdown Source</div>
                <div class="hint-wrap">
                    <input type="text" id="font-selector" list="local-fonts" class="font-selector" value="D2Coding" placeholder="PC 폰트명 입력">
                    <datalist id="local-fonts">
                        <option value="D2Coding"></option>
                        <option value="맑은 고딕"></option>                          
                        <option value="Consolas"></option>
                        <option value="Arial"></option>
                    </datalist>
                    <span class="hint" id="copy-btn">클릭하여 복사 ✨</span>
                    <span class="hint" id="download-btn" title="마크다운 파일로 다운로드합니다">다운로드 ⬇️</span>
                </div>
            </div>
            <textarea id="md-output" title="마크다운 소스를 직접 수정할 수 있습니다."></textarea>
        </div>
    </main>

    <!-- Modals -->
    <div class="modal-overlay" id="title-modal">
        <div class="modal-content" style="width: 380px;">
            <div class="modal-header">
                <h2>문서 저장</h2>
                <button class="close-btn" id="close-title-btn">✖</button>
            </div>
            <div class="title-input-wrap">
                <input type="text" id="doc-title-input" placeholder="문서 제목을 입력하세요" autocomplete="off">
                <button id="confirm-save-btn">저장하기</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="history-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>저장된 문서 목록</h2>
                <button class="close-btn" id="close-history-btn">✖</button>
            </div>
            <ul class="doc-list" id="document-list"></ul>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

    <script>
        /** 
         * 1. Application State & Configuration 
         */
        const APP_STATE = {
            isUpdating: false,
            currentDocId: null,
            pendingSaveContent: ''
        };

        const DB_CONFIG = {
            name: 'MDFlowDB',
            version: 1,
            storeName: 'documents'
        };
        let dbInstance;

        const DOM = {
            mdOutput: document.getElementById('md-output'),
            fontSelector: document.getElementById('font-selector'),
            mdFileInput: document.getElementById('md-file-input'),
            headerFileName: document.getElementById('header-file-name'), // 추가된 돔
            modals: {
                title: document.getElementById('title-modal'),
                history: document.getElementById('history-modal')
            },
            inputs: {
                docTitle: document.getElementById('doc-title-input')
            },
            lists: {
                document: document.getElementById('document-list')
            },
            buttons: {
                save: document.getElementById('save-btn'),
                confirmSave: document.getElementById('confirm-save-btn')
            }
        };

        /** 
         * 2. Markdown Processing Utilities 
         */
        const MarkdownUtils = {
            clean(rawMarkdown) {
                let md = rawMarkdown.replace(/\\([|*_\-])/g, '$1'); 
                
                md = md.replace(/(?:^[ \t]*>[ \t]*\|.*(?:\r?\n|$))+/gm, match => 
                    '\n\n' + match.replace(/^[ \t]*>[ \t]*/gm, '') + '\n\n'
                );
                
                md = md.replace(/(?:^[ \t]+\|.*(?:\r?\n|$))+/gm, match => 
                    '\n\n' + match.replace(/^[ \t]+/gm, '') + '\n\n'
                );
                
                return md.replace(/\n{3,}/g, '\n\n');
            },
            
            cleanHTML(html) {
                let cleaned = html.replace(/<p>\s*<br\s*\/?>\s*<\/p>/gi, '');
                cleaned = cleaned.replace(/<p>\s*&nbsp;\s*<\/p>/gi, '');
                cleaned = cleaned.replace(/<br\s*\/?>/gi, ' ');
                cleaned = cleaned.replace(/\*\*([\s\S]*?)\*\*/g, '<strong>$1</strong>');
                return cleaned;
            }
        };

        /** 
         * 3. Editor Initialization 
         */
        const editor = new toastui.Editor({
            el: document.querySelector('#wysiwyg-editor'),
            height: '100%',
            initialEditType: 'wysiwyg', 
            previewStyle: 'vertical',
            hideModeSwitch: true,
            frontMatter: true, 
            initialValue: '',
            events: {
                change: () => {
                    if (APP_STATE.isUpdating) return;
                    APP_STATE.isUpdating = true;
                    DOM.mdOutput.value = MarkdownUtils.clean(editor.getMarkdown());
                    APP_STATE.isUpdating = false;
                }
            }
        });
        
        DOM.mdOutput.value = MarkdownUtils.clean(editor.getMarkdown());

        /** 
         * 4. Sync & UI Handlers 
         */
        function syncWysiwygScroll() {
            const proseMirror = document.querySelector('.ProseMirror');
            if (!proseMirror) return;
            const maxScrollMd = DOM.mdOutput.scrollHeight - DOM.mdOutput.clientHeight;
            if (maxScrollMd <= 0) return;
            const scrollRatio = DOM.mdOutput.scrollTop / maxScrollMd;
            const maxScrollWw = proseMirror.scrollHeight - proseMirror.clientHeight;
            proseMirror.scrollTop = maxScrollWw * scrollRatio;
        }

        DOM.mdOutput.addEventListener('input', (e) => {
            if (APP_STATE.isUpdating) return;
            APP_STATE.isUpdating = true;
            editor.setMarkdown(MarkdownUtils.clean(e.target.value), false);
            setTimeout(syncWysiwygScroll, 10);
            APP_STATE.isUpdating = false;
        });

        DOM.mdOutput.addEventListener('scroll', syncWysiwygScroll);

        /** 
         * 5. Database (IndexedDB) Operations 
         */
        const DB = {
            init() {
                const request = indexedDB.open(DB_CONFIG.name, DB_CONFIG.version);
                request.onupgradeneeded = (e) => {
                    dbInstance = e.target.result;
                    if (!dbInstance.objectStoreNames.contains(DB_CONFIG.storeName)) {
                        dbInstance.createObjectStore(DB_CONFIG.storeName, { keyPath: 'id', autoIncrement: true });
                    }
                };
                request.onsuccess = (e) => dbInstance = e.target.result;
            },
            
            save(title, content) {
                const tx = dbInstance.transaction(DB_CONFIG.storeName, 'readwrite');
                const store = tx.objectStore(DB_CONFIG.storeName);
                const doc = { title, content, updatedAt: new Date().getTime() };
                
                if (APP_STATE.currentDocId) doc.id = APP_STATE.currentDocId; 
                
                const req = store.put(doc);
                req.onsuccess = (e) => {
                    APP_STATE.currentDocId = e.target.result; 
                    UI.showSaveSuccess();
                    UI.updateHeader(title, 'history'); // 저장 완료 시 헤더 파일명 갱신
                    DOM.modals.title.classList.remove('active');
                };
            },

            loadAll(callback) {
                const tx = dbInstance.transaction(DB_CONFIG.storeName, 'readonly');
                const req = tx.objectStore(DB_CONFIG.storeName).getAll();
                req.onsuccess = (e) => callback(e.target.result.sort((a, b) => b.updatedAt - a.updatedAt));
            },

            delete(id, callback) {
                const tx = dbInstance.transaction(DB_CONFIG.storeName, 'readwrite');
                tx.objectStore(DB_CONFIG.storeName).delete(id);
                tx.oncomplete = () => {
                    if (APP_STATE.currentDocId === id) {
                        APP_STATE.currentDocId = null;
                        UI.updateHeader(null); // 활성 문서가 삭제되면 헤더 텍스트 초기화
                    }
                    if (callback) callback();
                };
            }
        };

        /** 
         * 6. UI Helpers 
         */
        const UI = {
            // 헤더 영역 텍스트 갱신 함수 (불러오기 항목 구분 처리 반영)
            updateHeader(title, source) {
                if (!title) {
                    DOM.headerFileName.innerText = 'Editor & Storage';
                } else if (source === 'load') {
                    DOM.headerFileName.innerText = `📂 [PC] ${title}`;
                } else if (source === 'history') {
                    DOM.headerFileName.innerText = `🗂️ [저장됨] ${title}`;
                }
            },
            
            showSaveSuccess() {
                const btn = DOM.buttons.save;
                const originalText = btn.innerText;
                btn.innerText = '저장됨 ✔️';
                btn.style.background = 'rgba(16, 185, 129, 0.15)';
                btn.style.color = '#10b981';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 1500);
            },
            
            tempChangeText(btn, newText, duration = 1500) {
                const originalText = btn.innerText;
                btn.innerText = newText;
                setTimeout(() => { btn.innerText = originalText; }, duration);
            },

            downloadFile(content, fileName, mimeType) {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = fileName;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
            }
        };

        /** 
         * 7. Event Listeners 
         */
        function setupEventListeners() {
            // Document Management
            document.getElementById('new-btn').addEventListener('click', () => {
                editor.setMarkdown('');
                DOM.mdOutput.value = '';
                APP_STATE.currentDocId = null;
                UI.updateHeader(null); // 새 문서 시 헤더 텍스트 초기화
            });

            DOM.buttons.save.addEventListener('click', () => {
                const content = MarkdownUtils.clean(editor.getMarkdown());
                if (!content.trim()) return alert('저장할 내용이 없습니다.');

                if (APP_STATE.currentDocId) {
                    const tx = dbInstance.transaction(DB_CONFIG.storeName, 'readonly');
                    tx.objectStore(DB_CONFIG.storeName).get(APP_STATE.currentDocId).onsuccess = (e) => {
                        DB.save(e.target.result.title, content);
                    };
                } else {
                    APP_STATE.pendingSaveContent = content;
                    DOM.inputs.docTitle.value = ''; 
                    DOM.modals.title.classList.add('active');
                    setTimeout(() => DOM.inputs.docTitle.focus(), 100);
                }
            });

            DOM.buttons.confirmSave.addEventListener('click', () => {
                DB.save(DOM.inputs.docTitle.value.trim() || '새 마크다운 문서', APP_STATE.pendingSaveContent);
            });

            // History Modal
            document.getElementById('history-btn').addEventListener('click', () => {
                DB.loadAll((docs) => {
                    DOM.lists.document.innerHTML = '';
                    if(docs.length === 0) {
                        DOM.lists.document.innerHTML = '<li class="empty-msg">저장된 문서가 없습니다.</li>';
                    } else {
                        docs.forEach(doc => {
                            const li = document.createElement('li');
                            li.className = 'doc-item';
                            li.innerHTML = `
                                <div class="doc-info">
                                    <span class="doc-title">${doc.title}</span>
                                    <span class="doc-date">${new Date(doc.updatedAt).toLocaleString()}</span>
                                </div>
                                <button class="del-btn" data-id="${doc.id}">삭제</button>
                            `;
                            li.querySelector('.doc-info').addEventListener('click', () => {
                                editor.setMarkdown(doc.content);
                                DOM.mdOutput.value = doc.content;
                                APP_STATE.currentDocId = doc.id;
                                UI.updateHeader(doc.title, 'history'); // 목록에서 불러온 파일 헤더 반영
                                DOM.modals.history.classList.remove('active');
                            });
                            li.querySelector('.del-btn').addEventListener('click', (ev) => {
                                ev.stopPropagation();
                                if (confirm(`'${doc.title}' 문서를 삭제하시겠습니까?`)) {
                                    DB.delete(doc.id, () => document.getElementById('history-btn').click());
                                }
                            });
                            DOM.lists.document.appendChild(li);
                        });
                    }
                    DOM.modals.history.classList.add('active');
                });
            });

            // File IO
            document.getElementById('load-btn').addEventListener('click', () => DOM.mdFileInput.click());
            DOM.mdFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    let mdContent = event.target.result.replace(/\r\n|\r/g, '\n')
                                         .replace(/^---\n[\s\S]*?\n---\n/, '')
                                         .replace(/\{:[^\}]+\}/g, '')
                                         .replace(/<br\s*\/?>/gi, ' ');
                    
                    mdContent = MarkdownUtils.clean(mdContent);
                    editor.setMarkdown(mdContent);
                    DOM.mdOutput.value = mdContent;
                    APP_STATE.currentDocId = null;
                    UI.updateHeader(file.name, 'load'); // PC에서 불러온 파일 헤더 반영
                };
                reader.readAsText(file);
                e.target.value = '';
            });

            // 기타 기존 리스너 유지
            document.getElementById('toggle-code-btn').addEventListener('click', function() {
                let md = MarkdownUtils.clean(editor.getMarkdown());
                const hasUnlockedCodes = /📢\\?CODE\\?_START:/.test(md);
                
                if (!hasUnlockedCodes) {
                    md = md.replace(/```(.*?)\n([\s\S]*?)```/g, (match, lang, content) => {
                        const safeLang = lang.trim() || 'text';
                        return `\n\n📢CODE_START:${safeLang}\n${content.trim()}\n📢CODE_END\n\n`;
                    });
                    this.innerHTML = '코드 보호 🔒';
                    this.classList.add('active');
                } else {
                    const regex = /📢\\?CODE\\?_START:(.*?)\s*\n([\s\S]*?)\s*📢\\?CODE\\?_END/g;
                    md = md.replace(regex, (match, lang, content) => {
                        let cleanContent = content.trim().replace(/\\([*_\-`[\]])/g, '$1'); 
                        return `\n\n\`\`\`${lang.trim()}\n${cleanContent}\n\`\`\`\n\n`;
                    });
                    this.innerHTML = '코드 해제 🔓';
                    this.classList.remove('active');
                }
                
                editor.setMarkdown(md, false);
                DOM.mdOutput.value = MarkdownUtils.clean(editor.getMarkdown());
            });

            document.getElementById('clean-btn').addEventListener('click', function() {
                const proseMirror = document.querySelector('.ProseMirror');
                const wwScrollTop = proseMirror ? proseMirror.scrollTop : 0;
                
                let md = MarkdownUtils.clean(editor.getMarkdown());
                md = md.replace(/<br\s*\/?>/gi, ' ');
                editor.setMarkdown(md, false);
                DOM.mdOutput.value = MarkdownUtils.clean(editor.getMarkdown());
                
                if (proseMirror) setTimeout(() => proseMirror.scrollTop = wwScrollTop, 10);
                UI.tempChangeText(this, '정리 완료 ✨');
            });

            document.getElementById('wysiwyg-editor').addEventListener('paste', function(e) {
                if (e.isCustomPaste) return;
                const html = e.clipboardData.getData('text/html');
                const text = e.clipboardData.getData('text/plain');
                if (!text) return; 
                
                let isCodeBlock = false;
                let node = window.getSelection()?.anchorNode;
                while (node && node !== document.body && node !== this) {
                    if (node.nodeName === 'PRE' || node.nodeName === 'CODE') { isCodeBlock = true; break; }
                    node = node.parentNode;
                }
                
                if (isCodeBlock) {
                    e.preventDefault();
                    document.execCommand('insertText', false, text);
                    return;
                }
                
                if (html) {
                    e.preventDefault();
                    const dataTransfer = new DataTransfer();
                    dataTransfer.setData('text/html', MarkdownUtils.cleanHTML(html));
                    dataTransfer.setData('text/plain', text);
                    const pasteEvent = new ClipboardEvent('paste', { clipboardData: dataTransfer, bubbles: true, cancelable: true });
                    pasteEvent.isCustomPaste = true;
                    e.target.dispatchEvent(pasteEvent);
                }
            }, true);

            document.getElementById('copy-btn').addEventListener('click', async function() {
                if (!DOM.mdOutput.value) return;
                try {
                    await navigator.clipboard.writeText(DOM.mdOutput.value);
                    UI.tempChangeText(this, '복사 완료 ✔️');
                } catch (err) { console.error(err); }
            });

            document.getElementById('copy-rich-btn').addEventListener('click', async function() {
                const rawHtmlContent = editor.getHTML();
                const textContent = MarkdownUtils.clean(editor.getMarkdown());
                if (!textContent.trim()) return alert('복사할 내용이 없습니다.');

                try {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(rawHtmlContent, 'text/html');
                    
                    ['blockquote', 'ul', 'ol'].forEach(selector => {
                        doc.querySelectorAll(selector).forEach(el => {
                            let insertAfterNode = el;
                            el.querySelectorAll('table').forEach(table => {
                                el.parentNode.insertBefore(table, insertAfterNode.nextSibling);
                                insertAfterNode = table;
                            });
                            if (el.textContent.trim() === '' && el.children.length === 0) el.remove();
                        });
                    });

                    doc.querySelectorAll('table').forEach(table => {
                        table.setAttribute('border', '1');
                        Object.assign(table.style, { borderCollapse: 'collapse', width: '100%', margin: '15px 0' });
                        table.querySelectorAll('th, td').forEach(cell => {
                            Object.assign(cell.style, { border: '1px solid #dfe1e6', padding: '8px 12px', textAlign: 'left' });
                        });
                        table.querySelectorAll('th').forEach(th => {
                            Object.assign(th.style, { backgroundColor: '#f4f5f7', fontWeight: 'bold' });
                        });
                    });

                    const clipboardItem = new ClipboardItem({
                        'text/html': new Blob([doc.body.innerHTML], { type: 'text/html' }),
                        'text/plain': new Blob([textContent], { type: 'text/plain' })
                    });
                    
                    await navigator.clipboard.write([clipboardItem]);
                    UI.tempChangeText(this, '복사 완료 ✔️', 2000);
                } catch (err) { alert('복사 실패. 브라우저 권한을 확인해주세요.'); }
            });

            document.getElementById('html-download-btn').addEventListener('click', function() {
                const textContent = MarkdownUtils.clean(editor.getMarkdown());
                if (!textContent.trim()) return alert('다운로드할 내용이 없습니다.');

                const fullHtml = `<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>Document</title>
<style>
    body { font-family: 'Inter', 'Pretendard', sans-serif; line-height: 1.7; color: #1e293b; max-width: 900px; margin: 0 auto; padding: 2rem; }
    table { border-collapse: collapse; width: 100%; margin: 1.5rem 0; }
    th, td { border: 1px solid #dfe1e6; padding: 12px; text-align: left; }
    th { background-color: #f4f5f7; font-weight: bold; }
    blockquote { border-left: 4px solid #dfe1e6; padding-left: 1rem; color: #64748b; }
    img { max-width: 100%; height: auto; }
</style></head><body>${editor.getHTML()}</body></html>`;

                const getFileName = (ext) => {
                    if (!APP_STATE.currentDocId) return `document.${ext}`;
                    return new Promise(resolve => {
                        const tx = dbInstance.transaction(DB_CONFIG.storeName, 'readonly');
                        tx.objectStore(DB_CONFIG.storeName).get(APP_STATE.currentDocId).onsuccess = (e) => {
                            resolve(e.target.result?.title ? `${e.target.result.title}.${ext}` : `document.${ext}`);
                        };
                    });
                };

                getFileName('html').then(fileName => {
                    UI.downloadFile(fullHtml, fileName, 'text/html;charset=utf-8;');
                    UI.tempChangeText(this, '다운로드 완료 ✔️', 2000);
                });
            });

            document.getElementById('download-btn').addEventListener('click', () => {
                const content = DOM.mdOutput.value;
                if (!content.trim()) return alert('다운로드할 내용이 없습니다.');
                
                if (APP_STATE.currentDocId) {
                    const tx = dbInstance.transaction(DB_CONFIG.storeName, 'readonly');
                    tx.objectStore(DB_CONFIG.storeName).get(APP_STATE.currentDocId).onsuccess = (e) => {
                        const title = e.target.result?.title || 'document';
                        UI.downloadFile(content, `${title}.md`, 'text/markdown;charset=utf-8;');
                    };
                } else {
                    UI.downloadFile(content, 'document.md', 'text/markdown;charset=utf-8;');
                }
            });

            DOM.fontSelector.addEventListener('input', (e) => {
                if (e.target.value.trim()) DOM.mdOutput.style.fontFamily = `"${e.target.value}", monospace`;
            });

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); DOM.buttons.save.click(); }
                else if (e.altKey && e.key === '1') { e.preventDefault(); document.body.className = 'wysiwyg-only'; }
                else if (e.altKey && e.key === '2') { e.preventDefault(); document.body.className = 'md-only'; }
                else if (e.altKey && e.key === '3') { e.preventDefault(); document.body.className = ''; }
            });
            DOM.inputs.docTitle.addEventListener('keyup', (e) => { if(e.key === 'Enter') DOM.buttons.confirmSave.click(); });
            
            document.getElementById('close-title-btn').addEventListener('click', () => DOM.modals.title.classList.remove('active'));
            document.getElementById('close-history-btn').addEventListener('click', () => DOM.modals.history.classList.remove('active'));
            window.addEventListener('click', (e) => {
                if (e.target === DOM.modals.title) DOM.modals.title.classList.remove('active');
                if (e.target === DOM.modals.history) DOM.modals.history.classList.remove('active');
            });
        }

        DB.init();
        setupEventListeners();

    </script>
</body>
</html>
