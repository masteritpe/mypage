<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Formatter</title>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    :root {
      --bg-body: #F9FAFB;
      --bg-surface: #FFFFFF;
      --border-light: #F3F4F6;
      --border-base: #E5E7EB;
      --text-main: #111827;
      --text-muted: #6B7280;
      --primary: #EF4444;       
      --primary-hover: #DC2626;
      --secondary: #FFFFFF;
      --secondary-hover: #F9FAFB;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding: 40px;
      -webkit-font-smoothing: antialiased;
    }

    .dashboard-header {
      max-width: 100%;
      margin: 0 auto 24px auto;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .title-area i { font-size: 28px; color: #EF4444; }
    h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    
    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    input[type="file"] { display: none; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: var(--radius-md);
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
    }
    .btn-primary {
      background: var(--primary); color: white;
      box-shadow: var(--shadow-sm);
    }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    
    .btn-outline {
      background: var(--secondary); color: var(--text-main);
      border-color: var(--border-base); box-shadow: var(--shadow-sm);
    }
    .btn-outline:hover { background: var(--secondary-hover); border-color: #D1D5DB; }

    .instructions {
      display: flex; gap: 20px; align-items: center;
      font-size: 13px; color: var(--text-muted);
      background: var(--bg-surface); padding: 12px 20px;
      border-radius: var(--radius-md); border: 1px solid var(--border-base);
    }
    .instructions span { display: inline-flex; align-items: center; gap: 6px; }
    .instructions i { font-size: 16px; }

    #editor-wrapper {
      max-width: 100%; margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-base);
      border-radius: var(--radius-lg);
      height: calc(100vh - 200px);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    textarea {
      flex: 1;
      width: 100%;
      padding: 24px;
      border: none;
      resize: none;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-main);
      background: transparent;
      outline: none;
      border-radius: var(--radius-lg);
    }
    textarea::-webkit-scrollbar { width: 8px; height: 8px; }
    textarea::-webkit-scrollbar-track { background: transparent; }
    textarea::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }
    textarea::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }

    textarea::placeholder {
      color: #9CA3AF;
    }
  </style>
</head>
<body>

  <div class="dashboard-header">
    <div class="header-top">
      <div class="title-area">
        <i class="ph ph-text-aa"></i>
        <h2>Text Formatter</h2>
      </div>
      
      <div class="actions">
        <!-- TXT 파일 불러오기 -->
        <label for="upload-txt" class="btn btn-primary">
          <i class="ph ph-upload-simple"></i> 텍스트 불러오기
        </label>
        <input type="file" id="upload-txt" accept=".txt" />
        
        <!-- 룰 확장용 버튼들 -->
        <button class="btn btn-outline" onclick="applyDumpFormatting()">
          <i class="ph ph-magic-wand"></i> 덤프정리
        </button>

        <!-- 저장 영역 -->
        <button class="btn btn-outline" onclick="exportToTxt()">
          <i class="ph ph-download-simple"></i> TXT 저장
        </button>
        <button class="btn btn-outline" onclick="exportToMd()">
          <i class="ph ph-file-code"></i> MD 저장
        </button>
      </div>
    </div>

    <div class="instructions">
      <span><i class="ph ph-upload-simple"></i> 원본 문제 텍스트를 입력하거나 텍스트 파일을 불러오세요.</span>
      <span style="color: #D1D5DB;">|</span>
      <span><i class="ph ph-magic-wand"></i> <strong>[덤프정리]</strong> 마커를 기준으로 문장을 예쁘게 1줄로 병합합니다. (소수점 자동 방어 포함)</span>
    </div>
  </div>

  <div id="editor-wrapper">
    <textarea id="text-editor" spellcheck="false" placeholder="이곳에 원본 문제 텍스트를 입력하거나 텍스트 파일을 불러오세요...
    
(예시)
1. 다음 중 옳은 것은?
1) 선택지 1번
2) 선택지 2번
해설: 이것은 해설입니다.
답: 1"></textarea>
  </div>

  <script>
    const editor = document.getElementById('text-editor');

    // 1. 텍스트 파일 불러오기
    document.getElementById('upload-txt').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        editor.value = event.target.result;
      };
      reader.readAsText(file);
      e.target.value = ''; 
    });

    // 2. 덤프정리 룰 적용 함수 (마커 기반 1줄 병합)
    function applyDumpFormatting() {
      let rawText = editor.value;
      if (!rawText.trim()) {
        alert('정리할 텍스트가 없습니다.');
        return;
      }

      // [전처리] 문장 끝에 '정답:', '해설:'이 엉겨붙어 있는 경우 분리
      let text = rawText
        .replace(/(^|[\.\?\!\s])\s*(해설|설명)\s*[:\-]/gi, '$1\n$2: ')
        .replace(/(^|[\.\?\!\s])\s*(정답|답)\s*[:\-]/gi, '$1\n$2: ');

      const lines = text.split('\n');
      let result = [];
      let qNum = 1; // 화면에 출력될 깔끔한 내부 순번
      
      let accumulatedText = [];  

      function flush() {
        if (accumulatedText.length > 0) {
          result.push(accumulatedText.join(' ')); 
          accumulatedText = [];
        }
      }

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;

        // 마커 1: 문제 번호 (SAML 2.0 등 소수점 방어를 위해 (?!\d) 적용 - 마침표 뒤에 바로 숫자가 오면 무시)
        const qMatch = line.match(/^(?:질문\s*\d+|문제\s*\d+|Q\s*\d+|\d+[\.\)])(?!\d)\s*(.*)/i);
        
        if (qMatch) {
          flush();
          if (qNum > 1) { result.push("\n---"); }
          result.push(`\n## 문제 ${qNum}\n`);
          accumulatedText.push(`질문 ${qNum}. ${qMatch[1]}`); 
          qNum++;
          continue;
        }

        // 마커 2: 선택지 (A. B. C. 1) 2) ① ② 등)
        const optMatch = line.match(/^([a-gA-G][\.\)]|[①-⑦]|[1-7]\))\s*(.*)/);
        if (optMatch) {
          flush();
          let rawMarker = optMatch[1].toUpperCase();
          let marker = rawMarker.replace(/[\.\)]/g, ''); 
          
          const markerMap = {
            '1':'A', '①':'A', '2':'B', '②':'B', '3':'C', '③':'C',
            '4':'D', '④':'D', '5':'E', '⑤':'E', '6':'F', '⑥':'F', '7':'G', '⑦':'G'
          };
          if (markerMap[marker]) marker = markerMap[marker];
          
          accumulatedText.push(`${marker}. ${optMatch[2]}`);
          continue;
        }

        // 마커 3: 해설
        const expMatch = line.match(/^(?:해설|설명)\s*[:\-]?\s*(.*)/);
        if (expMatch) {
          flush();
          result.push(`\n**해설:**`);
          if (expMatch[1]) accumulatedText.push(expMatch[1]);
          continue;
        }

        // 마커 4: 정답
        const ansMatch = line.match(/^(?:정답|답)\s*[:\-]?\s*(.*)/i);
        if (ansMatch) {
          flush();
          let ansText = ansMatch[1].trim();
          let found = ansText.match(/[A-G1-7①-⑦]/gi);
          let ans = '';
          
          const ansMap = {
            '1':'A', '①':'A', '2':'B', '②':'B', '3':'C', '③':'C',
            '4':'D', '④':'D', '5':'E', '⑤':'E', '6':'F', '⑥':'F', '7':'G', '⑦':'G'
          };
          
          if (found) {
             ans = Array.from(new Set(found.map(m => ansMap[m.toUpperCase()] || m.toUpperCase()))).join('');
          } else {
             ans = ansText; 
          }

          result.push(`\n**정답:**\n정답은 ${ans}이다.`);
          continue;
        }

        // 마커가 없는 일반 문장은 현재 단락에 차곡차곡 쌓아 1줄로 병합
        accumulatedText.push(line);
      }

      flush(); 

      if (qNum > 1) {
        result.push("\n---");
      }

      // 연속된 공백줄 정리
      editor.value = result.join('\n').replace(/\n{3,}/g, '\n\n').trim();
    }

    // 3. 편집된 TXT 파일로 저장
    function exportToTxt() {
      const textToSave = editor.value;
      if (!textToSave.trim()) {
        alert('저장할 내용이 없습니다.');
        return;
      }

      const blob = new Blob([textToSave], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'formatted_problems.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 4. 편집된 MD 파일로 저장
    function exportToMd() {
      const textToSave = editor.value;
      if (!textToSave.trim()) {
        alert('저장할 내용이 없습니다.');
        return;
      }

      const blob = new Blob([textToSave], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'formatted_problems.md';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
