<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 엑셀 데이터 비교</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
    /* =========================================
       1. CSS 변수 (모던 컬러 팔레트 & 타이포그래피)
       ========================================= */
    :root {
        --bg-body: #F3F4F6;
        --bg-surface: #FFFFFF;
        --text-main: #111827;
        --text-muted: #6B7280;
        --border-color: #E5E7EB;
        
        --primary: #4F46E5;
        --primary-hover: #4338CA;
        
        /* Diff Colors (부드러운 파스텔톤) */
        --diff-change-bg: #EFF6FF;
        --diff-change-text: #1D4ED8;
        --diff-add-bg: #ECFDF5;
        --diff-add-text: #047857;
        --diff-del-bg: #FEF2F2;
        --diff-del-text: #B91C1C;
        
        --radius-md: 8px;
        --radius-lg: 12px;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    /* =========================================
       2. 전역 스타일 & 스크롤바
       ========================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        background-color: var(--bg-body); 
        color: var(--text-main); 
        font-size: 14px; 
        height: 100vh; 
        display: flex; 
        flex-direction: column;
        overflow: hidden;
    }

    .app {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    /* 커스텀 스크롤바 적용 */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; border: 2px solid transparent; background-clip: padding-box; }

    /* =========================================
       3. 레이아웃
       ========================================= */
    header {
        background: var(--bg-surface);
        padding: 16px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
        z-index: 30;
        flex-shrink: 0;
    }
    header h1 { font-size: 20px; font-weight: 700; color: #111827; display: flex; align-items: center; gap: 10px; }
    header span { font-size: 13px; color: var(--text-muted); font-weight: 500; }

    .layout-main { display: flex; flex: 1; overflow: hidden; padding: 24px; gap: 24px; min-height: 0; }
    
    .sidebar { width: 320px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; flex-shrink: 0; transition: all 0.3s ease; }
    .sidebar.hidden { width: 0; padding: 0; margin: 0; opacity: 0; overflow: hidden; gap: 0; border: none; }
    .content-area { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden; border: 1px solid var(--border-color); }

    /* =========================================
       4. UI 컴포넌트 (카드, 버튼, 입력폼)
       ========================================= */
    .card { background: var(--bg-surface); padding: 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); border: 1px solid var(--border-color); flex-shrink: 0; }
    .card-title { font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }

    .input-group { margin-bottom: 16px; }
    .input-group:last-child { margin-bottom: 0; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #374151; }
    
    input[type="file"] { 
        width: 100%; padding: 8px; font-size: 12px; color: var(--text-muted);
        border: 1px dashed #D1D5DB; border-radius: var(--radius-md); background: #F9FAFB;
        cursor: pointer; transition: 0.2s;
    }
    input[type="file"]:hover { border-color: var(--primary); background: #EEF2FF; }

    select { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #D1D5DB; border-radius: var(--radius-md); background-color: #fff; color: var(--text-main); outline: none; cursor: pointer; transition: 0.2s; }
    select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
    select:disabled { background-color: #F3F4F6; cursor: not-allowed; }

    .btn { width: 100%; padding: 12px; font-size: 14px; font-weight: 600; border: none; border-radius: var(--radius-md); cursor: pointer; transition: all 0.2s ease; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:last-child { margin-bottom: 0; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: var(--shadow-sm); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-secondary { background: #F3F4F6; color: #374151; border: 1px solid #E5E7EB; }
    .btn-secondary:hover { background: #E5E7EB; }
    .btn-outline { background: transparent; border: 1px solid #D1D5DB; color: #374151; }
    .btn-outline:hover { background: #F9FAFB; border-color: #9CA3AF; }
    .btn-danger-outline { background: transparent; border: 1px solid #FCA5A5; color: #DC2626; margin-top: 16px; }
    .btn-danger-outline:hover { background: #FEF2F2; border-color: #EF4444; }

    /* =========================================
       5. 툴바 & 테이블
       ========================================= */
    .toolbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border-color); background: #F9FAFB; flex-shrink: 0; }
    .toolbar-left { display: flex; align-items: center; gap: 12px; }
    .status-text { font-weight: 600; color: #374151; font-size: 14px; }
    
    .legend { display: flex; gap: 16px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--text-muted); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    .table-container { flex: 1; overflow: auto; position: relative; background: #fff; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 1500px; }
    th, td { padding: 14px 20px; border-bottom: 1px solid var(--border-color); text-align: left; font-size: 13px; white-space: nowrap; }
    
    th { 
        background: #F9FAFB; font-weight: 700; color: var(--text-muted); 
        position: sticky; top: 0; z-index: 10; 
        border-bottom: 2px solid var(--border-color); 
        box-shadow: 0 1px 0 var(--border-color); 
    }
    
    /* Hover Effect */
    tbody tr { transition: background-color 0.15s; }
    tbody tr:hover { background-color: #F9FAFB; }

    /* =========================================
       6. 틀고정 (Sticky Columns)
       ========================================= */
    .sticky-no { position: sticky; left: 0; min-width: 60px; max-width: 60px; text-align: center; padding: 14px 10px; }
    .sticky-key { position: sticky; left: 60px; min-width: 150px; border-right: 2px solid var(--border-color); }
    
    td.sticky-no, td.sticky-key { background-color: #FFFFFF; z-index: 5; }
    th.sticky-no, th.sticky-key { background-color: #F9FAFB; z-index: 20; /* 헤더 z-index 10보다 높게 */ }
    
    /* 행 오버 시 고정열 배경색도 동일하게 맞춰줌 */
    tbody tr:hover td.sticky-no, 
    tbody tr:hover td.sticky-key { background-color: #F9FAFB; }

    /* Status Badges */
    .badge { padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 700; display: inline-block; text-align: center; }
    .badge-change { background: var(--diff-change-bg); color: var(--diff-change-text); }
    .badge-add { background: var(--diff-add-bg); color: var(--diff-add-text); }
    .badge-del { background: var(--diff-del-bg); color: var(--diff-del-text); }

    /* Diff Cell Backgrounds */
    .cell-change { background-color: var(--diff-change-bg); color: var(--diff-change-text); font-weight: 600; }
    .cell-add { background-color: var(--diff-add-bg); color: var(--diff-add-text); font-weight: 600; }
    .cell-del { background-color: var(--diff-del-bg); color: var(--diff-del-text); font-weight: 600; }
    .cell-muted { color: #9CA3AF; }

    /* Empty State */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 300px; color: var(--text-muted); gap: 12px; }
    .empty-state svg { width: 64px; height: 64px; opacity: 0.5; color: #9CA3AF; }
    .empty-state p { font-size: 15px; font-weight: 500; }
</style>
</head>
<body>

<div class="app">
    <header>
        <h1>📐 엑셀 데이터 비교</h1>
        <span></span>
    </header>

    <div class="layout-main">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="card">
                <div class="card-title">1. 데이터 로드</div>
                <div class="input-group">
                    <label for="originalFile">📁 원본 파일 (Previous)</label>
                    <input type="file" id="originalFile" accept=".xlsx, .xls, .csv">
                </div>
                <div class="input-group">
                    <label for="targetFile">📂 대상 파일 (Current)</label>
                    <input type="file" id="targetFile" accept=".xlsx, .xls, .csv">
                </div>
            </div>

            <div class="card">
                <div class="card-title">2. 매칭 기준 설정</div>
                <div class="input-group">
                    <label for="keyColumn">고유 키 (Key Column)</label>
                    <select id="keyColumn" disabled>
                        <option value="">파일을 업로드해주세요</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <div class="card-title">3. 실행 및 병합</div>
                <button class="btn btn-primary" id="btnCompare">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    비교 실행
                </button>
                <button class="btn btn-secondary" id="btnMerge">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline></svg>
                    변경사항 적용 후 저장
                </button>
                <button class="btn btn-outline" id="btnExport">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    비교 결과만 다운로드
                </button>
                <button class="btn btn-danger-outline" id="btnReset">초기화</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content-area">
            <div class="toolbar">
                <div class="toolbar-left">
                    <button id="btnToggleSidebar" class="btn btn-secondary" style="width: auto; padding: 8px 12px; margin-bottom: 0;" title="사이드메뉴 토글">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="3" x2="9" y2="21"></line>
                        </svg>
                    </button>
                    <div class="status-text" id="statusMsg">파일을 업로드하고 비교를 실행하세요.</div>
                </div>
                <div class="legend">
                    <div class="legend-item"><span class="legend-dot" style="background: var(--diff-change-text)"></span>값 변경</div>
                    <div class="legend-item"><span class="legend-dot" style="background: var(--diff-add-text)"></span>행 추가</div>
                    <div class="legend-item"><span class="legend-dot" style="background: var(--diff-del-text)"></span>행 삭제</div>
                </div>
            </div>
            
            <div class="table-container" id="resultContainer">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="12" y1="18" x2="12" y2="12"></line>
                        <line x1="9" y1="15" x2="15" y2="15"></line>
                    </svg>
                    <p>데이터가 없습니다.</p>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
/**
 * 1. 상태 관리 (State)
 */
const AppState = {
    originalData: [],
    targetData: [],
    differences: [],
    headers: [],
    
    reset() {
        this.originalData = [];
        this.targetData = [];
        this.differences = [];
        this.headers = [];
    }
};

/**
 * 2. DOM 요소 참조
 */
const DOM = {
    origFile: document.getElementById('originalFile'),
    targFile: document.getElementById('targetFile'),
    keySelect: document.getElementById('keyColumn'),
    btnCompare: document.getElementById('btnCompare'),
    btnMerge: document.getElementById('btnMerge'),
    btnExport: document.getElementById('btnExport'),
    btnReset: document.getElementById('btnReset'),
    btnToggleSidebar: document.getElementById('btnToggleSidebar'),
    sidebar: document.querySelector('.sidebar'),
    statusMsg: document.getElementById('statusMsg'),
    resultContainer: document.getElementById('resultContainer')
};

/**
 * 3. 유틸리티 함수
 */
const Utils = {
    cleanKey(key) {
        if (!key) return "";
        return key.toString().replace(/_x[0-9a-fA-F]{4}_/g, "").replace(/[\r\n]+/g, "").trim();
    },
    formatValue(val) {
        if (val instanceof Date) return val.toISOString().split('T')[0];
        return val || "";
    },
    setStatus(msg, isError = false) {
        DOM.statusMsg.innerHTML = msg;
        DOM.statusMsg.style.color = isError ? "var(--diff-del-text)" : "#374151";
    }
};

/**
 * 4. 엑셀 파일 처리 로직
 */
const ExcelService = {
    read(file, callback) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rawJson = XLSX.utils.sheet_to_json(sheet, { defval: "", dateNF: 'yyyy-mm-dd' });
                
                const normalized = rawJson.map(row => {
                    const newRow = {};
                    Object.keys(row).forEach(key => {
                        const cleanK = Utils.cleanKey(key);
                        if (cleanK && !cleanK.startsWith("__EMPTY")) {
                            newRow[cleanK] = Utils.formatValue(row[key]);
                        }
                    });
                    return newRow;
                });
                callback(normalized);
            } catch (err) {
                alert("파일 읽기 오류: " + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    },

    updateHeaders() {
        const combined = [...AppState.originalData, ...AppState.targetData];
        if (combined.length === 0) return;

        const headerSet = new Set();
        combined.forEach(row => Object.keys(row).forEach(k => headerSet.add(k)));
        AppState.headers = Array.from(headerSet);

        const prevVal = DOM.keySelect.value;
        DOM.keySelect.innerHTML = AppState.headers.map(h => `<option value="${h}">${h}</option>`).join('');
        DOM.keySelect.disabled = false;
        
        if (AppState.headers.includes(prevVal)) DOM.keySelect.value = prevVal;
    }
};

/**
 * 5. 비교 엔진
 */
const Comparator = {
    getKey(item) {
        const col = DOM.keySelect.value;
        return item[col] ? String(item[col]).trim() : "";
    },

    run() {
        if (!AppState.originalData.length || !AppState.targetData.length) {
            alert("원본 파일과 대상 파일을 모두 업로드해주세요.");
            return;
        }
        const keyCol = DOM.keySelect.value;
        if (!keyCol) {
            alert("기준 키 컬럼을 선택해주세요.");
            return;
        }

        AppState.differences = [];
        const displayHeaders = AppState.headers.filter(h => h !== keyCol);
        let count = 0;
        
        // 테이블 헤더 (틀고정 클래스 추가)
        let html = `<table>
            <thead>
                <tr>
                    <th class="sticky-no">No.</th>
                    <th class="sticky-key">기준키 (${keyCol})</th>
                    <th style="text-align:center;">상태</th>
                    <th>변경필드</th>
                    ${displayHeaders.map(h => `<th>${h} (전)</th><th>${h} (후)</th>`).join('')}
                </tr>
            </thead>
            <tbody>`;

        // 1. 대상 기준 (변경 및 추가)
        AppState.targetData.forEach(t => {
            const curKey = this.getKey(t);
            if (!curKey) return;

            const o = AppState.originalData.find(item => this.getKey(item) === curKey);
            if (o) {
                let changedFields = [];
                let cellsHtml = "";
                displayHeaders.forEach(h => {
                    const valO = o[h] || "";
                    const valT = t[h] || "";
                    if (valO != valT) {
                        changedFields.push(h);
                        cellsHtml += `<td class="cell-change">${valO}</td><td class="cell-change">${valT}</td>`;
                    } else {
                        cellsHtml += `<td class="cell-muted">${valO}</td><td>${valT}</td>`;
                    }
                });
                
                if (changedFields.length > 0) {
                    count++;
                    AppState.differences.push({ key: curKey, target: t, changed: changedFields, type: "변경" });
                    html += `<tr>
                        <td class="sticky-no">${count}</td>
                        <td class="sticky-key" style="font-weight:700;">${curKey}</td>
                        <td style="text-align:center;"><span class="badge badge-change">변경</span></td>
                        <td style="color:var(--diff-del-text); font-size:12px;">${changedFields.join(", ")}</td>
                        ${cellsHtml}
                    </tr>`;
                }
            } else {
                // 추가
                count++;
                AppState.differences.push({ key: curKey, target: t, changed: displayHeaders, type: "추가" });
                let cellsHtml = displayHeaders.map(h => `<td></td><td class="cell-add">${t[h] || ""}</td>`).join('');
                html += `<tr>
                    <td class="sticky-no">${count}</td>
                    <td class="sticky-key" style="font-weight:700;">${curKey}</td>
                    <td style="text-align:center;"><span class="badge badge-add">추가</span></td>
                    <td>-</td>
                    ${cellsHtml}
                </tr>`;
            }
        });

        // 2. 원본 기준 (삭제)
        AppState.originalData.forEach(o => {
            const curKey = this.getKey(o);
            if (!curKey) return;
            const t = AppState.targetData.find(item => this.getKey(item) === curKey);
            
            if (!t) {
                count++;
                AppState.differences.push({ key: curKey, target: o, changed: displayHeaders, type: "삭제" });
                let cellsHtml = displayHeaders.map(h => `<td class="cell-del">${o[h] || ""}</td><td></td>`).join('');
                html += `<tr>
                    <td class="sticky-no">${count}</td>
                    <td class="sticky-key" style="font-weight:700;">${curKey}</td>
                    <td style="text-align:center;"><span class="badge badge-del">삭제</span></td>
                    <td>-</td>
                    ${cellsHtml}
                </tr>`;
            }
        });

        html += `</tbody></table>`;

        if (count === 0) {
            DOM.resultContainer.innerHTML = `
                <div class="empty-state" style="color:var(--primary);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--primary); opacity:1;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    <p style="font-size:16px;">변경된 내용이 없습니다. 두 파일이 일치합니다.</p>
                </div>`;
            Utils.setStatus("비교 완료: 변경사항 없음");
        } else {
            DOM.resultContainer.innerHTML = html;
            Utils.setStatus(`비교 완료: 총 <span style="color:var(--diff-del-text);">${count}</span>건의 차이점 발견`);
        }
    }
};

/**
 * 6. 데이터 병합 및 내보내기
 */
const ExportService = {
    mergeAndSave() {
        if (!AppState.differences.length) return alert("병합할 변경 내역이 없습니다.");
        if (!confirm(`${AppState.differences.length}건의 변경사항을 원본에 반영하여 다운로드하시겠습니까?`)) return;

        let merged = JSON.parse(JSON.stringify(AppState.originalData));
        const priority = { "추가": 1, "변경": 2, "삭제": 3 };
        
        AppState.differences.sort((a, b) => (priority[a.type] || 9) - (priority[b.type] || 9));

        const HISTORY_COL = "_변경이력_";
        AppState.differences.forEach(diff => {
            const idx = merged.findIndex(item => Comparator.getKey(item) === diff.key);
            
            if (diff.type === "변경" && idx > -1) {
                AppState.headers.forEach(h => { if(diff.changed.includes(h)) merged[idx][h] = diff.target[h]; });
                merged[idx][HISTORY_COL] = "수정됨 (" + diff.changed.join(", ") + ")";
            } 
            else if (diff.type === "추가") {
                let newItem = {};
                AppState.headers.forEach(h => { newItem[h] = diff.target[h] || ""; });
                newItem[HISTORY_COL] = "신규 행 추가";
                merged.push(newItem);
            } 
            else if (diff.type === "삭제" && idx > -1) {
                merged[idx][HISTORY_COL] = "삭제됨 (데이터 유지)";
            }
        });

        const ws = XLSX.utils.json_to_sheet(merged);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Merged_Data");
        XLSX.writeFile(wb, "merged_result.xlsx");
    },

    downloadGrid() {
        const table = DOM.resultContainer.querySelector("table");
        if (!table) return alert("비교를 먼저 실행해주세요.");
        
        const ws = XLSX.utils.table_to_sheet(table);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Diff_Report");
        XLSX.writeFile(wb, "compare_report.xlsx");
    }
};

/**
 * 7. 이벤트 바인딩
 */
DOM.btnToggleSidebar.addEventListener('click', () => {
    DOM.sidebar.classList.toggle('hidden');
});

DOM.origFile.addEventListener('change', e => {
    if (e.target.files[0]) ExcelService.read(e.target.files[0], data => {
        AppState.originalData = data;
        ExcelService.updateHeaders();
        Utils.setStatus(`원본 로드 완료 (${data.length}행)`);
    });
});

DOM.targFile.addEventListener('change', e => {
    if (e.target.files[0]) ExcelService.read(e.target.files[0], data => {
        AppState.targetData = data;
        ExcelService.updateHeaders();
        Utils.setStatus(`대상 로드 완료 (${data.length}행)`);
    });
});

DOM.btnCompare.addEventListener('click', () => Comparator.run());
DOM.btnMerge.addEventListener('click', () => ExportService.mergeAndSave());
DOM.btnExport.addEventListener('click', () => ExportService.downloadGrid());

DOM.btnReset.addEventListener('click', () => {
    if (!confirm("모든 데이터를 초기화하시겠습니까?")) return;
    AppState.reset();
    DOM.origFile.value = "";
    DOM.targFile.value = "";
    DOM.keySelect.innerHTML = '<option value="">파일을 업로드해주세요</option>';
    DOM.keySelect.disabled = true;
    DOM.resultContainer.innerHTML = `
        <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
            <p>데이터가 없습니다.</p>
        </div>`;
    Utils.setStatus("초기화되었습니다.");
});
</script>
