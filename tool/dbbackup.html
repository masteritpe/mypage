<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DB 백업 매니저</title>
  
  <!-- 폰트 및 아이콘 로드 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

  <style>
    /* === 1. Reset & Variables === */
    :root {
      --bg-app: #f3f4f6;
      --text-main: #1f2937;
      --border: #e5e7eb;
      --accent: #4f46e5;
      --accent-light: #e0e7ff;
      --accent-bg: #eef2ff;
      --danger: #ef4444;
      --success: #10b981;
      --gray: #6b7280;
      /* 폰트 완벽 통일 */
      --main-font: 'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-code: 'JetBrains Mono', Consolas, "Courier New", monospace; 
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; outline: none; }
    body, button, input, select, textarea {
      margin: 0; 
      font-family: var(--main-font); 
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }
    body {
      background: var(--bg-app); color: var(--text-main);
      font-size: 15px;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* === 2. Header === */
    header {
      background: #fff; height: 64px; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border); z-index: 50; flex-shrink: 0;
    }
    
    .header-left { display: flex; align-items: center; gap: 16px; }
    .logo { 
        font-size: 20px; font-weight: 800; color: var(--accent); 
        display: flex; align-items: center; gap: 10px; margin: 0; white-space: nowrap; 
    }

    .toolbar { display: flex; gap: 10px; align-items: center; }
    
    .btn {
      height: 38px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--border);
      background: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      font-weight: 600; font-size: 14px; color: #4b5563; transition: 0.2s; white-space: nowrap;
    }
    .btn:hover { background: #f9fafb; border-color: #d1d5db; color: #111827; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: #4338ca; }
    .btn-icon { border: none; background: transparent; cursor: pointer; color: #9ca3af; font-size: 18px; transition:0.2s; padding: 6px; border-radius: 6px;}
    .btn-icon:hover { color: var(--accent); background: #f3f4f6; }

    /* === 3. Main Layout === */
    main { flex: 1; display: flex; height: calc(100vh - 64px); overflow: hidden; }

    #sidebar {
      width: 300px; background: #fff; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0; z-index: 20;
    }
    
    .sidebar-header { 
        height: 60px;
        padding: 0 20px; 
        border-bottom: 1px solid var(--border); 
        background: #f9fafb; 
        display: flex; 
        flex-direction: row; 
        align-items: center; 
        gap: 8px; 
        font-weight: 700; 
        color: var(--gray); 
        font-size: 14px; 
        flex-shrink: 0;
    }
    .list-scroll { flex: 1; overflow-y: auto; }
    
    .list-item {
      padding: 14px 20px; border-bottom: 1px solid #f3f4f6; cursor: pointer;
      display: flex; flex-direction: column; gap: 4px; transition: 0.1s; border-left: 4px solid transparent; font-weight: 500; color: #4b5563; font-size: 15px;
    }
    .list-item:hover { background: #f9fafb; }
    .list-item.active { background: var(--accent-bg); border-left-color: var(--accent); color: var(--accent); font-weight: 700;}

    #editor-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-app); position: relative; }
    
    .editor-actions {
      height: 60px; 
      flex-shrink: 0; padding: 0 28px; background: rgba(255,255,255,0.95);
      border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
      gap: 24px;
      backdrop-filter: blur(5px); z-index: 10;
    }

    .editor-scroller { flex: 1; overflow-y: auto; padding: 24px; scroll-behavior: smooth; }
    
    .paper {
      max-width: 900px; margin: 0 auto 40px auto; background: #fff;
      padding: 32px 40px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
      border-radius: 12px; display: flex; flex-direction: column; gap: 24px; border: 1px solid #e5e7eb;
    }

    .paper-input-lg {
      border: none; background: transparent; font-family: var(--main-font);
      font-size: 22px; font-weight: 800; color: #1f2937;
      width: 100%; transition: 0.2s; padding: 4px 8px; margin: 0;
      border-bottom: 2px solid transparent; outline: none; border-radius: 6px; letter-spacing: -0.02em;
      min-width: 0;
    }
    .paper-input-lg:focus { border-bottom-color: var(--accent); background: #f9fafb; box-shadow: 0 0 0 3px var(--accent-light); }
    .paper-input-lg::placeholder { color: #d1d5db; }

    .section-label {
      font-size: 14px; font-weight: 700; color: #6b7280; margin-bottom: 12px; display: flex; gap:8px; align-items: center;
      border-bottom: 2px solid #f3f4f6; padding-bottom: 10px;
    }

    /* === Form Elements === */
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .form-label { font-size: 13px; font-weight: 700; color: #6b7280; }
    .form-control { padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; transition: 0.2s; color: #1f2937; background: #fff;}
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
    
    .folder-picker-area { display: flex; gap: 12px; align-items: center; background: #f9fafb; padding: 12px 16px; border-radius: 8px; border: 1px dashed #d1d5db; }
    .folder-path { flex: 1; font-family: var(--font-code); font-size: 14px; color: var(--accent); word-break: break-all; font-weight: 600; }

    /* === Table === */
    .table-wrapper { border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; text-align: left; background: #fff; }
    th, td { padding: 14px 20px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
    th { background: #f9fafb; font-weight: 700; color: #6b7280; }
    tbody tr:hover { background: #f9fafb; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding: 4px 10px; border-radius: 6px; font-size: 13px; }
    .status-success { background: #ecfdf5; color: #10b981; }
    .status-fail { background: #fef2f2; color: #ef4444; }

    /* === Modals === */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(2px); z-index: 2500; display: none; align-items: center; justify-content: center; }
    .modal-box { background: #fff; width: 480px; padding: 32px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 20px; }
    
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .modal-header h3 { margin: 0; font-size: 18px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
    
    .modal-footer { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }

    /* === Progress Loader === */
    .progress-box { width: 340px; text-align: center; align-items: center; padding: 48px 32px; }
    .spinner {
        font-size: 48px; color: var(--accent); margin-bottom: 20px;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* 🌟 Toast Notification */
    #toast-area { 
        position: fixed; 
        bottom: 40px; 
        left: 50%; 
        transform: translateX(-50%); 
        z-index: 3000; 
        display: flex; 
        flex-direction: column; 
        gap: 10px; 
        align-items: center;
        pointer-events: none;
    }
    .toast { 
        background: rgba(17, 24, 39, 0.9);
        color: #fff; 
        padding: 12px 24px; 
        border-radius: 8px; 
        font-size: 14px; 
        font-weight: 600; 
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); 
        animation: toast-fade 1s ease-in-out forwards; 
    }
    @keyframes toast-fade { 
        0% { opacity: 0; transform: translateY(15px); } 
        20% { opacity: 1; transform: translateY(0); } 
        80% { opacity: 1; transform: translateY(0); } 
        100% { opacity: 0; transform: translateY(-15px); } 
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1 class="logo"><i class="fas fa-database"></i> DB 백업 매니저</h1>
  </div>
  <div class="toolbar">
    <!-- 🌟 단축키 모달 버튼 추가 -->
    <button class="btn" onclick="openShortcutModal()">
      <i class="fas fa-keyboard"></i> 단축키
    </button>
    <label class="btn" style="cursor:pointer">
      <i class="fas fa-file-import" style="color:#f59e0b;"></i> 데이터 복구
      <input type="file" id="restoreFileInput" accept=".json" style="display:none" multiple onchange="handleRestoreFiles(this)">
    </label>
    <div style="width:1px; height:24px; background:#e5e7eb; margin:0 8px;"></div>
    <button class="btn btn-primary" onclick="openAddModal()"><i class="fas fa-plus"></i> 새 스케줄</button>
  </div>
</header>

<main>
  <aside id="sidebar">
    <div class="sidebar-header">
      <i class="fas fa-list-ul"></i> 백업 스케줄 목록
    </div>
    <!-- 🌟 사이드바 검색 필터 영역 -->
    <div style="padding: 12px 20px; border-bottom: 1px solid var(--border); background: #fff;">
        <div style="position: relative;">
            <i class="fas fa-search" style="position: absolute; left: 12px; top: 12px; color: #9ca3af; font-size: 13px;"></i>
            <input type="text" id="sidebarFilter" class="form-control" placeholder="스케줄 검색..." style="width: 100%; font-size: 13px; padding: 10px 10px 10px 34px;">
        </div>
    </div>
    <div class="list-scroll" id="jobList"></div>
  </aside>

  <section id="editor-area">
    <div id="mainContent" style="display:none; height:100%; flex-direction:column;">
        <div class="editor-actions">
          <div style="display: flex; align-items: center; flex: 1; min-width: 0;">
            <input type="text" id="editJobName" class="paper-input-lg" placeholder="스케줄 이름 입력">
          </div>
          <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
            <button class="btn" id="btnRun" onclick="runBackupJob('수동실행')" style="color:#10b981; border-color:#a7f3d0; background:#ecfdf5;" title="단축키: Alt + S">
              <i class="fas fa-play"></i> 지금 실행
            </button>
            <button class="btn" onclick="saveJobConfig()" id="btnSaveConfig" title="단축키: Ctrl + S">
              <i class="fas fa-save"></i> 저장
            </button>
            <div style="width:1px; height:24px; background:#e5e7eb; margin:0 8px;"></div>
            <button class="btn-icon" onclick="deleteJob()" title="삭제" style="color:#ef4444;">
              <i class="far fa-trash-alt"></i>
            </button>
          </div>
        </div>

        <div class="editor-scroller">
          <div class="paper">
            
            <div class="section-label">
                <i class="fas fa-cog"></i> 설정 (Configuration)
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <div class="form-group">
                    <label class="form-label">대상 DB</label>
                    <select id="editTargetDB" class="form-control"></select>
                </div>
                <div class="form-group">
                    <label class="form-label">실행 주기</label>
                    <select id="editCycle" class="form-control">
                        <option value="daily">매일 1회</option>
                        <option value="manual">수동 전용</option>
                    </select>
                </div>
            </div>

            <div class="form-group" style="margin-top: 12px;">
                <label class="form-label">백업 저장 폴더</label>
                <div class="folder-picker-area">
                    <button class="btn" style="height:34px;" onclick="selectSaveDirectory()"><i class="far fa-folder-open"></i> 폴더 선택</button>
                    <div class="folder-path" id="savePathDisplay">기본 다운로드 경로 사용</div>
                </div>
            </div>

            <div class="section-label" style="margin-top: 32px;">
                <i class="fas fa-history"></i> 실행 이력 (Logs)
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 180px;">일시</th>
                            <th style="width: 120px;">상태</th>
                            <th>메시지</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody"></tbody>
                </table>
            </div>

          </div>
        </div>
    </div>
    
    <!-- Empty State -->
    <div id="mainEmpty" style="display:flex; flex:1; align-items:center; justify-content:center; color:#9ca3af; flex-direction:column; gap:20px;">
        <i class="fas fa-layer-group" style="font-size:56px; opacity:0.5;"></i>
        <div style="font-size: 16px; font-weight: 600;">좌측에서 스케줄을 선택하거나 새로 등록하세요.</div>
    </div>
  </section>
</main>

<!-- 스케줄 추가 모달 -->
<div id="addModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <h3><i class="fas fa-plus-circle" style="color:var(--accent)"></i> 새 스케줄 등록</h3>
            <button class="btn-icon" onclick="closeModal()"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="form-group">
            <label class="form-label">스케줄 이름</label>
            <input type="text" id="newJobName" class="form-control" placeholder="예: 전체 데이터 일일 백업">
        </div>
        <div class="form-group">
            <label class="form-label">대상 DB</label>
            <select id="newTargetDB" class="form-control"></select>
        </div>
        <div class="form-group">
            <label class="form-label">주기 설정</label>
            <select id="newCycle" class="form-control">
                <option value="daily">매일 1회</option>
                <option value="manual">수동으로만</option>
            </select>
        </div>
        
        <div class="modal-footer">
            <button class="btn" onclick="closeModal()">취소</button>
            <button class="btn btn-primary" onclick="addNewJob()"><i class="fas fa-save"></i> 저장</button>
        </div>
    </div>
</div>

<!-- 🌟 단축키 안내 모달 -->
<div id="shortcutModal" class="modal-overlay" onclick="closeShortcutModal()">
    <div class="modal-box" onclick="event.stopPropagation()" style="width: 400px; padding: 24px;">
        <div class="modal-header" style="margin-bottom: 16px;">
            <h3><i class="fas fa-keyboard" style="color:var(--accent)"></i> 키보드 단축키</h3>
            <button class="btn-icon" onclick="closeShortcutModal()"><i class="fas fa-times"></i></button>
        </div>
        <ul style="font-size: 14px; color: var(--text-main); padding-left: 24px; line-height: 2.2; margin: 0;">
            <li><b>저장하기:</b> <kbd style="background:#f3f4f6; border:1px solid #d1d5db; padding:2px 6px; border-radius:4px; font-family:var(--font-code); font-size:12px;">Ctrl</kbd> + <kbd style="background:#f3f4f6; border:1px solid #d1d5db; padding:2px 6px; border-radius:4px; font-family:var(--font-code); font-size:12px;">S</kbd></li>
            <li><b>지금 실행:</b> <kbd style="background:#f3f4f6; border:1px solid #d1d5db; padding:2px 6px; border-radius:4px; font-family:var(--font-code); font-size:12px;">Alt</kbd> + <kbd style="background:#f3f4f6; border:1px solid #d1d5db; padding:2px 6px; border-radius:4px; font-family:var(--font-code); font-size:12px;">S</kbd></li>
        </ul>
        <div class="modal-footer" style="margin-top: 16px;">
            <button class="btn btn-primary" onclick="closeShortcutModal()">확인</button>
        </div>
    </div>
</div>

<!-- 처리중 프로그레스 모달 -->
<div id="progressModal" class="modal-overlay">
    <div class="modal-box progress-box">
        <i class="fas fa-circle-notch spinner"></i>
        <h3 id="progressTitle" style="margin:0 0 12px 0; font-size:18px; color:#1f2937;">처리 중...</h3>
        <p id="progressDesc" style="margin:0; font-size:14px; color:#6b7280; line-height:1.5;">데이터를 안전하게 처리하고 있습니다.</p>
    </div>
</div>

<!-- 토스트 팝업 컨테이너 -->
<div id="toast-area"></div>

<script>
    const MANAGER_DB_NAME = 'BackupDB';
    let managerDB, currentJobId = null, availableDBs = [];
    let directoryHandle = null; 

    // 토스트 알림 함수
    function showToast(msg) {
        const area = document.getElementById("toast-area");
        const el = document.createElement("div");
        el.className = "toast";
        el.textContent = msg;
        area.appendChild(el);
        
        setTimeout(() => el.remove(), 1000); 
    }

    // 🌟 모달 제어 (단축키)
    function openShortcutModal() { document.getElementById('shortcutModal').style.display = 'flex'; }
    function closeShortcutModal() { document.getElementById('shortcutModal').style.display = 'none'; }

    // 단축키 이벤트 리스너
    document.addEventListener("keydown", (e) => {
        const isCmdCtrl = (navigator.platform.toUpperCase().indexOf('MAC') >= 0) ? e.metaKey : e.ctrlKey;
        
        // Ctrl + S : 저장
        if (isCmdCtrl && !e.altKey && e.key.toLowerCase() === 's') { 
            e.preventDefault(); 
            if (currentJobId && document.getElementById('mainContent').style.display !== 'none') {
                saveJobConfig(); 
            }
            return; 
        }
        
        // Alt + S : 지금 실행
        if (!isCmdCtrl && e.altKey && e.key.toLowerCase() === 's') {
            e.preventDefault();
            if (currentJobId && document.getElementById('mainContent').style.display !== 'none') {
                runBackupJob('수동실행');
            }
            return;
        }
    });

    // 🌟 사이드바 검색 필터 이벤트 리스너
    document.getElementById('sidebarFilter').addEventListener('input', function(e) {
        const keyword = e.target.value.toLowerCase();
        const listItems = document.querySelectorAll('#jobList .list-item');
        
        listItems.forEach(item => {
            const text = item.textContent.toLowerCase();
            if(text.includes(keyword)) {
                item.style.display = 'flex';
            } else {
                item.style.display = 'none';
            }
        });
    });

    window.onload = async () => {
        await fetchAvailableDBs();
        await initManagerDB();
        await loadJobs();
    };

    async function fetchAvailableDBs() {
        if (indexedDB.databases) {
            const dbs = await indexedDB.databases();
            availableDBs = dbs.map(d => d.name).filter(n => !n.startsWith('BackupSchedulerDB'));
        }
        ['newTargetDB', 'editTargetDB'].forEach(id => {
            const sel = document.getElementById(id);
            sel.innerHTML = '<option value="">DB 선택...</option><option value="ALL">전체 DB 백업 (ALL)</option>';
            availableDBs.forEach(db => sel.innerHTML += `<option value="${db}">${db}</option>`);
        });
    }

    function initManagerDB() {
        return new Promise((res, rej) => {
            const req = indexedDB.open(MANAGER_DB_NAME, 1);
            req.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('jobs')) db.createObjectStore('jobs', { keyPath: 'id' });
                if (!db.objectStoreNames.contains('logs')) db.createObjectStore('logs', { keyPath: 'id', autoIncrement: true }).createIndex('jobId', 'jobId');
                if (!db.objectStoreNames.contains('config')) db.createObjectStore('config', { keyPath: 'key' });
            };
            req.onsuccess = async e => { managerDB = e.target.result; await loadDirectoryHandle(); res(); };
            req.onerror = e => rej(e);
        });
    }

    async function selectSaveDirectory() {
        try {
            directoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            document.getElementById('savePathDisplay').innerText = directoryHandle.name;
            managerDB.transaction('config', 'readwrite').objectStore('config').put({ key: 'backupFolder', handle: directoryHandle });
        } catch (err) {}
    }

    async function loadDirectoryHandle() {
        return new Promise((resolve) => {
            managerDB.transaction('config', 'readonly').objectStore('config').get('backupFolder').onsuccess = async (e) => {
                if (e.target.result) {
                    directoryHandle = e.target.result.handle;
                    document.getElementById('savePathDisplay').innerText = `${directoryHandle.name} (권한 필요)`;
                }
                resolve();
            };
        });
    }

    async function verifyPermission(fileHandle) {
        const options = { mode: 'readwrite' };
        if ((await fileHandle.queryPermission(options)) === 'granted') return true;
        if ((await fileHandle.requestPermission(options)) === 'granted') return true;
        return false;
    }

    // --- 백업 로직 ---
    async function processValueForBackup(val) {
        if (val instanceof Blob || val instanceof File) {
            const chunkSize = 5 * 1024 * 1024;
            const chunks = [];
            for (let offset = 0; offset < val.size; offset += chunkSize) {
                const slice = val.slice(offset, offset + chunkSize);
                const base64 = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result.indexOf(',') !== -1 ? reader.result.split(',')[1] : reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(slice);
                });
                chunks.push(base64 || "");
            }
            return { __type: "ChunkedBlob", mime: val.type, dataChunks: chunks, name: val.name || "" };
        } else if (Array.isArray(val)) {
            return await Promise.all(val.map(item => processValueForBackup(item)));
        } else if (val && typeof val === 'object' && val !== null) {
            if (val instanceof ArrayBuffer || ArrayBuffer.isView(val)) return await processValueForBackup(new Blob([val]));
            const newVal = {};
            for (const key of Object.keys(val)) newVal[key] = await processValueForBackup(val[key]);
            return newVal;
        }
        return val;
    }

    function showProgress(title, desc) {
        document.getElementById('progressTitle').innerText = title;
        document.getElementById('progressDesc').innerText = desc;
        document.getElementById('progressModal').style.display = 'flex';
    }
    function hideProgress() {
        document.getElementById('progressModal').style.display = 'none';
    }

    async function runBackupJob(type) {
        if(!currentJobId) return;
        const btn = document.getElementById('btnRun');
        const originalBtnHTML = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 실행 중'; 
        btn.disabled = true;
        
        showProgress('데이터 백업', '초기화 중입니다...');

        try {
            const job = await new Promise(res => managerDB.transaction('jobs').objectStore('jobs').get(currentJobId).onsuccess = e => res(e.target.result));
            job.targetDB = document.getElementById('editTargetDB').value;
            
            const dbsToBackup = job.targetDB === 'ALL' ? availableDBs : [job.targetDB];
            let allMessages = [];

            if (directoryHandle) await verifyPermission(directoryHandle);

            for (let dbName of dbsToBackup) {
                document.getElementById('progressDesc').innerText = `${dbName} 추출 중...`;
                const msg = await executeBackupSingleDB(dbName);
                allMessages.push(msg);
            }

            const finalMsg = allMessages.join(" | ");
            managerDB.transaction('logs', 'readwrite').objectStore('logs').add({
                jobId: job.id, time: new Date().toLocaleString(), type, status: '성공', message: finalMsg
            });
            
            job.lastRunDate = new Date().toISOString().split('T')[0];
            managerDB.transaction('jobs', 'readwrite').objectStore('jobs').put(job);
            
            showToast('백업이 완료되었습니다.');
        } catch (err) {
            managerDB.transaction('logs', 'readwrite').objectStore('logs').add({
                jobId: currentJobId, time: new Date().toLocaleString(), type, status: '실패', message: err.message || err
            });
            showToast('백업 중 오류가 발생했습니다.');
        } finally {
            btn.innerHTML = originalBtnHTML; 
            btn.disabled = false;
            hideProgress();
            loadJobs(); loadLogs(currentJobId);
        }
    }

    async function executeBackupSingleDB(dbName) {
        const request = indexedDB.open(dbName);
        const db = await new Promise((res, rej) => {
            request.onsuccess = e => res(e.target.result);
            request.onerror = () => rej("DB 오픈 실패: " + dbName);
        });

        const stores = Array.from(db.objectStoreNames);
        const MAX_CHUNK_LENGTH = 100 * 1024 * 1024; 

        let partIndex = 1;
        let jsonParts = [];
        let currentChunkSize = 0;
        let currentStore = null;
        let isFirstItem = true;
        let stringBuffer = "";

        const flushBuffer = () => { if(stringBuffer.length > 0) { jsonParts.push(stringBuffer); currentChunkSize += stringBuffer.length; stringBuffer = ""; } };
        const pushStr = (str) => { stringBuffer += str; if(stringBuffer.length > 512 * 1024) flushBuffer(); };

        const streamStringify = (val) => {
            if(val === null || val === undefined) pushStr("null");
            else if(typeof val === "string") pushStr(JSON.stringify(val));
            else if(typeof val === "number" || typeof val === "boolean") pushStr(String(val));
            else if(Array.isArray(val)) {
                pushStr("["); for(let i=0; i<val.length; i++) { streamStringify(val[i]); if(i < val.length-1) pushStr(","); } pushStr("]");
            } else if(typeof val === "object") {
                pushStr("{"); const keys = Object.keys(val);
                for(let i=0; i<keys.length; i++) {
                    pushStr(JSON.stringify(keys[i]) + ":"); streamStringify(val[keys[i]]); if(i < keys.length-1) pushStr(",");
                }
                pushStr("}");
            }
        };

        const startNewChunk = (storeName) => {
            const startStr = `{"database":"${db.name}","version":${db.version},"part":${partIndex},"stores":{"${storeName}":[`;
            jsonParts = []; stringBuffer = ""; currentChunkSize = 0; pushStr(startStr); currentStore = storeName; isFirstItem = true;
        };

        let generatedFiles = [];
        const closeAndDownloadChunk = async () => {
            pushStr(`]}}`); flushBuffer();
            const blob = new Blob(jsonParts, { type: "application/json" });
            const timeStr = new Date().toISOString().replace(/[:T-]/g, '').slice(0, 14);
            const fileName = `${db.name}_Backup_${timeStr}_part${partIndex}.json`;

            if (directoryHandle) {
                const fileHandle = await directoryHandle.getFileHandle(fileName, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(blob);
                await writable.close();
            } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = fileName;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            generatedFiles.push(`part${partIndex}`);
            partIndex++; jsonParts = []; stringBuffer = ""; currentChunkSize = 0;
        };

        for (const storeName of stores) {
            if (jsonParts.length === 0 && stringBuffer.length === 0) startNewChunk(storeName);
            else if (currentStore !== storeName) { pushStr(`], "${storeName}":[`); currentStore = storeName; isFirstItem = true; }

            let lastKey = null; let hasMore = true;
            while (hasMore) {
                const batch = await new Promise((res, rej) => {
                    const tx = db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const range = lastKey !== null ? IDBKeyRange.lowerBound(lastKey, true) : null;
                    const req = store.openCursor(range);
                    const results = []; let count = 0;
                    
                    req.onsuccess = e => {
                        const cursor = e.target.result;
                        if(cursor && count < 50) {
                            let val = cursor.value;
                            if(!store.keyPath && val && typeof val === 'object') val.__idb_out_key = cursor.key;
                            results.push(val); lastKey = cursor.key; count++; cursor.continue();
                        } else res(results);
                    };
                    req.onerror = rej;
                });

                if(batch.length === 0) break;
                
                for(let i=0; i<batch.length; i++) {
                    const processedItem = await processValueForBackup(batch[i]);
                    if(!isFirstItem) pushStr(",");
                    streamStringify(processedItem);
                    isFirstItem = false;

                    if (currentChunkSize + stringBuffer.length > MAX_CHUNK_LENGTH) {
                        await closeAndDownloadChunk();
                        startNewChunk(storeName);
                    }
                }
            }
        }
        if(jsonParts.length > 0 || stringBuffer.length > 0) await closeAndDownloadChunk();
        
        db.close();
        return `[${dbName}] 완료 (${generatedFiles.length}개 파일)`;
    }

    // --- 데이터 복구(Restore) ---
    async function processValueForRestore(val) {
        if (val && typeof val === 'object') {
            if (val.__type === "ChunkedBlob") {
                const byteArrays = [];
                for (const b64Chunk of val.dataChunks) {
                    const byteString = atob(b64Chunk);
                    const byteNumbers = new Array(byteString.length);
                    for (let i = 0; i < byteString.length; i++) byteNumbers[i] = byteString.charCodeAt(i);
                    byteArrays.push(new Uint8Array(byteNumbers));
                }
                const blob = new Blob(byteArrays, { type: val.mime });
                if(val.name) return new File([blob], val.name, { type: val.mime });
                return blob;
            } else if (Array.isArray(val)) {
                return await Promise.all(val.map(item => processValueForRestore(item)));
            } else {
                const newVal = {};
                for (const key of Object.keys(val)) newVal[key] = await processValueForRestore(val[key]);
                return newVal;
            }
        }
        return val;
    }

    async function handleRestoreFiles(input) {
        if(!input.files || input.files.length === 0) return;
        
        if(!confirm(`선택한 ${input.files.length}개의 백업 파일을 복구하시겠습니까?\n(동일한 키가 존재하면 덮어쓰기 됩니다)`)) {
            input.value = ''; return;
        }

        showProgress('데이터 복구', '파일 분석 및 덮어쓰기 중...');

        try {
            for(let file of input.files) {
                document.getElementById('progressDesc').innerText = `${file.name} 복구 중...`;
                const textData = await file.text();
                const json = JSON.parse(textData);
                
                if(!json.database || !json.stores) throw new Error("유효하지 않은 백업 파일 형식이 포함되어 있습니다.");
                const dbName = json.database;

                const request = indexedDB.open(dbName);
                const db = await new Promise((res, rej) => {
                    request.onsuccess = e => res(e.target.result);
                    request.onerror = () => rej(`'${dbName}' DB 접근 실패`);
                });

                for (const storeName of Object.keys(json.stores)) {
                    if(!db.objectStoreNames.contains(storeName)) continue;

                    const rawRecords = json.stores[storeName];
                    const processedRecords = await Promise.all(rawRecords.map(async (record) => await processValueForRestore(record)));

                    const tempTx = db.transaction(storeName, 'readonly');
                    const keyPath = tempTx.objectStore(storeName).keyPath;

                    const tx = db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    
                    for (let finalData of processedRecords) {
                        if (keyPath) store.put(finalData);
                        else {
                            let explicitKey = finalData.__idb_out_key;
                            if (explicitKey !== undefined) delete finalData.__idb_out_key;
                            else explicitKey = finalData.id || finalData._id || finalData.key;

                            if (explicitKey !== undefined) store.put(finalData, explicitKey);
                            else store.put(finalData);
                        }
                    }

                    await new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = () => reject("데이터 덮어쓰기 에러"); });
                }
                db.close();
            }
            
            setTimeout(() => {
                hideProgress();
                showToast("복구가 완료되었습니다.");
            }, 500);
            
        } catch (err) {
            hideProgress();
            alert("복구 중 에러 발생: " + err.message);
        } finally {
            input.value = '';
        }
    }

    // --- 기타 UI 제어 ---
    function loadJobs() {
        const list = document.getElementById('jobList');
        managerDB.transaction('jobs').objectStore('jobs').getAll().onsuccess = e => {
            list.innerHTML = '';
            const filterKeyword = document.getElementById('sidebarFilter').value.toLowerCase();
            
            e.target.result.forEach(j => {
                const item = document.createElement('div');
                item.className = `list-item ${currentJobId === j.id ? 'active' : ''}`;
                item.innerHTML = j.name;
                item.onclick = () => selectJob(j.id);
                
                // 검색어에 따른 초기 디스플레이 설정
                if(j.name.toLowerCase().includes(filterKeyword)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
                list.appendChild(item);
            });
        };
    }
    
    function selectJob(id) {
        currentJobId = id; loadJobs();
        document.getElementById('mainEmpty').style.display = 'none';
        document.getElementById('mainContent').style.display = 'flex';
        managerDB.transaction('jobs').objectStore('jobs').get(id).onsuccess = e => {
            const j = e.target.result;
            document.getElementById('editJobName').value = j.name; 
            document.getElementById('editTargetDB').value = j.targetDB || '';
            document.getElementById('editCycle').value = j.cycle;
            loadLogs(id);
        };
    }
    
    function loadLogs(jobId) {
        managerDB.transaction('logs').objectStore('logs').index('jobId').getAll(IDBKeyRange.only(jobId)).onsuccess = e => {
            const logs = e.target.result.sort((a,b) => b.id - a.id);
            document.getElementById('logTableBody').innerHTML = logs.map(l => {
                const statusBadge = l.status === '성공' 
                    ? `<span class="status-badge status-success"><i class="fas fa-check-circle"></i> 성공</span>` 
                    : `<span class="status-badge status-fail"><i class="fas fa-exclamation-circle"></i> 실패</span>`;
                return `<tr>
                    <td style="color:#6b7280; font-family:var(--font-code);">${l.time}</td>
                    <td>${statusBadge}</td>
                    <td style="color:#374151; line-height:1.4;">${l.message}</td>
                </tr>`;
            }).join('');
        };
    }
    
    function openAddModal() { 
        document.getElementById('newJobName').value = '';
        document.getElementById('addModal').style.display = 'flex'; 
    }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }
    
    function addNewJob() {
        const name = document.getElementById('newJobName').value.trim();
        if(!name) return alert("스케줄 이름을 입력해주세요.");
        const newJob = { id: 'job_'+Date.now(), name, targetDB: document.getElementById('newTargetDB').value, cycle: document.getElementById('newCycle').value, lastRunDate: '' };
        managerDB.transaction('jobs', 'readwrite').objectStore('jobs').add(newJob).onsuccess = () => { 
            closeModal(); loadJobs(); selectJob(newJob.id); 
            showToast("새 스케줄이 등록되었습니다.");
        };
    }
    
    function saveJobConfig() {
        if(!currentJobId) return;
        managerDB.transaction('jobs', 'readwrite').objectStore('jobs').get(currentJobId).onsuccess = e => {
            const j = e.target.result;
            j.name = document.getElementById('editJobName').value.trim();
            j.targetDB = document.getElementById('editTargetDB').value; 
            j.cycle = document.getElementById('editCycle').value;
            managerDB.transaction('jobs', 'readwrite').objectStore('jobs').put(j).onsuccess = () => {
                showToast("저장되었습니다.");
                loadJobs();
            };
        };
    }
    
    function deleteJob() {
        if(!currentJobId || !confirm('해당 백업 스케줄을 삭제하시겠습니까?')) return;
        managerDB.transaction('jobs', 'readwrite').objectStore('jobs').delete(currentJobId).onsuccess = () => { 
            currentJobId=null; 
            document.getElementById('mainContent').style.display='none'; 
            document.getElementById('mainEmpty').style.display='flex'; 
            loadJobs(); 
            showToast("스케줄이 삭제되었습니다.");
        };
    }
</script>
