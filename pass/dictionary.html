<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>두음 종합사전 (5R / Keynote / Drill)</title>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://webfontworld.github.io/kopub/KoPubWorldDotum.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --bg-body: #F9FAFB;
      --bg-surface: #FFFFFF;
      --bg-sidebar: #F3F4F6;
      --border-light: #F3F4F6;
      --border-base: #E5E7EB;
      --border-dark: #D1D5DB;
      --text-main: #111827;
      --text-muted: #6B7280;
      --primary: #111827;
      --primary-hover: #374151;
      --secondary: #FFFFFF;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --radius-md: 8px;
      --radius-lg: 12px;
      
      /* Source Colors */
      --tag-5r: #2563EB;
      --tag-5r-bg: #EFF6FF;
      --tag-keynote: #059669;
      --tag-keynote-bg: #ECFDF5;
      --tag-drill: #D97706;
      --tag-drill-bg: #FFFBEB;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg-body); color: var(--text-main); margin: 0; padding: 0;
      -webkit-font-smoothing: antialiased; height: 100vh; display: flex; overflow: hidden;
    }

    /* === Sidebar === */
    .sidebar { width: 300px; background: var(--bg-surface); border-right: 1px solid var(--border-base); display: flex; flex-direction: column; z-index: 10; }
    .sidebar-header { height: 64px; min-height: 64px; padding: 0 20px; border-bottom: 1px solid var(--border-base); display: flex; align-items: center; }
    .app-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; margin: 0; width: 100%; }

    .sidebar-tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--border-base); background: #F9FAFB; }
    .sidebar-tab { flex: 1 1 50%; text-align: center; padding: 12px 0; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; user-select: none; }
    .sidebar-tab:hover { color: var(--primary); }
    .sidebar-tab.active { color: var(--primary); border-bottom-color: var(--primary); background: var(--bg-surface); }

    .sidebar-search { padding: 16px 20px; border-bottom: 1px solid var(--border-light); background: var(--bg-surface); }
    .search-box { width: 100%; padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid var(--border-base); font-size: 13px; background: var(--bg-body); outline: none; }
    .search-box:focus { border-color: var(--primary); }

    .stats-info { padding: 16px 20px; font-size: 13px; font-weight: 600; color: var(--text-muted); display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-light); }

    /* === Main Content === */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: var(--bg-body); position: relative; scroll-behavior: smooth; }
    .top-bar { position: sticky; top: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); height: 64px; min-height: 64px; padding: 0 30px; border-bottom: 1px solid var(--border-base); display: flex; justify-content: space-between; align-items: center; z-index: 5; }
    .page-title { font-size: 20px; font-weight: 700; color: var(--text-main); margin: 0; }
    
    .actions { display: flex; gap: 8px; align-items: center; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; border: 1px solid transparent; outline: none; }
    .btn-primary { background: var(--primary); color: white; box-shadow: var(--shadow-sm); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-outline { background: var(--secondary); color: var(--text-main); border-color: var(--border-base); }
    .btn-outline:hover { background: var(--bg-body); border-color: #D1D5DB; }

    .btn-toggle { transition: all 0.2s; }
    .btn-toggle.active { background: #EFF6FF; color: #1D4ED8; border-color: #BFDBFE; }

    .content-wrapper { padding: 30px 40px; max-width: 1200px; margin: 0 auto; width: 100%; }

    /* === Dictionary Cards === */
    .dict-list { display: flex; flex-direction: column; gap: 16px; }
    .dict-card { background: var(--bg-surface); border: 1px solid var(--border-base); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 16px; transition: 0.2s; page-break-inside: avoid; }
    .dict-card:hover { border-color: var(--border-dark); }
    
    .dict-header { display: flex; align-items: flex-start; gap: 12px; }
    .dict-source-badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; }
    .badge-5r { background: var(--tag-5r-bg); color: var(--tag-5r); border: 1px solid #BFDBFE; }
    .badge-keynote { background: var(--tag-keynote-bg); color: var(--tag-keynote); border: 1px solid #A7F3D0; }
    .badge-drill { background: var(--tag-drill-bg); color: var(--tag-drill); border: 1px solid #FDE68A; }

    .dict-topic { font-size: 18px; font-weight: 700; color: var(--primary); line-height: 1.4; margin: 0; }
    
    .dict-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 800px) { .dict-grid { grid-template-columns: 1fr; } }
    
    .dict-section { display: flex; flex-direction: column; gap: 8px; background: var(--bg-body); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-light); }
    .dict-label { font-size: 13px; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    
    /* 가독성을 위해 본문 텍스트 크기 17px로 고정 */
    .dict-content { font-size: 17px; line-height: 1.6; color: var(--text-main); white-space: pre-wrap; word-break: break-word; }
    
    .mnemonic-badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .mnemonic-pill {
      background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; 
      font-weight: 700; padding: 4px 10px; border-radius: 6px; font-size: 13px; letter-spacing: 0.5px;
    }

    .dict-content b, .dict-content strong { font-weight: 800; background: rgba(255,255,0,0.2); }
    .dict-content .highlight-dueum { background: #0d3a9e; color: #ffffff; padding: 2px 4px; border-radius: 4px; font-weight: bold; }
    .dict-content img { max-width: 100%; height: auto; border-radius: 4px; }

    #loadMoreSentinel { height: 20px; margin-top: 20px; display: flex; justify-content: center; align-items: center; color: var(--text-muted); font-size: 14px; }

    /* === Mnemonic Print Styles === */
    #print-acronym-container { display: none; }
    .acronym-print-item { border-bottom: 1px solid #cbd5e1; margin-bottom: 20px; padding-bottom: 15px; page-break-inside: avoid; text-align: left; }
    .acronym-print-source { font-size: 10pt; color: #64748b; font-weight: bold; margin-bottom: 4px; }
    .acronym-print-topic { font-size: 14pt; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
    .acronym-print-def { font-size: 11pt; color: #334155; line-height: 1.6; margin-bottom: 12px; }
    .acronym-print-acronyms { font-size: 12pt; font-weight: 800; background: #f8fafc; padding: 6px 12px; border-radius: 6px; border: 1px solid #e2e8f0; display: inline-block; }

    @media print {
      @page { size: A4; margin: 15mm; }
      body { display: block; overflow: visible; background: white; color: #000; font-family: 'KoPubWorldDotum', sans-serif !important; }
      .sidebar, .top-bar { display: none !important; }
      .main-content { overflow: visible; background: white; padding: 0; display: block; }
      #loadMoreSentinel { display: none !important; }
      
      /* 일반 PDF 출력 모드 */
      body:not(.printing-acronym) .content-wrapper { padding: 0; max-width: 100%; margin: 0; }
      body:not(.printing-acronym) .dict-card { border: none !important; border-bottom: 2px solid #111827 !important; border-radius: 0 !important; box-shadow: none !important; padding: 0 0 20px 0 !important; margin-bottom: 24px !important; display: block !important; }
      body:not(.printing-acronym) .dict-section { background: transparent !important; border: none !important; padding: 0 !important; margin-bottom: 12px; }
      body:not(.printing-acronym) .dict-grid { display: block; }
      body:not(.printing-acronym) .dict-topic { font-size: 16pt; margin-bottom: 12px; }
      body:not(.printing-acronym) .dict-label { font-size: 10pt; color: #4B5563; border-bottom: 1px solid #D1D5DB; padding-bottom: 4px; margin-bottom: 8px; }
      body:not(.printing-acronym) .dict-content { font-size: 12pt; line-height: 1.5; }
      body:not(.printing-acronym) .dict-source-badge { border: 1px solid #D1D5DB; background: #F3F4F6 !important; color: #374151 !important; }
      body:not(.printing-acronym) .mnemonic-pill { border: 1px solid #D1D5DB; background: #F9FAFB !important; color: #111827 !important; }

      /* 두음 전용 출력 모드 */
      body.printing-acronym .content-wrapper { display: none !important; }
      body.printing-acronym #print-acronym-container { display: block !important; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h1 class="app-title"><i class="ph-fill ph-book-open-text" style="font-size: 20px; color: var(--primary)"></i> 두음 종합사전</h1>
    </div>
    
    <div class="sidebar-tabs">
      <div class="sidebar-tab active" data-source="ALL" onclick="setFilter('ALL')">전체</div>
      <div class="sidebar-tab" data-source="5R" onclick="setFilter('5R')">5R</div>
      <div class="sidebar-tab" data-source="Keynote" onclick="setFilter('Keynote')">Keynote</div>
      <div class="sidebar-tab" data-source="Drill" onclick="setFilter('Drill')">Drill</div>
    </div>

    <div class="sidebar-search">
      <input type="text" id="searchInput" class="search-box" placeholder="토픽, 정의, 두음 검색..." onkeyup="executeSearch()">
    </div>
    
    <div class="stats-info">
      <span>조회된 문항 수</span>
      <span id="resultCount">0건</span>
    </div>
  </aside>

  <main class="main-content" id="mainContent">
    <div class="top-bar">
      <h2 class="page-title" id="pageTitle">전체 종합사전</h2>
      <div class="actions">
        <button id="btnToggleMnemonic" class="btn btn-outline btn-toggle active" onclick="toggleMnemonicView()">
          <i class="ph-fill ph-lightbulb"></i> 두음보기
        </button>
        <button class="btn btn-outline" onclick="loadAllDatabases()" title="데이터베이스 다시 읽기">
          <i class="ph ph-arrows-clockwise"></i> 새로고침
        </button>
        
        <div style="width: 1px; height: 20px; background: var(--border-base); margin: 0 4px;"></div>
        
        <button class="btn btn-outline" onclick="printAcronyms()">
          <i class="ph ph-file-pdf"></i> 두음 출력
        </button>
        <button class="btn btn-primary" onclick="window.print()">
          <i class="ph ph-printer"></i> PDF 출력
        </button>
      </div>
    </div>

    <div class="content-wrapper">
      <div id="dictionaryList" class="dict-list">
        <div id="initialLoading" style="text-align: center; padding: 50px; color: var(--text-muted);">
          데이터를 불러오는 중입니다...
        </div>
      </div>
      <div id="loadMoreSentinel"></div>
    </div>

    <div id="print-acronym-container"></div>
  </main>

  <script>
    let globalDictionary = [];
    let filteredDictionary = [];
    let currentFilter = 'ALL';
    let showOnlyWithMnemonics = true; // 기본값: 활성화
    
    let renderedCount = 0;
    const ITEMS_PER_BATCH = 20;
    let observer = null;

    // 단일 글로벌 DOM 요소 생성 (메모리 누수 원천 차단)
    const parsingDiv = document.createElement('div');

    function toggleMnemonicView() {
      showOnlyWithMnemonics = !showOnlyWithMnemonics;
      const btn = document.getElementById('btnToggleMnemonic');
      
      if (showOnlyWithMnemonics) btn.classList.add('active');
      else btn.classList.remove('active');
      
      executeSearch();
    }

    function printAcronyms() {
      const printContainer = document.getElementById('print-acronym-container');
      printContainer.innerHTML = '';
      
      if (filteredDictionary.length === 0) {
        alert("출력할 데이터가 없습니다.");
        return;
      }

      const titleMap = { 'ALL': '전체 종합사전', '5R': '5R Checklist', 'Keynote': 'Keynote', 'Drill': 'Writing Drill' };
      const docTitle = `<h2 style="text-align: center; margin-bottom: 20px; font-weight: 800; color: #000;">두음 정리 리스트 (${titleMap[currentFilter]})</h2>`;
      printContainer.innerHTML = docTitle;

      filteredDictionary.forEach(item => {
        const plainTopic = cleanHTML(item.topic) || '<span style="color:#ccc;">(제목 없음)</span>';
        const plainDef = cleanHTML(item.def) || '';

        let acronymHtml = '';
        if (item.tags && item.tags.length > 0) {
          const uniqueAcronyms = Array.from(new Set(item.tags));
          acronymHtml = `<div class="acronym-print-acronyms">💡 두음: <span style="color:#1D4ED8;">${uniqueAcronyms.join(' / ')}</span></div>`;
        }

        const div = document.createElement('div');
        div.className = 'acronym-print-item';
        div.innerHTML = `
            <div class="acronym-print-source">[${item.source}]</div>
            <div class="acronym-print-topic">${plainTopic}</div>
            <div class="acronym-print-def">${plainDef}</div>
            ${acronymHtml}
        `;
        printContainer.appendChild(div);
      });

      document.body.classList.add('printing-acronym');
      setTimeout(() => {
          window.print();
          document.body.classList.remove('printing-acronym');
      }, 300);
    }

    // 화면 렌더링용 HTML 포맷 변환
    function cleanHTML(html) {
      if (!html) return '';
      let s = String(html);
      s = s.replace(/<\s*dueum\s*>/gi, '<span class="highlight-dueum">').replace(/<\s*\/\s*dueum\s*>/gi, '</span>');
      s = s.replace(/<span[^>]*style="[^"]*background-color:\s*(?:#0d3a9e|rgb\(13,\s*58,\s*158\))[^>]*>/gi, '<span class="highlight-dueum">');
      return s;
    }

    // 불필요한 태그를 지우고 순수 텍스트 추출
    function stripHTML(htmlStr) {
      if (!htmlStr) return '';
      return String(htmlStr).replace(/<[^>]+>/g, ' ').replace(/&nbsp;/gi, ' ').replace(/\s+/g, ' ').trim();
    }

    // 엄격한 유효성 판별: 한글, 영문, 숫자가 최소 1개 이상 있어야만 유효 두음으로 인정
    function isMeaningfulPlain(plainText) {
      if (!plainText) return false;
      return /[가-힣a-zA-Z0-9]/.test(plainText); 
    }

    // DOM 트리를 재사용하여 초고속&무누수로 두음 텍스트만 콕 집어 추출
    function extractMnemonicsFast(htmlString) {
      if (!htmlString) return [];
      parsingDiv.innerHTML = htmlString;
      let results = [];
      let currentStr = '';

      const walker = document.createTreeWalker(parsingDiv, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, null, false);
      let node;
      
      while ((node = walker.nextNode())) {
        if (node.nodeType === Node.TEXT_NODE) {
          let isHighlighted = false;
          let parent = node.parentElement;
          
          while (parent && parent !== parsingDiv) {
            const tag = parent.tagName.toLowerCase();
            const bg = parent.style ? (parent.style.backgroundColor || parent.style.background || '').toLowerCase() : '';
            
            // 남색 계열, 초록색 계열, <dueum> 태그 감지
            if (bg.includes('#0d3a9e') || (bg.includes('13') && bg.includes('58') && bg.includes('158')) ||
                bg.includes('#296e01') || (bg.includes('41') && bg.includes('110') && bg.includes('1')) ||
                tag === 'dueum') {
              isHighlighted = true; break;
            }
            parent = parent.parentElement;
          }

          if (isHighlighted) {
            currentStr += node.textContent;
          } else {
            if (isMeaningfulPlain(currentStr)) results.push(currentStr.trim());
            currentStr = '';
          }
        } else if (node.nodeType === Node.ELEMENT_NODE) {
          const tag = node.tagName.toLowerCase();
          // 블록 레벨 요소에서 문자열 연결이 끊기도록 처리
          if (['br', 'p', 'div', 'li'].includes(tag)) {
            if (isMeaningfulPlain(currentStr)) results.push(currentStr.trim());
            currentStr = '';
          }
        }
      }
      if (isMeaningfulPlain(currentStr)) results.push(currentStr.trim());
      
      parsingDiv.innerHTML = ''; // 메모리 즉시 반환
      return Array.from(new Set(results));
    }

    function fetchFromIndexedDB(dbName, storeName) {
      return new Promise((resolve) => {
        const request = indexedDB.open(dbName, 1);
        request.onsuccess = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(storeName)) {
            resolve([]);
            return;
          }
          const transaction = db.transaction([storeName], 'readonly');
          const store = transaction.objectStore(storeName);
          const getAllRequest = store.getAll();
          getAllRequest.onsuccess = () => resolve(getAllRequest.result || []);
          getAllRequest.onerror = () => resolve([]);
        };
        request.onerror = () => resolve([]);
      });
    }

    async function load5R() {
      let items = await fetchFromIndexedDB('5RChecklistDB', 'items');
      const results = [];
      for (const item of items) {
        if (item.topic || item.definition || item.mnemonic) {
          const fullHtml = [item.topic, item.definition, item.mnemonic].join(' ');
          
          let tags = extractMnemonicsFast(fullHtml);

          results.push({
            source: '5R',
            topic: item.topic || '(토픽 없음)',
            def: item.definition || '',
            mnemonicDetail: item.mnemonic || '',
            tags: tags,
            // 초고속 검색을 위한 사전 캐싱
            searchStr: `${stripHTML(item.topic)} ${stripHTML(item.definition)} ${stripHTML(item.mnemonic)}`.toLowerCase()
          });
        }
      }
      items = null;
      return results;
    }

    async function loadKeynote() {
      let notes = await fetchFromIndexedDB('StudyNoteDB', 'notes');
      const results = [];
      for (const note of notes) {
        if (note.topic || note.definition || note.mnemonic) {
          const fullHtml = [note.topic || note.title, note.definition, note.mnemonic].join(' ');
          let tags = extractMnemonicsFast(fullHtml);

          results.push({
            source: 'Keynote',
            topic: note.topic || note.title || '(토픽 없음)',
            def: note.definition || '',
            mnemonicDetail: note.mnemonic || '',
            tags: tags,
            searchStr: `${stripHTML(note.topic || note.title)} ${stripHTML(note.definition)} ${stripHTML(note.mnemonic)}`.toLowerCase()
          });
        }
        if (note.items && Array.isArray(note.items)) {
          for (const it of note.items) {
            if (it.problem || it.concept || it.solution) {
              const fullHtml = [it.problem, it.lead, it.concept, it.solution].join(' ');
              let tags = extractMnemonicsFast(fullHtml);

              results.push({
                source: 'Keynote',
                topic: it.problem || '(토픽 없음)',
                def: it.concept || '',
                mnemonicDetail: it.solution || '', 
                tags: tags,
                searchStr: `${stripHTML(it.problem)} ${stripHTML(it.lead)} ${stripHTML(it.concept)} ${stripHTML(it.solution)}`.toLowerCase()
              });
            }
          }
        }
      }
      notes = null;
      return results;
    }

    async function loadDrill() {
      let questions = await fetchFromIndexedDB('WritingDrillReviewDB', 'questions');
      const results = [];
      for (const q of questions) {
        if (q.topic || q.def || q.keys) {
          const fullHtml = [q.topic, q.def, q.keys].join(' ');
          let tags = extractMnemonicsFast(fullHtml);

          results.push({
            source: 'Drill',
            topic: q.topic || '(토픽 없음)',
            def: q.def || '',
            mnemonicDetail: q.keys || '',
            tags: tags,
            searchStr: `${stripHTML(q.topic)} ${stripHTML(q.def)} ${stripHTML(q.keys)}`.toLowerCase()
          });
        }
      }
      questions = null;
      return results;
    }

    async function loadAllDatabases() {
      const listContainer = document.getElementById('dictionaryList');
      listContainer.innerHTML = '<div style="text-align: center; padding: 50px; color: var(--text-muted);"><i class="ph ph-spinner ph-spin" style="font-size: 24px;"></i> 데이터를 불러오고 있습니다...</div>';

      // 렌더링 블로킹 방지를 위한 지연 양보
      await new Promise(resolve => setTimeout(resolve, 50));

      try {
        const [data5R, dataKeynote, dataDrill] = await Promise.all([
          load5R(), loadKeynote(), loadDrill()
        ]);
        
        globalDictionary = [...data5R, ...dataKeynote, ...dataDrill];
        setupIntersectionObserver();
        executeSearch();
      } catch (err) {
        listContainer.innerHTML = `<div style="text-align: center; padding: 50px; color: #DC2626;">데이터를 불러오는 중 오류가 발생했습니다.<br>${err.message}</div>`;
      }
    }

    function setFilter(source) {
      currentFilter = source;
      
      document.querySelectorAll('.sidebar-tab').forEach(tab => {
        if (tab.dataset.source === source) tab.classList.add('active');
        else tab.classList.remove('active');
      });

      const titleMap = { 'ALL': '전체 종합사전', '5R': '5R Checklist 사전', 'Keynote': 'Keynote 사전', 'Drill': 'Writing Drill 사전' };
      document.getElementById('pageTitle').textContent = titleMap[source];

      executeSearch();
    }

    function executeSearch() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      const listContainer = document.getElementById('dictionaryList');
      
      filteredDictionary = globalDictionary.filter(item => {
        // 1. 소스 필터
        if (currentFilter !== 'ALL' && item.source !== currentFilter) return false;
        
        // 2. 두음 보기 필터: 반드시 명확히 추출된 tags가 하나라도 있어야 함
        if (showOnlyWithMnemonics) {
          if (!item.tags || item.tags.length === 0) return false;
        }

        // 3. 텍스트 검색 필터: 사전 캐싱된 문자열(.searchStr) 비교 (초고속)
        if (keyword) {
          if (!item.searchStr.includes(keyword)) return false;
        }
        return true;
      });

      document.getElementById('resultCount').textContent = `${filteredDictionary.length}건`;
      
      renderedCount = 0;
      listContainer.innerHTML = '';
      
      if (filteredDictionary.length === 0) {
        listContainer.innerHTML = '<div style="text-align: center; padding: 50px; color: var(--text-muted); background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border-base);">조건에 맞는 항목이 없습니다.</div>';
        document.getElementById('loadMoreSentinel').textContent = '';
        return;
      }

      renderNextBatch();
      document.getElementById('mainContent').scrollTop = 0;
    }

    function renderNextBatch() {
      if (renderedCount >= filteredDictionary.length) {
        document.getElementById('loadMoreSentinel').textContent = '모든 항목을 불러왔습니다.';
        return;
      }

      document.getElementById('loadMoreSentinel').innerHTML = '<i class="ph ph-spinner ph-spin"></i> 추가 로딩 중...';

      const listContainer = document.getElementById('dictionaryList');
      const fragment = document.createDocumentFragment();
      const batch = filteredDictionary.slice(renderedCount, renderedCount + ITEMS_PER_BATCH);

      batch.forEach(item => {
        const card = document.createElement('div');
        card.className = 'dict-card';
        
        const badgeClass = item.source === '5R' ? 'badge-5r' : item.source === 'Keynote' ? 'badge-keynote' : 'badge-drill';
        
        const tagsHtml = (item.tags && item.tags.length > 0)
          ? item.tags.map(t => `<span class="mnemonic-pill">${t.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>`).join('')
          : '';

        // 상세 설명 영역 (기존에 억지로 축약해서 보여주던 것을 원본으로 복구)
        const detailHtml = item.mnemonicDetail && stripHTML(item.mnemonicDetail) !== ''
          ? `<div class="dict-content" style="border-top: 1px dashed var(--border-base); padding-top: 12px;">${cleanHTML(item.mnemonicDetail)}</div>`
          : '';
        
        card.innerHTML = `
          <div class="dict-header">
            <div class="dict-source-badge ${badgeClass}">${item.source}</div>
            <h3 class="dict-topic">${cleanHTML(item.topic)}</h3>
          </div>
          <div class="dict-grid">
            <div class="dict-section">
              <div class="dict-label"><i class="ph-fill ph-text-align-left"></i> 정의 (Definition)</div>
              <div class="dict-content">${cleanHTML(item.def) || '<span style="color:#9CA3AF">내용 없음</span>'}</div>
            </div>
            <div class="dict-section">
              <div class="dict-label"><i class="ph-fill ph-lightbulb"></i> 두음 (Mnemonic)</div>
              
              <div class="mnemonic-badges" style="margin-bottom: ${detailHtml ? '12px' : '0'};">
                ${tagsHtml || '<span style="color:#9CA3AF; font-size: 13px;">추출된 두음 없음</span>'}
              </div>

              ${detailHtml}
            </div>
          </div>
        `;
        fragment.appendChild(card);
      });

      listContainer.appendChild(fragment);
      renderedCount += batch.length;
      
      if (renderedCount >= filteredDictionary.length) {
        document.getElementById('loadMoreSentinel').textContent = '모든 항목을 불러왔습니다.';
      } else {
        document.getElementById('loadMoreSentinel').textContent = '스크롤을 내리면 더 불러옵니다.';
      }
    }

    function setupIntersectionObserver() {
      const sentinel = document.getElementById('loadMoreSentinel');
      if (observer) observer.disconnect();
      
      const options = {
        root: document.getElementById('mainContent'),
        rootMargin: '100px',
        threshold: 0
      };

      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting && renderedCount > 0 && renderedCount < filteredDictionary.length) {
            renderNextBatch();
          }
        });
      }, options);

      observer.observe(sentinel);
    }

    window.onload = loadAllDatabases;
  </script>
</body>
</html>
