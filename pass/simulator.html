<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧮 Simulator</title>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    :root {
      --bg-body: #F7F7F5; 
      --bg-surface: #ffffff;
      --brand-dark: #13151a; 
      --brand-gold: #c5a059; 
      --brand-gold-hover: #b08c4a;
      --text-main: #2d3748;
      --text-muted: #718096;
      
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.08);
      
      --radius-card: 20px;
      --radius-btn: 12px;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-body); 
      color: var(--text-main); 
      margin: 0; padding: 0;
      -webkit-font-smoothing: antialiased; 
      height: 100vh; 
      display: flex; 
      flex-direction: column;
    }

    .top-bar { 
      position: sticky; top: 0; width: 100%; 
      background: rgba(19, 21, 26, 0.85); 
      backdrop-filter: blur(16px);
      padding: 0 40px; display: flex; 
      justify-content: space-between; align-items: center; 
      z-index: 100; height: 76px; flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .brand-title { font-size: 20px; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 12px; }
    .brand-icon { font-size: 22px; }

    .header-actions { display: flex; align-items: center; gap: 16px; }

    .sys-btn {
      background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);
      padding: 10px 20px; border-radius: 30px; cursor: pointer; font-size: 14px; font-weight: 600;
      transition: all 0.2s; display: flex; align-items: center; gap: 8px;
    }
    .sys-btn:hover { background: rgba(255,255,255,0.2); border-color: var(--brand-gold); }
    .btn-primary { background: var(--brand-gold); border-color: var(--brand-gold); color: #fff; }
    .btn-primary:hover { background: var(--brand-gold-hover); border-color: var(--brand-gold-hover); }

    .main-content { 
      flex: 1; overflow-y: auto; padding: 40px; 
      background-image: radial-gradient(#D1D1CE 1.5px, transparent 0); 
      background-size: 24px 24px;
    }

    .info-card {
      max-width: 800px; margin: 0 auto 30px; background: var(--bg-surface);
      border-radius: var(--radius-card); padding: 24px; box-shadow: var(--shadow-md);
      border: 1px solid #EBEBE8; text-align: center;
    }
    .info-card h3 { margin: 0 0 10px 0; color: var(--brand-dark); }
    .info-card p { margin: 0 0 20px 0; color: var(--text-muted); font-size: 14px; line-height: 1.5; }

    .dashboard-grid { max-width: 1200px; margin: 0 auto; }
    
    .category-card {
      background: var(--bg-surface); border-radius: var(--radius-card); 
      padding: 24px; box-shadow: var(--shadow-md); border: 1px solid #EBEBE8;
    }
    
    .category-header { font-size: 18px; font-weight: 700; color: var(--brand-dark); display: flex; align-items: center; gap: 10px; padding-bottom: 16px; border-bottom: 1px dashed #EBEBE8; margin-bottom: 16px;} 

    .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
    
    .item-btn { 
      display: flex; align-items: center; gap: 12px; padding: 16px; 
      border-radius: var(--radius-btn); background: #f8fafc; cursor: pointer; 
      color: var(--text-main); font-size: 15px; font-weight: 600; transition: all 0.2s; 
      border: 1px solid #e2e8f0; text-align: left; width: 100%;
    }
    .item-btn:hover { background: #ffffff; border-color: var(--brand-gold); box-shadow: var(--shadow-sm); color: var(--brand-gold-hover); transform: translateY(-2px); }
    .item-icon { font-size: 22px; flex-shrink: 0; }
    .item-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 15px; }

    .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--brand-dark); color: white; padding: 14px 28px; border-radius: 30px; font-size: 14px; opacity: 0; transition: all 0.4s; z-index: 9999; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  </style>
</head>
<body>

  <header class="top-bar">
    <div class="brand-title"><span class="brand-icon">🧮</span> Simulator</div>
    <div class="header-actions">
      <button class="sys-btn btn-primary" onclick="loadSimulatorFolder()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        폴더 연결 및 가져오기
      </button>
      <button class="sys-btn" onclick="location.href='../passportal.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        메인으로
      </button>
    </div>
  </header>

  <main class="main-content">
    
    <div class="info-card" id="infoCard">
      <h3>시뮬레이터 자동 로드</h3>
      <p>우측 상단의 <b>[폴더 연결 및 가져오기]</b> 버튼을 클릭하여 <code>simulator/</code> 폴더를 선택하고 권한을 허용해주세요.<br>해당 폴더 내의 모든 html 파일이 자동으로 메뉴로 구성됩니다.</p>
    </div>

    <div class="dashboard-grid">
      <div class="category-card">
        <div class="category-header">
          <span>🚀</span> <span>가동 가능한 시뮬레이터 목록</span>
        </div>
        <div class="item-grid" id="simulatorGrid">
          <div class="empty-state" id="emptyState">
            폴더를 연결하면 이곳에 시뮬레이터 목록이 표시됩니다.
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">알림 메시지</div>

  <script>
    // 토스트 알림 함수
    let toastTimeout;
    function showToast(msg) {
        const toast = document.getElementById("toast");
        clearTimeout(toastTimeout);
        toast.textContent = msg; 
        toast.classList.add("show"); 
        toastTimeout = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    // 폴더 선택 및 파일 읽기 (File System Access API)
    async function loadSimulatorFolder() {
      try {
        // 사용자에게 폴더 선택 권한 요청
        const dirHandle = await window.showDirectoryPicker({
          id: 'simulatorFolder',
          mode: 'read'
        });

        const htmlFiles = [];
        
        // 폴더 내의 파일들을 비동기로 순회
        for await (const entry of dirHandle.values()) {
          // html 파일만 필터링
          if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.html')) {
            htmlFiles.push(entry.name);
          }
        }

        if (htmlFiles.length === 0) {
          showToast("⚠️ 해당 폴더에 HTML 파일이 없습니다.");
          return;
        }

        renderSimulators(htmlFiles);
        showToast(`✅ ${htmlFiles.length}개의 시뮬레이터를 성공적으로 불러왔습니다.`);
        document.getElementById('infoCard').style.display = 'none';

      } catch (error) {
        if (error.name === 'AbortError') {
          showToast("⚠️ 폴더 선택이 취소되었습니다.");
        } else {
          console.error(error);
          showToast("❌ 폴더를 읽어오는 중 오류가 발생했거나 권한이 거부되었습니다.");
        }
      }
    }

    // 읽어온 파일 목록을 바탕으로 버튼 동적 렌더링
    function renderSimulators(files) {
      const grid = document.getElementById('simulatorGrid');
      grid.innerHTML = ''; // 기존 내용 초기화

      // 가나다(알파벳) 순 정렬
      files.sort();

      files.forEach(fileName => {
        // 확장자를 제외한 파일명을 타이틀로 사용
        const title = fileName.replace(/\.html$/i, '');
        
        // 상대 경로 구성 (사용자가 선택한 폴더 기준의 패스)
        // 로컬 서버 환경에 맞추어 기본 경로를 simulator/ 로 고정
        const srcPath = `../simulator/${fileName}`;

        const button = document.createElement('button');
        button.className = 'item-btn';
        // 클릭 시 해당 시뮬레이터 새창으로 열기
        button.onclick = () => window.open(srcPath, '_blank');
        
        button.innerHTML = `
          <span class="item-icon">📏</span>
          <span class="item-title" title="${title}">${title}</span>
        `;
        
        grid.appendChild(button);
      });
    }
  </script>
</body>
</html>
