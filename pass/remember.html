<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Remember</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="https://unpkg.com/quill-image-resize@3.0.9/image-resize.min.js"></script>

<style>
/* === Modern Light & Soft Theme === */
:root {
    --bg-app: #f8fafc;         
    --bg-panel: #ffffff;       
    --border: #e2e8f0;         
    --border-hover: #cbd5e1;   
    
    --primary: #0d9488;        
    --primary-hover: #0f766e;  
    --primary-light: #ccfbf1;  
    --primary-soft: #f0fdfa;   
    
    --text-main: #334155;      
    --text-sub: #64748b;       
    --text-muted: #94a3b8;     
    
    --success: #10b981;
    --success-light: #d1fae5;
    --danger: #ef4444;
    --danger-light: #fee2e2;
    --warning: #f59e0b;
    --warning-light: #fef3c7;
    
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 24px;
    
    --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
    --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.01);
    --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
    
    --font-ui: 'Inter', 'Noto Sans KR', sans-serif;
    --font-code: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; outline: none; margin: 0; padding: 0; }
body { background: var(--bg-app); color: var(--text-main); font-family: var(--font-ui); font-size: 14px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 2px solid var(--bg-app); }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
.editor-scroll::-webkit-scrollbar-thumb { border-color: var(--bg-panel); }

/* Header */
header { height: 60px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; flex-shrink: 0; justify-content: space-between; z-index: 20; box-shadow: var(--shadow-sm); }
header .brand { font-weight: 700; font-size: 17px; color: var(--text-main); display: flex; align-items: center; gap: 10px; letter-spacing: -0.3px; }
header .brand i { color: var(--primary); font-size: 20px; background: var(--primary-soft); padding: 8px; border-radius: 10px; }
header .header-tools { display: flex; gap: 12px; }

/* Layout */
.workspace { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
.pane-list { width: 360px; background: var(--bg-panel); display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid var(--border); z-index: 10; }
.search-area { padding: 20px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; background: var(--bg-panel); }
.search-input { width: 100%; height: 42px; padding: 0 16px; border: 1px solid transparent; border-radius: var(--radius-sm); font-size: 14px; background: var(--bg-app); color: var(--text-main); transition: 0.2s; }
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px var(--primary-soft); }
.list-scroll { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }

/* Sidebar List Item Card */
.item-card { padding: 16px; border-radius: var(--radius-md); background: #fff; cursor: pointer; border: 1px solid var(--border); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: var(--shadow-sm); }
.item-card:hover { transform: translateY(-2px); border-color: var(--border-hover); box-shadow: 0 6px 12px -2px rgba(15, 23, 42, 0.05); }
.item-card.active { background: var(--primary-soft); border-color: var(--primary-light); box-shadow: 0 0 0 1px var(--primary-light) inset; }
.item-meta { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
.item-type { font-size: 11px; font-weight: 600; color: var(--success); background: var(--success-light); padding: 4px 8px; border-radius: 6px; letter-spacing: -0.2px; }
.item-prj { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; display: block; }
.item-preview { font-size: 14px; color: var(--text-main); line-height: 1.5; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-weight: 500; }
.item-person { font-size: 12px; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 4px; }

/* Editor Pane */
.pane-editor { flex: 1; background: var(--bg-app); display: flex; flex-direction: column; position: relative; }
.toolbar { height: 68px; display: flex; align-items: center; padding: 0 40px; justify-content: space-between; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 5; }
.editor-scroll { flex: 1; overflow-y: auto; padding: 40px; scroll-behavior: smooth; }
.editor-paper { width: 100%; max-width: 1040px; margin: 0 auto; background: var(--bg-panel); padding: 60px 72px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-md); }

/* Forms */
.form-section { margin-bottom: 48px; transition: margin-bottom 0.3s ease; }
.section-title { font-size: 16px; font-weight: 700; color: var(--text-main); border-bottom: 2px solid var(--bg-app); padding-bottom: 14px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; transition: margin-bottom 0.3s, border-color 0.3s; }
.section-title > span { display: flex; align-items: center; gap: 10px; }
.section-title i { color: var(--primary); font-size: 18px; }

/* Accordion Styles */
.accordion-toggle { cursor: pointer; user-select: none; transition: opacity 0.2s; }
.accordion-toggle:hover { opacity: 0.7; }
.accordion-toggle .chevron { transition: transform 0.3s ease; color: var(--text-sub); font-size: 14px; }
.accordion-section.collapsed { margin-bottom: 16px; } 
.accordion-section.collapsed .section-title { margin-bottom: 0; border-bottom-color: transparent; } 
.accordion-section.collapsed .chevron { transform: rotate(180deg); }
.accordion-content { max-height: 800px; overflow: hidden; transition: max-height 0.3s ease, opacity 0.3s ease; opacity: 1; }
.accordion-section.collapsed .accordion-content { max-height: 0; opacity: 0; }

.form-grid { display: grid; grid-template-columns: 1.5fr 1.5fr 1fr; gap: 20px; margin-bottom: 24px; }
.label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.input-field { width: 100%; height: 46px; padding: 0 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-ui); font-size: 14px; transition: 0.2s; background: var(--bg-panel); color: var(--text-main); }
.input-field:hover:not([readonly]) { border-color: var(--border-hover); }
.input-field:focus:not([readonly]) { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); outline: none; }
.input-field.filled { background-color: var(--bg-app); color: var(--text-main); font-weight: 500; border-color: transparent; }

/* Quill Editor */
.editor-wrapper { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; transition: 0.2s; background: var(--bg-panel); }
.editor-wrapper:hover { border-color: var(--border-hover); }
.editor-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.ql-container.ql-snow { border: none !important; font-family: var(--font-ui) !important; }
.ql-editor { min-height: 200px; font-size: 15px; line-height: 1.8; padding: 28px !important; color: var(--text-main); }
#inp-note-container { border-color: #fcd34d; }
#inp-note-container:focus-within { border-color: var(--warning); box-shadow: 0 0 0 4px var(--warning-light); }
#inp-note-container .ql-editor { min-height: 150px; background: #fffbeb; }
.ql-editor img { cursor: zoom-in; border-radius: 8px; box-shadow: var(--shadow-md); margin: 10px 0; border: 1px solid var(--border); }

/* File Attachment UI */
.attach-box { background: var(--bg-app); padding: 28px; border-radius: var(--radius-md); border: 2px dashed var(--border); transition: 0.2s; }
.attach-box:hover { border-color: var(--border-hover); }
.attach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }

.file-card { background: var(--bg-panel); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); position: relative; aspect-ratio: 4 / 3; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid var(--border); }
.file-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--border-hover); }

.file-preview { width: 100%; height: 100%; background: #f8fafc; display: flex; align-items: center; justify-content: center; cursor: zoom-in; }
.file-preview img { width: 100%; height: 100%; object-fit: cover; }
.file-preview i { font-size: 48px; color: var(--text-muted); }

.file-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(15,23,42,0) 0%, rgba(15,23,42,0.85) 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; opacity: 0; transition: opacity 0.2s ease; pointer-events: none; }
.file-card:hover .file-overlay { opacity: 1; }

.file-name-overlay { color: #ffffff; font-size: 13px; font-weight: 500; margin-bottom: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
.file-actions-overlay { display: flex; gap: 8px; pointer-events: auto; }
.file-btn-overlay { flex: 1; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: #fff; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.file-btn-overlay:hover { background: #fff; color: var(--text-main); }
.file-btn-overlay.btn-danger:hover { background: #fef2f2; color: var(--danger); border-color: #fecaca; }

.upload-placeholder { aspect-ratio: 4 / 3; width: 100%; height: 100%; border: 2px dashed var(--border); border-radius: var(--radius-md); background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; text-align: center; }
.upload-placeholder:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

/* Buttons */
.btn { height: 42px; padding: 0 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: all 0.2s ease; font-family: var(--font-ui); }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(13, 148, 136, 0.2); }
.btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 6px 14px rgba(13, 148, 136, 0.3); }
.btn-secondary { background: var(--bg-panel); border-color: var(--border); color: var(--text-main); box-shadow: var(--shadow-sm); }
.btn-secondary:hover { background: var(--bg-app); border-color: var(--border-hover); }
.btn-danger { background: var(--bg-panel); border-color: #fecaca; color: var(--danger); box-shadow: var(--shadow-sm); }
.btn-danger:hover { background: #fef2f2; }
.btn-icon { width: 42px; padding: 0; justify-content: center; font-size: 16px; color: var(--text-sub); }
.btn-sm { height: 36px; font-size: 13px; padding: 0 16px; }

/* Modals */
.modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 2000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
.modal-overlay.show { opacity: 1; }
.settings-box, .modal-panel { background: var(--bg-panel); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
.settings-box { width: 540px; padding: 40px; max-height: 85vh; overflow-y: auto; }
.modal-panel { width: 100%; max-width: 480px; padding: 40px; max-height: 90vh; overflow-y: auto; }
.config-textarea { width: 100%; height: 200px; font-family: var(--font-code); font-size: 13px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); line-height: 1.6; resize: vertical; background: var(--bg-app); color: var(--text-main); }
.config-textarea:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px var(--primary-soft); }

.modal-img-wrapper { position: relative; width: 90vw; max-height: 95vh; display: flex; flex-direction: column; align-items: center; }
.modal-img-toolbar { width: 100%; display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 16px; }
.modal-img { max-width: 100%; max-height: calc(95vh - 60px); object-fit: contain; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); background: var(--bg-panel); border: 1px solid var(--border); }

.hidden { display: none !important; }
.empty-state { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-app); color: var(--text-muted); z-index: 10; }

/* Toast */
#toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #ffffff; padding: 16px 32px; border-radius: 50px; font-size: 14px; font-weight: 500; z-index: 3000; opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: var(--shadow-lg); pointer-events: none; border: 1px solid rgba(255,255,255,0.1); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Shortcut keys */
kbd { background-color: var(--bg-panel); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 6px; padding: 4px 8px; font-family: var(--font-ui); font-size: 11px; font-weight: 600; color: var(--text-main); margin: 0 2px; box-shadow: var(--shadow-sm); }
.shortcut-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--bg-app); }
.shortcut-item:last-child { border-bottom: none; }
.shortcut-desc { font-size: 14px; color: var(--text-main); font-weight: 500; }
</style>
</head>
<body>

<header>
    <div class="brand"><i class="fas fa-bookmark"></i>Remember</div>
    <div class="header-tools">
        <button class="btn btn-secondary btn-icon" id="btn-settings" title="환경설정"><i class="fas fa-cog"></i></button>
        
        <input type="file" id="inp-json-restore" accept=".json" style="display:none;" onchange="window.handleJSONRestore(this)">
        
        <button class="btn btn-secondary" onclick="document.getElementById('inp-json-restore').click()"><i class="fas fa-upload" style="color:var(--primary); font-size:16px;"></i> 데이터 복원</button>
        <button class="btn btn-secondary" id="btn-json-backup"><i class="fas fa-download" style="color:var(--primary); font-size:16px;"></i> 전체 백업</button>
        
        <button class="btn btn-secondary" id="btn-export"><i class="fas fa-file-excel" style="color:var(--success); font-size:16px;"></i> 엑셀 내보내기</button>
    </div>
</header>

<div class="workspace">
    <aside class="pane-list">
        <div class="search-area">
            <input type="text" id="search-input" class="search-input" placeholder="검색(유형, 인물, 제목 등)..." spellcheck="false">
            <select id="filter-cat" class="search-input">
                <option value="">전체 기록 보기</option>
            </select>
        </div>
        <div class="list-scroll" id="item-list"></div>
        <div style="padding:16px; text-align:center; font-size:12px; color:var(--text-sub); border-top:1px solid var(--border); background:var(--bg-panel);">
            Total <span id="total-count" style="font-weight:700; color:var(--text-main);">0</span> Records
        </div>
    </aside>

    <main class="pane-editor">
        <div class="toolbar">
            <div id="editor-title" style="font-weight:700; font-size:18px; color:var(--text-main); letter-spacing:-0.3px;">새로운 기록 작성</div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-secondary" onclick="window.openModal('shortcut-modal')"><i class="fas fa-keyboard"></i> 단축키</button>
                <button class="btn btn-secondary" id="btn-new" title="Ctrl+Alt+N"><i class="fas fa-pen"></i> 새 기록</button>
                <button class="btn btn-danger" id="btn-delete" style="display:none;"><i class="fas fa-trash"></i> 삭제</button>
                <button class="btn btn-primary" id="btn-save" title="Ctrl+S"><i class="fas fa-check"></i> 저장하기</button>				
            </div>
        </div>

        <div class="editor-scroll">
            <div class="editor-paper">
                
                <div class="form-section accordion-section">
                    <div class="section-title accordion-toggle" onclick="window.toggleAccordion(this)">
                        <span><i class="fas fa-address-card"></i> 기본 정보</span>
                        <i class="fas fa-chevron-up chevron"></i>
                    </div>
                    <div class="accordion-content">
                        <div class="form-grid">
                            <div>
                                <label class="label">기록 유형</label>
                                <input list="cat-options" id="inp-cat" class="input-field" placeholder="유형 선택" spellcheck="false">
                                <datalist id="cat-options"></datalist>
                            </div>
                            <div>
                                <label class="label">관련 인물 (대상)</label>
                                <input type="text" id="inp-target" class="input-field" placeholder="예: 김철수, 3조, 나자신" spellcheck="false">
                            </div>
                            <div>
                                <label class="label">발생 일자</label>
                                <input type="date" id="inp-date" class="input-field" spellcheck="false">
                            </div>
                        </div>
                        <div style="margin-top: 20px;">
                            <label class="label">기록 제목</label><input type="text" id="inp-title" class="input-field" placeholder="예: 3주차 팀 프로젝트 피드백 및 나의 반성" spellcheck="false">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-title">
                        <span><i class="fas fa-camera-retro"></i> 사진 및 증빙 자료</span>
                        <span id="img-count" style="font-size:13px; background:var(--bg-app); padding:6px 12px; border-radius:20px; color:var(--text-sub); border:1px solid var(--border);">0 / 20</span>
                    </div>
                    <div class="attach-box">
                        <div id="img-grid" class="attach-grid"></div>
                        <input type="file" id="inp-file" style="display:none;" multiple onchange="handleFileUpload(this)"> 
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-title"><span><i class="fas fa-pen-nib"></i> 회고 및 다짐</span></div>
                    <div style="margin-bottom:28px;">
                        <label class="label" style="color:var(--primary);">상세 내용 (Fact & Story)</label>
                        <div class="editor-wrapper" id="inp-content-container">
                            <div id="inp-content" spellcheck="false"></div>
                        </div>
                    </div>
                    <div>
                        <label class="label" style="color:var(--warning);">깨달음 및 다짐 (Lessons & Resolutions)</label>
                        <div class="editor-wrapper" id="inp-note-container">
                             <div id="inp-lessons" spellcheck="false"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div id="empty-state" class="empty-state">
            <div style="width:88px; height:88px; background:var(--primary-soft); border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:24px; box-shadow:var(--shadow-md);">
                <i class="fas fa-bookmark" style="font-size:36px; color:var(--primary);"></i>
            </div>
            <h2 style="color:var(--text-main); font-size:20px; font-weight:700; margin-bottom:12px;">선택된 기록이 없습니다</h2>
            <p style="color:var(--text-sub); margin-bottom:32px; font-size:15px;">동기들의 성장과 스스로의 다짐을 새롭게 기록해보세요.</p>
            <button class="btn btn-primary" id="btn-new-center" style="height:46px; padding:0 28px; font-size:15px;"><i class="fas fa-pen"></i> 첫 기록 작성하기</button>
        </div>
    </main>
</div>

<!-- Settings Modal -->
<div id="settings-modal" class="modal-overlay" onclick="window.closeModal('settings-modal')">
    <div class="settings-box" onclick="event.stopPropagation()">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px;">
            <h3 style="margin:0; font-size:20px; font-weight:700; color:var(--text-main);"><i class="fas fa-cog" style="color:var(--primary); margin-right:8px;"></i>환경 설정</h3>
            <button class="btn-icon" onclick="window.closeModal('settings-modal')" style="background:none; border:none; font-size:22px; cursor:pointer;"><i class="fas fa-times"></i></button>
        </div>
        <div>
            <label class="label"><span>카테고리 설정 (형식: 카테고리명)</span></label>
            <textarea id="setting-rfp-map" class="config-textarea" spellcheck="false"></textarea>
            <div style="text-align:right; margin-top:12px;">

<script>
const $ = s => document.querySelector(s);

window.toggleAccordion = function(el) {
    const section = el.closest('.accordion-section');
    section.classList.toggle('collapsed');
};

window.openModal = function(id) {
    const el = document.getElementById(id);
    el.style.display = 'flex';
    setTimeout(() => el.classList.add('show'), 10);
};

window.closeModal = function(id, clearImg = false) {
    const el = document.getElementById(id);
    el.classList.remove('show');
    setTimeout(() => { 
        el.style.display = 'none'; 
        if(clearImg) document.getElementById('modal-img-tag').removeAttribute('src');
    }, 200);
};

let toastTimeout;
function toast(m) { 
    const t = document.getElementById('toast'); 
    if(!t) return;
    t.textContent = m; 
    t.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => t.classList.remove('show'), 2500); 
}

async function executeSafeDownload(dataURI, fileName) {
    try {
        if (!dataURI || !dataURI.includes(',')) return alert("파일 데이터가 손상되었습니다.");
        let blob;
        try {
            const res = await fetch(dataURI);
            blob = await res.blob();
        } catch (fetchErr) {
            const arr = dataURI.split(',');
            const mime = arr[0].match(/:(.*?);/)[1] || 'application/octet-stream';
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while(n--) { u8arr[n] = bstr.charCodeAt(n); }
            blob = new Blob([u8arr], {type: mime});
        }
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = fileName || 'download_file';
        document.body.appendChild(a); 
        a.click(); 
        setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 500);
    } catch (err) { alert("다운로드 오류:\n" + err.message); }
}

window.globalDownloadFile = function(idx) {
    const f = currentFiles[idx];
    if (!f || !f.data) return alert("파일 정보를 찾을 수 없습니다.");
    executeSafeDownload(f.data, f.name);
};

window.globalDeleteFile = function(idx) {
    if(confirm('이 사진/자료를 삭제하시겠습니까?')) {
        currentFiles.splice(idx, 1);
        renderAttachGrid();
    }
};

window.globalOpenImage = function(idx) {
    const f = currentFiles[idx];
    if(f && f.data) {
        document.getElementById('modal-img-tag').src = f.data;
        window.openModal('img-modal');
    }
};

window.copyModalImg = async function(e) {
    e.stopPropagation();
    const src = document.getElementById('modal-img-tag').getAttribute('src');
    if(!src) return toast('복사할 이미지가 없습니다.');
    try {
        const res = await fetch(src);
        const blob = await res.blob();
        await navigator.clipboard.write([new ClipboardItem({[blob.type]: blob})]);
        toast('이미지가 클립보드에 복사되었습니다.');
    } catch(err) {
        toast('브라우저 권한 설정으로 복사에 실패했습니다.');
    }
};

window.downloadModalImg = function(e) {
    e.stopPropagation();
    const src = document.getElementById('modal-img-tag').getAttribute('src');
    if(!src) return toast('저장할 이미지가 없습니다.');
    executeSafeDownload(src, 'Growth_Photo_' + Date.now() + '.png');
};

window.handleJSONRestore = async function(input) {
    if(!input.files[0]) return;
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = async (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (!Array.isArray(data)) throw new Error("배열 형태의 JSON 데이터가 아닙니다.");
            let count = 0;
            for (const item of data) {
                if (item.uid) { await DOC_CORE.save(item); count++; }
            }
            input.value = ''; 
            await refreshList();
            toast(`${count}개의 기록이 복원되었습니다.`);
            $('#empty-state').classList.remove('hidden');
        } catch (err) { alert('파일 형식이 올바르지 않습니다.\n' + err.message); }
    };
    reader.readAsText(file);
};

const DEFAULT_STAGE_MAP = [
    { name: "1. 동기들의 성장" },
    { name: "2. 나의 반성 (절치부심)" },
    { name: "3. 미래를 위한 다짐" }
];
let currentStageMap = [];
let currentFiles = [];
let quillContent, quillLessons;

const BlockEmbed = Quill.import('blots/block/embed');
class RawTableBlot extends BlockEmbed {
    static create(value) { const node = super.create(); node.innerHTML = value; node.setAttribute('contenteditable', 'false'); return node; }
    static value(node) { return node.innerHTML; }
}
RawTableBlot.blotName = 'rawTable'; RawTableBlot.tagName = 'div'; RawTableBlot.className = 'quill-raw-table';
Quill.register(RawTableBlot, true);

function initEditors() {
    const SizeStyle = Quill.import('attributors/style/size'); SizeStyle.whitelist = null; Quill.register(SizeStyle, true);
    const quillOptions = { theme: 'snow', scrollingContainer: '.editor-scroll', modules: { toolbar: false, imageResize: { displaySize: true } } };
    quillContent = new Quill('#inp-content', quillOptions); 
    quillLessons = new Quill('#inp-lessons', quillOptions);
    quillContent.root.setAttribute('spellcheck', false);
    quillLessons.root.setAttribute('spellcheck', false);
}

const DOC_CORE = {
    db: null, DB_NAME: 'GrowthRecordDB', STORE_NAME: 'records',
    state: { items: [], search: '', filterCat: '', selectedId: null },
    openDB: function() {
        return new Promise((resolve) => {
            const req = indexedDB.open(this.DB_NAME, 1); 
            req.onupgradeneeded = (e) => e.target.result.createObjectStore(this.STORE_NAME, { keyPath: 'uid' });
            req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
        });
    },
    getAll: function() {
        return new Promise((resolve) => {
            const tx = this.db.transaction(this.STORE_NAME, 'readonly');
            tx.objectStore(this.STORE_NAME).getAll().onsuccess = (e) => {
                this.state.items = e.target.result || [];
                resolve(this.state.items);
            };
        });
    },
    save: function(item) {
        return new Promise((resolve) => {
            const tx = this.db.transaction(this.STORE_NAME, 'readwrite');
            tx.objectStore(this.STORE_NAME).put(item).onsuccess = () => resolve(item);
        });
    },
    remove: function(uid) {
        return new Promise((resolve) => {
            const tx = this.db.transaction(this.STORE_NAME, 'readwrite');
            tx.objectStore(this.STORE_NAME).delete(uid).onsuccess = () => resolve();
        });
    },
    exportExcel: async function() {
        if(!window.ExcelJS) return alert('ExcelJS 로드 실패');
        try {
            const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet('성장기록');
            ws.columns = [
                { header: '분류', key: 'cat', width: 20 },
                { header: '대상/인물', key: 'target', width: 15 }, { header: '일자', key: 'date', width: 15 }, 
                { header: '제목', key: 'title', width: 40 }, { header: '내용', key: 'content', width: 50 }, { header: '깨달음', key: 'lessons', width: 50 }
            ];
            this.state.items.forEach(i => {
                ws.addRow({ cat: i.category, target: i.target_person, date: i.record_date, title: i.title, content: (i.content || '').replace(/<[^>]*>/g, ''), lessons: (i.lessons || '').replace(/<[^>]*>/g, '') });
            });
            const buf = await wb.xlsx.writeBuffer();
            const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'Growth_Records.xlsx';
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        } catch (e) { alert('엑셀 변환 오류: ' + e.message); }
    },
    exportJSON: async function() {
        const items = this.state.items;
        if (!items || items.length === 0) return toast('백업할 데이터가 없습니다.');
        const jsonString = JSON.stringify(items, null, 2);
        const blob = new Blob([jsonString], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        a.download = `Growth_Archive_Backup_${dateStr}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        toast('전체 JSON 백업이 완료되었습니다.');
    }
};

(async () => {
    initEditors(); await DOC_CORE.openDB(); loadConfig(); bindEvents(); await refreshList(); 
})();

function loadConfig() {
    const stored = localStorage.getItem('GROWTH_DOC_MAP');
    currentStageMap = stored ? JSON.parse(stored) : [...DEFAULT_STAGE_MAP];
    const list = $('#cat-options'); list.innerHTML = '';
    const filterSelect = $('#filter-cat'); filterSelect.innerHTML = '<option value="">전체 기록 보기</option>';
    currentStageMap.forEach(i => { 
        list.insertAdjacentHTML('beforeend', `<option value="${i.name}">`);
        filterSelect.insertAdjacentHTML('beforeend', `<option value="${i.name}">${i.name}</option>`);
    });
}

function bindEvents() {
    $('#btn-new').onclick = $('#btn-new-center').onclick = showNewForm;
    $('#btn-save').onclick = saveCurrent; $('#btn-delete').onclick = deleteCurrent;
    $('#btn-export').onclick = () => DOC_CORE.exportExcel();
    $('#btn-json-backup').onclick = () => DOC_CORE.exportJSON();
    
    $('#search-input').onkeyup = (e) => { DOC_CORE.state.search = e.target.value.toLowerCase(); renderList(); };
    $('#filter-cat').onchange = (e) => { DOC_CORE.state.filterCat = e.target.value; renderList(); };

    $('#btn-settings').onclick = () => {
        $('#setting-rfp-map').value = currentStageMap.map(i => i.name).join('\n');
        window.openModal('settings-modal');
    };
    $('#btn-reset-settings').onclick = () => { $('#setting-rfp-map').value = DEFAULT_STAGE_MAP.map(i => i.name).join('\n'); };
    $('#btn-save-settings').onclick = () => {
        const newMap = [];
        $('#setting-rfp-map').value.split('\n').forEach(l => {
            if(l.trim() !== '') { newMap.push({name: l.trim()}); }
        });
        if(newMap.length) { currentStageMap = newMap; localStorage.setItem('GROWTH_DOC_MAP', JSON.stringify(newMap)); loadConfig(); }
        window.closeModal('settings-modal'); toast('설정이 저장되었습니다.');
    };

    document.addEventListener('paste', e => {
        if(!$('#empty-state').classList.contains('hidden')) return;
        const items = (e.clipboardData || window.clipboardData).items;
        for(let i of items) {
            if(i.type.indexOf('image') !== -1) {
                const active = document.activeElement;
                if(active && active.closest('.ql-container')) return; 
                e.preventDefault();
                const r = new FileReader();
                r.onload = ev => { 
                    currentFiles.push({ name: `Photo_${Date.now()}.png`, type: 'image/png', data: ev.target.result }); 
                    renderAttachGrid(); 
                    toast('클립보드 이미지가 첨부되었습니다.'); 
                };
                r.readAsDataURL(i.getAsFile());
                return; 
            }
        }
    });

    document.addEventListener('click', e => {
        if (e.target.tagName === 'IMG' && e.target.closest('.ql-editor')) {
            $('#modal-img-tag').src = e.target.src;
            window.openModal('img-modal');
        }
    });

    document.addEventListener('keydown', e => {
        const isCmd = (navigator.platform.includes('Mac')) ? e.metaKey : e.ctrlKey;
        if (isCmd && !e.altKey && !e.shiftKey && (e.key === 's' || e.key === 'S')) {
            e.preventDefault();
            if ($('#empty-state').classList.contains('hidden')) saveCurrent();
            return;
        }
        if (isCmd && e.altKey && (e.key === 'n' || e.key === 'N')) {
            e.preventDefault();
            showNewForm();
            return;
        }
        let activeQuill = null;
        if (quillContent && quillContent.hasFocus()) activeQuill = quillContent;
        else if (quillLessons && quillLessons.hasFocus()) activeQuill = quillLessons;

        if (isCmd && activeQuill) {
            const range = activeQuill.getSelection();
            if (!range) return;
            if (e.key === '+' || e.key === '=' || e.key === '-') {
                e.preventDefault();
                const fmt = activeQuill.getFormat(range);
                const curSize = fmt.size ? parseInt(fmt.size) : 14;
                const nextSize = (e.key === '-') ? Math.max(10, curSize - 1) : curSize + 1;
                activeQuill.format('size', nextSize + 'px'); return;
            }
            if (!e.altKey && !e.shiftKey && ['1','2','3','4','5','6','7'].includes(e.key)) {
                e.preventDefault();
                const hls = { '1':'#ffedd5', '2':'#e0f2fe', '3':'#fef08a', '4':'#dcfce7', '5':'#fce7f3', '6':'#e6d5c3', '7':'#f3f4f6' };
                const f = activeQuill.getFormat(range); activeQuill.format('background', (f['background'] === hls[e.key]) ? false : hls[e.key]); return;
            }
            if (e.altKey && !e.shiftKey) {
                const key = e.key.toLowerCase();
                const f = activeQuill.getFormat(range);
                if (key === 'r') { e.preventDefault(); activeQuill.format('color', f['color'] === '#ef4444' ? false : '#ef4444'); return; }
                if (key === 'b') { e.preventDefault(); activeQuill.format('color', f['color'] === '#4f46e5' ? false : '#4f46e5'); return; }
                if (key === 'g') { e.preventDefault(); activeQuill.format('color', f['color'] === '#10b981' ? false : '#10b981'); return; }
                if (key === 'm') { e.preventDefault(); activeQuill.format('background', '#312e81'); activeQuill.format('color', '#ffffff'); activeQuill.format('bold', true); return; }
            }
        }
    });
}

function handleFileUpload(input) {
    if(!input.files || input.files.length === 0) return;
    Array.from(input.files).forEach(f => {
        const r = new FileReader();
        r.onload = e => { currentFiles.push({ name: f.name, type: f.type || 'application/octet-stream', data: e.target.result }); renderAttachGrid(); };
        r.readAsDataURL(f);
    });
    input.value = '';
}

async function refreshList() { await DOC_CORE.getAll(); renderList(); }

function renderList() {
    const el = $('#item-list'); el.innerHTML = '';
    const { search, filterCat, items, selectedId } = DOC_CORE.state;
    
    items.filter(i => {
        if(filterCat && i.category !== filterCat) return false;
        if(search) { return (i.target_person+i.title+i.category).toLowerCase().includes(search); }
        return true;
    })
    .sort((a, b) => {
        const dateA = a.record_date || '';
        const dateB = b.record_date || '';
        if (dateA !== dateB) return dateB.localeCompare(dateA);
        return (b.uid || '').localeCompare(a.uid || '');
    })
    .forEach(item => {
        const div = document.createElement('div');
        div.className = `item-card ${selectedId === item.uid ? 'active' : ''}`;
        div.onclick = () => loadItem(item);
        div.innerHTML = `<span class="item-prj">${item.record_date || '일자 없음'}</span>
                         <div class="item-meta">
                             <span class="item-person"><i class="fas fa-user"></i> ${item.target_person || '본인'}</span>
                             <span class="item-type">${(item.category || '').replace(/^\d+\.\s/, '')}</span>
                         </div>
                         <div class="item-preview">${item.title}</div>`;
        el.appendChild(div);
    });
    
    $('#total-count').textContent = el.children.length;
}

function renderAttachGrid() {
    const grid = $('#img-grid'); 
    grid.innerHTML = '';
    
    currentFiles.forEach((f, idx) => {
        const isImage = f.type.startsWith('image/');
        const box = document.createElement('div'); 
        box.className = 'file-card';
        let contentHtml = isImage ? `<img src="${f.data}" alt="${f.name}">` : `<i class="fas fa-file-alt"></i>`;
        box.innerHTML = `
            <div class="file-preview" ${isImage ? `onclick="window.globalOpenImage(${idx})"` : ''} style="${!isImage ? 'cursor:default;' : ''}">
                ${contentHtml}
            </div>
            <div class="file-overlay">
                <div class="file-name-overlay" title="${f.name}">${f.name}</div>
                <div class="file-actions-overlay">
                    <button type="button" class="file-btn-overlay" title="다운로드" onclick="window.globalDownloadFile(${idx});"><i class="fas fa-download"></i></button>
                    <button type="button" class="file-btn-overlay btn-danger" title="삭제" onclick="window.globalDeleteFile(${idx});"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        `;
        grid.appendChild(box);
    });
    
    if(currentFiles.length < 20) {
        grid.innerHTML += `<div class="upload-placeholder" onclick="document.getElementById('inp-file').click()">
                            <i class="fas fa-camera" style="font-size:32px; margin-bottom:8px;"></i>
                            클릭하여 사진 추가
                            <div style="font-size:12px; font-weight:400; margin-top:6px; color:var(--text-muted);">(또는 화면에서 Ctrl+V)</div>
                          </div>`;
    }
    $('#img-count').innerText = `${currentFiles.length} / 20`;
}

function showNewForm() {
    DOC_CORE.state.selectedId = null; renderList();
    $('#empty-state').classList.add('hidden'); $('#btn-delete').style.display = 'none';
    $('#editor-title').textContent = '새로운 기록 작성';
    
    const today = new Date().toISOString().split('T')[0];
    $('#inp-date').value = today;
    $('#inp-cat').value = $('#inp-target').value = $('#inp-title').value = '';
    
    quillContent.setText(''); quillLessons.setText('');
    quillContent.blur(); quillLessons.blur();

    currentFiles = []; renderAttachGrid(); 
    document.querySelectorAll('.accordion-section').forEach(el => el.classList.remove('collapsed'));
    setTimeout(() => { $('.editor-scroll').scrollTop = 0; }, 10);
}

function loadItem(i) {
    DOC_CORE.state.selectedId = i.uid; renderList();
    $('#empty-state').classList.add('hidden'); $('#btn-delete').style.display = 'inline-flex';
    $('#editor-title').textContent = i.title || '기록 확인/수정';

    $('#inp-cat').value = i.category || ''; 
    $('#inp-target').value = i.target_person || '';
    $('#inp-date').value = i.record_date || '';
    $('#inp-title').value = i.title || '';
    
    quillContent.clipboard.dangerouslyPasteHTML(i.content || ''); 
    quillLessons.clipboard.dangerouslyPasteHTML(i.lessons || '');
    quillContent.blur(); quillLessons.blur();

    currentFiles = i.attachments || []; renderAttachGrid();
    
    document.querySelectorAll('.accordion-section').forEach(el => el.classList.add('collapsed'));
    setTimeout(() => { $('.editor-scroll').scrollTop = 0; }, 10);
}

async function saveCurrent() {
    if(!$('#inp-title').value) return toast('기록 제목을 입력해주세요.');
    
    const item = {
        uid: DOC_CORE.state.selectedId || Date.now().toString(36),
        category: $('#inp-cat').value, 
        target_person: $('#inp-target').value,
        record_date: $('#inp-date').value, 
        title: $('#inp-title').value, 
        content: quillContent.root.innerHTML, 
        lessons: quillLessons.root.innerHTML, 
        attachments: currentFiles
    };
    
    await DOC_CORE.save(item); 
    DOC_CORE.state.selectedId = item.uid;
    $('#editor-title').textContent = item.title;

    await refreshList();
    toast('성공적으로 저장되었습니다.');
}

async function deleteCurrent() {
