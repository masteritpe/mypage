<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Analysis Note</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css" rel="stylesheet">

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="https://unpkg.com/quill-image-resize@3.0.9/image-resize.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<!-- 마크다운 자동 파싱을 위한 라이브러리 추가 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
/* === Executive Theme === */
:root {
    --bg-body: #f1f5f9; --bg-sidebar: #ffffff;
    --primary: #1e293b; --primary-hover: #0f172a;
    --accent: #3b82f6; --accent-light: #dbeafe;
    --text-main: #0f172a; --text-sub: #64748b; --text-muted: #94a3b8;
    --border: #e2e8f0; --radius-md: 10px;
    --shadow-float: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    --font-ui: 'SUIT', 'Inter', sans-serif;
    --font-code: 'JetBrains Mono', monospace;
    --editor-font-size: 16px;
}

* { box-sizing: border-box; outline: none; }
body { margin: 0; background: var(--bg-body); color: var(--text-main); font-family: var(--font-ui); font-size: 14px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* Header */
header { height: 64px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 28px; flex-shrink: 0; justify-content: space-between; z-index: 50; }
header .brand { font-weight: 800; font-size: 20px; color: var(--primary); display: flex; align-items: center; gap: 12px; }
header .brand i { font-size: 22px; color: var(--accent); }

/* Layout Structure */
.workspace { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 64px); position: relative; }

/* Sidebar */
.pane-list { width: 340px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; z-index: 20; }
.search-area { padding: 20px; display: flex; flex-direction: column; gap: 12px; background: var(--bg-sidebar); flex-shrink: 0; }
.search-wrapper { position: relative; }
.search-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
.search-input { width: 100%; height: 42px; padding: 0 16px 0 40px; border: 1px solid var(--border); border-radius: var(--radius-md); background: #f8fafc; font-family: var(--font-ui); }
.list-scroll { flex: 1; overflow-y: auto; padding: 0 12px 20px 12px; }

/* Editor Pane */
.pane-editor { flex: 1; background: var(--bg-body); display: flex; flex-direction: column; position: relative; min-width: 0; overflow: hidden; }
.toolbar { height: 60px; display: flex; align-items: center; padding: 0 40px; justify-content: space-between; flex-shrink: 0; z-index: 30; background: var(--bg-body); border-bottom: 1px solid transparent; }
.editor-wrapper { flex: 1; overflow-y: auto; padding: 20px 40px 100px 40px; scroll-behavior: smooth; }
.paper-sheet { width: 100%; max-width: 900px; background: #fff; border-radius: 16px; box-shadow: var(--shadow-float); padding: 50px 60px; margin: 0 auto; display: flex; flex-direction: column; }

/* List Items */
.item-card { position: relative; padding: 16px; margin-bottom: 8px; border-radius: var(--radius-md); cursor: pointer; border: 1px solid transparent; background: #fff; transition: 0.2s; }
.item-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
.item-card.active { border-color: var(--accent-light); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
.item-card.active::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px; background: var(--accent); border-radius: 0 4px 4px 0; }
.item-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; padding-right: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-source { font-size: 12px; color: var(--accent); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-list-del { position: absolute; right: 12px; top: 14px; background: transparent; border: none; color: #cbd5e1; cursor: pointer; opacity: 0; transition: 0.2s; padding: 4px; border-radius: 4px; }
.item-card:hover .btn-list-del { opacity: 1; }
.btn-list-del:hover { color: #ef4444; background: #fee2e2; }

/* Forms & Editors */
.form-group { margin-bottom: 24px; }
.section-label { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; background: #f8fafc; padding: 8px 12px; border-radius: 6px; border-left: 4px solid var(--accent); }
.input-modern { width: 100%; padding: 0 14px; border: 1px solid var(--border); border-radius: 6px; font-family: var(--font-ui); font-size: 15px; background: #fff; }
.input-modern:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.input-title-lg { font-size: 24px; font-weight: 700; height: 50px; border: none; border-bottom: 2px solid var(--border); padding: 0 4px; border-radius: 0; background: transparent; margin-bottom: 10px; }
.input-title-lg:focus { border-bottom-color: var(--accent); box-shadow: none; }
.input-source { font-size: 15px; font-weight: 500; height: 40px; border: none; padding: 0 4px; border-radius: 0; background: transparent; width: 100%; font-family: var(--font-ui); color: var(--text-sub); }
.input-source:focus { box-shadow: none; outline: none; }

/* 첨부파일 래퍼 */
.source-wrapper { display: flex; align-items: center; border-bottom: 2px solid var(--border); margin-bottom: 30px; transition: 0.2s; }
.source-wrapper:focus-within { border-bottom-color: var(--accent); }
.attach-actions { display: flex; gap: 6px; padding: 4px; }

/* Quill Overrides */
.ql-container.ql-snow { border: 1px solid var(--border) !important; border-radius: 8px !important; font-family: var(--font-ui) !important; background: #fff; transition: 0.2s; }
.ql-container.ql-snow:focus-within { border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-light); }
.ql-editor { font-size: var(--editor-font-size) !important; line-height: 1.7; color: #1e293b; min-height: 120px; padding: 16px !important; }
.ql-editor p { margin-bottom: 6px; }
.ql-editor ul, .ql-editor ol { padding-left: 20px; margin: 4px 0; }
.ql-editor strong { color: #0f172a; font-weight: 700; }

/* Buttons */
.btn { height: 36px; padding: 0 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; font-family: var(--font-ui); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover { background: #2563eb; }
.btn-secondary { background: #fff; border-color: var(--border); color: var(--text-main); }
.btn-secondary:hover { background: #f8fafc; }
.btn-danger { color: #ef4444; background: #fff; border-color: #fee2e2; }

/* 프롬프트 버튼 스타일 */
.btn-purple-light { background: #eef2ff; color: #4f46e5; border: 1px solid #eef2ff; }
.btn-purple-light:hover { background: #e0e7ff; }
.btn-outline { background: #fff; border: 1px solid #cbd5e1; color: #475569; }
.btn-outline:hover { background: #f8fafc; }
.btn-purple { background: #4f46e5; color: #fff; }
.btn-purple:hover { background: #4338ca; }

/* Modals */
.modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(2px); z-index: 1000; display: none; align-items: center; justify-content: center; }
.modal-box { background: #fff; width: 640px; max-width: 90vw; padding: 32px; border-radius: 16px; box-shadow: var(--shadow-float); }

/* Empty State */
.empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-body); z-index: 100; }

#toast { position: fixed; bottom: -50px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 8px; opacity: 0; transition: 0.3s; z-index: 2000; pointer-events: none; }
.hidden { display: none !important; }
</style>
</head>
<body>

<header>
    <div class="brand"><i class="fas fa-microscope"></i> Analysis Note</div>
    <div style="display:flex; gap:10px;">
        <button class="btn btn-secondary" id="btn-backup-json"><i class="fas fa-file-download" style="color:#3b82f6"></i> JSON 백업</button>
        <button class="btn btn-secondary" id="btn-restore-json"><i class="fas fa-file-upload" style="color:#8b5cf6"></i> JSON 복원</button>
        <button class="btn btn-secondary" id="btn-export"><i class="fas fa-file-excel" style="color:#10b981"></i> Excel 추출</button>
        <input type="file" id="inp-file-json" accept=".json" style="display: none;">
    </div>
</header>

<div class="workspace">
    <aside class="pane-list">
        <div class="search-area">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" class="search-input" placeholder="분석 자료 및 출처 검색..." spellcheck="false">
            </div>
        </div>
        <div class="list-scroll" id="item-list"></div>
    </aside>

    <main class="pane-editor" id="mainContent">
        <div class="toolbar">
            <div id="editor-status" style="font-size:13px; color:var(--text-sub);"></div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-secondary" id="btn-new"><i class="fas fa-plus"></i> 신규 분석</button>
                <button class="btn btn-accent" id="btn-import"><i class="fas fa-paste"></i> 데이터 가져오기</button>
                <button class="btn btn-danger hidden" id="btn-delete"><i class="fas fa-trash"></i> 삭제</button>
                <button class="btn btn-primary" id="btn-save"><i class="fas fa-save"></i> 저장</button>
            </div>
        </div>

        <div class="editor-wrapper">
            <div class="paper-sheet">
                <input type="hidden" id="inp-uid">
                <input type="text" id="inp-title" class="input-modern input-title-lg" placeholder="분석 대상 문서 / 아티클 제목 입력" spellcheck="false">
                
                <!-- 출처 및 첨부파일 영역 -->
                <div class="source-wrapper">
                    <input type="text" id="inp-source" class="input-source" placeholder="문서 출처 입력 (예: 주간기술동향 2221호)" spellcheck="false">
                    <div class="attach-actions">
                        <input type="file" id="inp-attach" style="display: none;">
                        <button class="btn btn-secondary" id="btn-attach" title="파일 첨부" style="padding:0 10px; height:32px;"><i class="fas fa-paperclip"></i></button>
                        <button class="btn btn-accent hidden" id="btn-download" title="다운로드" style="padding:0 10px; height:32px;"><i class="fas fa-download"></i></button>
                        <button class="btn btn-danger hidden" id="btn-del-attach" title="첨부 삭제" style="padding:0 10px; height:32px;"><i class="fas fa-times"></i></button>
                    </div>
                </div>

                <!-- 1. 요약 -->
                <div class="form-group">
                    <div class="section-label"><i class="fas fa-align-left"></i> 1. 요약 (Summary)</div>
                    <div id="editor-summary"></div>
                </div>

                <!-- 2. 인사이트 -->
                <div class="form-group">
                    <div class="section-label"><i class="fas fa-lightbulb"></i> 2. 인사이트 (Insight)</div>
                    <div id="editor-insight"></div>
                </div>

                <!-- 3. 키워드 -->
                <div class="form-group">
                    <div class="section-label"><i class="fas fa-tags"></i> 3. 관련 키워드 (Keywords)</div>
                    <div id="editor-keywords"></div>
                </div>

                <!-- 4. 출제예상문제 -->
                <div class="form-group">
                    <div class="section-label"><i class="fas fa-question-circle"></i> 4. 출제 예상문제 (Expected Questions)</div>
                    <div id="editor-questions"></div>
                </div>
            </div>
        </div>
        
        <div id="empty-state" class="empty-state">
            <div style="text-align:center;">
                <i class="fas fa-file-signature" style="font-size:56px; color:#cbd5e1; margin-bottom:24px;"></i>
                <h2 style="font-size:24px; color:var(--primary); margin-bottom:10px;">분석할 문서를 선택하거나 새로 작성하세요</h2>
                <div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
                    <button class="btn btn-secondary" id="btn-new-center" style="height:40px;"><i class="fas fa-plus"></i> 새 분석노트 작성</button>
                    <button class="btn btn-accent" id="btn-import-center" style="height:40px;"><i class="fas fa-paste"></i> LLM 데이터 가져오기</button>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 데이터 가져오기 모달창 -->
<div id="import-modal" class="modal-overlay">
    <div class="modal-box">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; align-items:center;">
            <h3 style="margin:0; font-size:18px; color:var(--primary); display:flex; align-items:center;">
                <i class="fas fa-robot" style="color:var(--accent); margin-right:8px;"></i> 데이터 가져오기
            </h3>
            
            <div style="display:flex; gap:8px; align-items:center;">
                <button class="btn btn-purple-light" id="btn-copy-prompt" style="height:32px; padding:0 12px; border-radius:6px;">
                    <i class="fas fa-copy"></i> 프롬프트 복사
                </button>
                <button class="btn btn-outline" id="btn-edit-prompt" style="height:32px; padding:0 12px; border-radius:6px;">
                    <i class="fas fa-edit"></i> 수정
                </button>
                <button class="btn-secondary" id="btn-close-modal" style="background:transparent; border:none; cursor:pointer; font-size:18px; color:var(--text-sub); margin-left:8px; padding:0 4px;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <p style="font-size:13px; color:var(--text-sub); margin-bottom:20px; line-height:1.5;">
            제미나이 등 LLM에서 생성된 텍스트를 붙여넣으세요.<br>
            <strong>"1. 요약, 2. 인사이트, 3. 관련 키워드, 4. 출제 예상문제"</strong> 양식을 기준으로 자동 분할됩니다.
        </p>
        <textarea id="inp-llm-data" class="input-modern" style="height: 350px; padding: 16px; resize: vertical; line-height:1.6;" placeholder="이곳에 복사한 내용을 붙여넣으세요..." spellcheck="false"></textarea>
        
        <div style="text-align:right; margin-top:20px; display:flex; justify-content:flex-end; gap:10px;">
            <button class="btn btn-secondary" id="btn-cancel-import">취소</button>
            <button class="btn btn-primary" id="btn-apply-import"><i class="fas fa-check"></i> 4개 영역에 입력하기</button>
        </div>
    </div>
</div>

<!-- 프롬프트 설정 모달창 -->
<div id="prompt-modal" class="modal-overlay">
    <div class="modal-box" style="width: 700px; max-width: 95vw;">
        <div style="display:flex; justify-content:space-between; margin-bottom:16px; align-items:center;">
            <h3 style="margin:0; font-size:18px; color:#4f46e5;">
                <i class="fas fa-edit" style="margin-right:8px;"></i> 프롬프트 설정
            </h3>
            <button class="btn-secondary" id="btn-close-prompt-modal" style="background:transparent; border:none; cursor:pointer; font-size:18px; color:var(--text-sub);">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <textarea id="inp-prompt-text" class="input-modern" style="height: 350px; padding: 16px; resize: vertical; line-height:1.6; font-family:var(--font-ui);" spellcheck="false"></textarea>
        
        <div style="text-align:right; margin-top:20px;">
            <button class="btn btn-purple" id="btn-save-prompt">저장</button>
        </div>
    </div>
</div>

<div id="toast"><i class="fas fa-check-circle"></i> <span id="toast-msg"></span></div>

<script>
// 기본 프롬프트 설정
const DEFAULT_PROMPT = `당신은 IT 및 기술 동향 분석 전문가입니다.
아래 제공되는 문서나 아티클 내용을 분석하여, 지정된 [출력 양식]에 맞춰 답변을 작성해 주세요.

---
### [출력 양식]
1. **요약 (Summary)**: 문서의 핵심 내용을 3~4문장으로 간결하게 요약합니다.
2. **인사이트 (Insight)**: 해당 기술/동향이 주는 시사점이나 비즈니스적 파급 효과를 2~3개의 불릿 포인트로 작성합니다.
3. **관련 키워드 (Keywords)**: 본문과 관련된 핵심 기술/트렌드 키워드를 콤마(,)로 구분하여 나열합니다.
4. **출제 예상문제 (Expected Questions)**: 위 내용을 바탕으로 기술사/감리사 시험 등에 출제될 수 있는 서술형 또는 단답형 문제 1~2개를 출제합니다.`;

// Quill Size 포맷 인라인 스타일로 오버라이드
const SizeStyle = Quill.import('attributors/style/size');
SizeStyle.whitelist = null;
Quill.register(SizeStyle, true);

// 폰트 크기 변경 함수
function changeFontSize(quill, range, step) {
    if (!range || range.length === 0) return;
    const format = quill.getFormat(range);
    let sizeStr = format.size || '16px';
    if(Array.isArray(sizeStr)) sizeStr = sizeStr[0];
    let val = parseInt(sizeStr);
    if(isNaN(val)) val = 16;
    val += step;
    quill.format('size', val + 'px');
}

// 에디터 단축키 바인딩 설정
const customBindings = {
    underlineCustom: { key: '4', altKey: true, handler: function(range, context) { this.quill.format('underline', !context.format.underline); } },
    strikeCustom: { key: '5', altKey: true, handler: function(range, context) { this.quill.format('strike', !context.format.strike); } },
    colorRed: { key: '1', altKey: true, handler: function() { this.quill.format('color', 'red'); } },
    colorBlue: { key: '2', altKey: true, handler: function() { this.quill.format('color', 'blue'); } },
    colorGreen: { key: '3', altKey: true, handler: function() { this.quill.format('color', 'green'); } },
    clearFormat: { key: 'X', ctrlKey: true, shiftKey: true, handler: function(range) { this.quill.removeFormat(range.index, range.length); } },
    
    // 마크(형광펜) 설정
    mark1: { key: '1', ctrlKey: true, handler: function() { this.quill.format('background', '#ffd8a8'); } }, 
    mark2: { key: '2', ctrlKey: true, handler: function() { this.quill.format('background', '#a5d8ff'); } }, 
    mark3: { key: '3', ctrlKey: true, handler: function() { this.quill.format('background', '#ffec99'); } }, 
    mark4: { key: '4', ctrlKey: true, handler: function() { this.quill.format('background', '#b2f2bb'); } }, 
    mark5: { key: '5', ctrlKey: true, handler: function() { this.quill.format('background', '#ffc9c9'); } }, 
    mark6: { key: '6', ctrlKey: true, handler: function() { this.quill.format('background', '#e6c2a5'); } }, 
    mark7: { key: '7', ctrlKey: true, handler: function() { this.quill.format('background', '#e9ecef'); } }, 
    
    // 글꼴 크기 증감
    sizeUp: { key: 187, ctrlKey: true, handler: function(range) { changeFontSize(this.quill, range, 1); } }, 
    sizeDown: { key: 189, ctrlKey: true, handler: function(range) { changeFontSize(this.quill, range, -1); } },
    sizeUpNum: { key: 107, ctrlKey: true, handler: function(range) { changeFontSize(this.quill, range, 1); } }, 
    sizeDownNum: { key: 109, ctrlKey: true, handler: function(range) { changeFontSize(this.quill, range, -1); } },
    
    // 두음 강조
    highlightN: { key: 'N', altKey: true, handler: function() { 
        this.quill.format('background', '#0d3a9e');
        this.quill.format('color', '#ffffff');
        this.quill.format('bold', true);
    }},
    highlightL: { key: 'L', altKey: true, handler: function() { 
        this.quill.format('background', '#296E01');
        this.quill.format('color', '#ffffff');
        this.quill.format('bold', true);
    }}
};

const editorConfig = { 
    theme: 'snow', 
    modules: { 
        toolbar: false,
        keyboard: { bindings: customBindings }
    } 
};

const quillSummary = new Quill('#editor-summary', editorConfig);
const quillInsight = new Quill('#editor-insight', editorConfig);
const quillKeywords = new Quill('#editor-keywords', editorConfig);
const quillQuestions = new Quill('#editor-questions', editorConfig);

[quillSummary, quillInsight, quillKeywords, quillQuestions].forEach(q => {
    q.root.setAttribute('spellcheck', false);
});

const DB = {
    name: 'AnalysisNoteDB', version: 1, store: 'notes', db: null,
    init: function() {
        return new Promise((resolve) => {
            const req = indexedDB.open(this.name, this.version);
            req.onupgradeneeded = e => { 
                if (!e.target.result.objectStoreNames.contains(this.store)) 
                    e.target.result.createObjectStore(this.store, { keyPath: 'uid' }); 
            };
            req.onsuccess = e => { this.db = e.target.result; resolve(); };
        });
    },
    getAll: function() { return new Promise(resolve => this.db.transaction(this.store, 'readonly').objectStore(this.store).getAll().onsuccess = e => resolve(e.target.result || [])); },
    put: function(item) { return new Promise(resolve => this.db.transaction(this.store, 'readwrite').objectStore(this.store).put(item).onsuccess = () => resolve(item)); },
    delete: function(uid) { return new Promise(resolve => this.db.transaction(this.store, 'readwrite').objectStore(this.store).delete(uid).onsuccess = () => resolve()); }
};

const App = {
    state: { items: [], search: '', selectedUid: null },
    currentAttachment: null,
    
    init: async function() {
        await DB.init();
        await this.checkAndSeedData(); 
        this.bindEvents();
        await this.refresh();
    },

    checkAndSeedData: async function() {
        const items = await DB.getAll();
        if(items.length === 0) {
            const seedData = {
                uid: Date.now().toString(),
                title: "로봇 물리적 제어와 AI 학습 정책 결합 기술 동향",
                source: "주간기술동향 2221호",
                summary: "<p>본 문서는 접촉이 잦은 로봇 작업을 성공적으로 수행하기 위해 기존의 고정된 제어 방식에서 벗어나 인공지능 학습 정책과 컴플라이언스(Compliance) 제어를 결합하는 최신 기술 동향을 분석하고 있습니다.</p>",
                insight: "<p><strong>시뮬레이션-현실 전이(Sim-to-Real) 아키텍처 고도화:</strong> 로봇 학습 환경에서 현실의 물리적 불확실성을 반영하기 위해 물체 중심의 추상화 및 관측 이력 기반의 오프라인-온라인 분리 학습 구조가 중요해지고 있습니다.</p>",
                keywords: "<p><strong>제어 이론:</strong> 컴플라이언스(Compliance) 제어, 임피던스(Impedance) 제어</p>",
                questions: "<p><strong>[단답형] 문제 1:</strong> 로봇 제어에서 외란이나 접촉에 유연하게 대응하기 위한 '컴플라이언스 제어'의 개념을 설명하시오.</p>",
                attachment: null
            };
            await DB.put(seedData);
        }
    },

    bindEvents: function() {
        const $= id => document.getElementById(id);
        $('btn-new').onclick = $('btn-new-center').onclick = () => this.formNew();
        $('btn-save').onclick = () => this.save();
        $('btn-delete').onclick = () => this.delete();
        $('btn-export').onclick = () => this.exportExcel();
        
        $('btn-backup-json').onclick = () => this.backupJSON();
        $('btn-restore-json').onclick = () => $('inp-file-json').click();
        $('inp-file-json').onchange = (e) => this.restoreJSON(e);
        
        // 데이터 가져오기 모달
        $('btn-import').onclick = $('btn-import-center').onclick = () => {
            $('import-modal').style.display = 'flex';
            setTimeout(() => $('inp-llm-data').focus(), 100);
        };
        $('btn-close-modal').onclick = $('btn-cancel-import').onclick = () => {
            $('import-modal').style.display = 'none';
        };
        $('btn-apply-import').onclick = () => this.processLlmData();

        // 프롬프트 모달 및 기능
        $('btn-copy-prompt').onclick = () => this.copyPrompt();
        $('btn-edit-prompt').onclick = () => this.openPromptModal();
        $('btn-close-prompt-modal').onclick = () => $('prompt-modal').style.display = 'none';
        $('btn-save-prompt').onclick = () => this.savePrompt();
        
        $('item-list').onclick = e => { const card = e.target.closest('.item-card'); if(card) this.load(card.dataset.uid); };
        $('search-input').onkeyup = e => { this.state.search = e.target.value.toLowerCase(); this.renderList(); };
        
        // 첨부파일 이벤트
        $('btn-attach').onclick = () => $('inp-attach').click();
        $('inp-attach').onchange = (e) => this.handleAttachFile(e);
        $('btn-download').onclick = () => this.downloadAttachment();
        $('btn-del-attach').onclick = () => {
            this.currentAttachment = null;
            $('inp-attach').value = '';
            this.renderAttachUI();
        };

        // 전역 단축키 이벤트
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 's')) {
                e.preventDefault();
                this.save();
            }
            if ((e.ctrlKey || e.metaKey) && e.altKey && e.key.toLowerCase() === 'n') {
                e.preventDefault();
                this.formNew();
            }
            if (e.key === '`') {
                const tag = e.target.tagName.toLowerCase();
                const isEditable = e.target.isContentEditable || tag === 'input' || tag === 'textarea';
                if (!isEditable) {
                    e.preventDefault();
                    window.location.href = 'about:blank';
                }
            }
        });
    },

    // 프롬프트 관련 함수
    copyPrompt: function() {
        const prompt = localStorage.getItem('analysis_prompt') || DEFAULT_PROMPT;
        navigator.clipboard.writeText(prompt).then(() => {
            this.toast('프롬프트가 클립보드에 복사되었습니다.');
        }).catch(err => {
            console.error('복사 실패:', err);
            this.toast('프롬프트 복사에 실패했습니다.');
        });
    },
    
    openPromptModal: function() {
        const prompt = localStorage.getItem('analysis_prompt') || DEFAULT_PROMPT;
        document.getElementById('inp-prompt-text').value = prompt;
        document.getElementById('prompt-modal').style.display = 'flex';
    },

    savePrompt: function() {
        const newPrompt = document.getElementById('inp-prompt-text').value.trim();
        if(!newPrompt) return this.toast('프롬프트를 입력해주세요.');
        
        localStorage.setItem('analysis_prompt', newPrompt);
        document.getElementById('prompt-modal').style.display = 'none';
        this.toast('프롬프트가 정상적으로 저장되었습니다.');
    },

    handleAttachFile: function(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            this.currentAttachment = {
                name: file.name,
                type: file.type,
                data: ev.target.result 
            };
            this.renderAttachUI();
        };
        reader.readAsDataURL(file);
    },

    renderAttachUI: function() {
        const btnDownload = document.getElementById('btn-download');
        const btnDel = document.getElementById('btn-del-attach');
        
        if (this.currentAttachment) {
            btnDownload.classList.remove('hidden');
            btnDel.classList.remove('hidden');
            btnDownload.title = `다운로드: ${this.currentAttachment.name}`;
        } else {
            btnDownload.classList.add('hidden');
            btnDel.classList.add('hidden');
            btnDownload.title = '';
        }
    },

    downloadAttachment: function() {
        if (!this.currentAttachment) return;
        const a = document.createElement('a');
        a.href = this.currentAttachment.data;
        a.download = this.currentAttachment.name;
        a.click();
    },

    processLlmData: function() {
        const rawText = document.getElementById('inp-llm-data').value;
        if(!rawText.trim()) return this.toast('텍스트를 입력해주세요.');

        const markers = [
            { name: 'summary', regex: /(?:^|\n)#*\s*1\.?\s*요약/ },
            { name: 'insight', regex: /(?:^|\n)#*\s*2\.?\s*인사이트/ },
            { name: 'keywords', regex: /(?:^|\n)#*\s*3\.?\s*(?:관련\s*)?키워드/ },
            { name: 'questions', regex: /(?:^|\n)#*\s*4\.?\s*출제\s*(?:예상)?문제/ }
        ];

        markers.forEach(m => m.index = rawText.search(m.regex));
        const foundMarkers = markers.filter(m => m.index !== -1).sort((a, b) => a.index - b.index);
        const results = { summary: '', insight: '', keywords: '', questions: '' };

        for (let i = 0; i < foundMarkers.length; i++) {
            const match = rawText.match(foundMarkers[i].regex)[0];
            const start = foundMarkers[i].index + match.length;
            const end = (i + 1 < foundMarkers.length) ? foundMarkers[i+1].index : rawText.length;
            results[foundMarkers[i].name] = rawText.substring(start, end).trim();
        }

        if (!this.state.selectedUid) this.formNew();

        const parseToHTML = (text) => text ? marked.parse(text).replace(/\n/g, '') : '';
        if (results.summary) quillSummary.clipboard.dangerouslyPasteHTML(parseToHTML(results.summary));
        if (results.insight) quillInsight.clipboard.dangerouslyPasteHTML(parseToHTML(results.insight));
        if (results.keywords) quillKeywords.clipboard.dangerouslyPasteHTML(parseToHTML(results.keywords));
        if (results.questions) quillQuestions.clipboard.dangerouslyPasteHTML(parseToHTML(results.questions));

        document.getElementById('import-modal').style.display = 'none';
        document.getElementById('inp-llm-data').value = '';
        this.toast('데이터가 성공적으로 분류되어 입력되었습니다.');
    },

    refresh: async function() {
        this.state.items = await DB.getAll();
        this.state.items.sort((a, b) => b.uid - a.uid); 
        this.renderList();
    },

    getFilteredItems: function() {
        return this.state.items.filter(i => {
            if(this.state.search) {
                const term = this.state.search;
                return (i.title || '').toLowerCase().includes(term) || (i.source || '').toLowerCase().includes(term);
            }
            return true;
        });
    },

    renderList: function() {
        const el = document.getElementById('item-list'); 
        el.innerHTML = '';
        const filtered = this.getFilteredItems();

        filtered.forEach(i => {
            const card = document.createElement('div');
            card.className = `item-card ${i.uid === this.state.selectedUid ? 'active' : ''}`; 
            card.dataset.uid = i.uid;
            
            const dateStr = new Date(parseInt(i.uid)).toLocaleDateString();
            const sourceHTML = i.source ? `<div class="item-source"><i class="fas fa-book-open"></i> ${i.source}</div>` : '';
            const attachIcon = i.attachment ? `<i class="fas fa-paperclip" style="color:var(--text-muted); margin-left:6px;"></i>` : '';
            
            card.innerHTML = `
                <button class="btn-list-del" title="삭제"><i class="fas fa-trash-alt"></i></button>
                <div class="item-title">${i.title || '(제목 없음)'}${attachIcon}</div>
                ${sourceHTML}
                <div style="font-size:11px; color:var(--text-muted);"><i class="far fa-calendar-alt"></i> ${dateStr}</div>
            `;
            
            card.querySelector('.btn-list-del').onclick = async (e) => {
                e.stopPropagation();
                if(confirm(`해당 분석 자료를 삭제하시겠습니까?`)) {
                    await DB.delete(i.uid);
                    if (this.state.selectedUid === i.uid) this.formNew();
                    await this.refresh();
                }
            };

            el.appendChild(card);
        });
    },

    formNew: function() {
        this.state.selectedUid = null;
        this.renderList();
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('btn-delete').classList.add('hidden');
        document.getElementById('editor-status').innerHTML = '';
        
        document.getElementById('inp-uid').value = '';
        document.getElementById('inp-title').value = '';
        document.getElementById('inp-source').value = '';
        
        this.currentAttachment = null;
        document.getElementById('inp-attach').value = '';
        this.renderAttachUI();

        quillSummary.setContents([]);
        quillInsight.setContents([]);
        quillKeywords.setContents([]);
        quillQuestions.setContents([]);
        
        setTimeout(() => document.getElementById('inp-title').focus(), 50);
    },

    load: function(uid) {
        const item = this.state.items.find(i => i.uid === uid);
        if(!item) return;
        
        this.state.selectedUid = uid;
        this.renderList();
        
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('btn-delete').classList.remove('hidden');
        document.getElementById('editor-status').textContent = `마지막 수정: ${new Date(parseInt(item.uid)).toLocaleString()}`;
        
        document.getElementById('inp-uid').value = item.uid;
        document.getElementById('inp-title').value = item.title || '';
        document.getElementById('inp-source').value = item.source || '';
        
        this.currentAttachment = item.attachment || null;
        document.getElementById('inp-attach').value = '';
        this.renderAttachUI();
        
        const safeLoad = (quill, content) => {
            let html = content || '';
            if (html && !html.includes('<p>') && !html.includes('<br>')) html = html.replace(/\n/g, '<br>');
            quill.clipboard.dangerouslyPasteHTML(html);
        };

        safeLoad(quillSummary, item.summary);
        safeLoad(quillInsight, item.insight);
        safeLoad(quillKeywords, item.keywords);
        safeLoad(quillQuestions, item.questions);

        document.querySelector('.editor-wrapper').scrollTo({ top: 0 });
    },

    save: async function() {
        const title = document.getElementById('inp-title').value.trim();
        if(!title) return this.toast('문서 제목을 입력해주세요.');

        const item = {
            uid: document.getElementById('inp-uid').value || Date.now().toString(),
            title: title,
            source: document.getElementById('inp-source').value.trim(),
            summary: quillSummary.root.innerHTML,
            insight: quillInsight.root.innerHTML,
            keywords: quillKeywords.root.innerHTML,
            questions: quillQuestions.root.innerHTML,
            attachment: this.currentAttachment
        };
        
        await DB.put(item);
        this.state.selectedUid = item.uid;
        document.getElementById('inp-uid').value = item.uid;
        
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('btn-delete').classList.remove('hidden');
        
        await this.refresh();
        this.toast('저장되었습니다.');
    },

    delete: async function() {
        if(confirm('현재 분석 자료를 삭제하시겠습니까?')) {
            await DB.delete(this.state.selectedUid);
            this.formNew();
            document.getElementById('empty-state').style.display = 'flex';
            await this.refresh();
        }
    },

    backupJSON: function() {
        const itemsToExport = this.getFilteredItems();
        if (itemsToExport.length === 0) return this.toast('백업할 데이터가 없습니다.');

        const dataStr = JSON.stringify(itemsToExport, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = `Analysis_Backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    },

    restoreJSON: async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
            try {
                const data = JSON.parse(event.target.result);
                if (!Array.isArray(data)) throw new Error("유효한 JSON 배열 형식이 아닙니다.");

                let count = 0;
                for (const item of data) {
                    if (item && item.uid) {
                        await DB.put(item); 
                        count++;
                    }
                }
                this.toast(`${count}개의 데이터를 성공적으로 복원했습니다.`);
                await this.refresh();
            } catch (err) {
                console.error(err);
                this.toast('올바른 JSON 파일 형식이 아닙니다.');
            }
            e.target.value = ''; 
        };
        reader.readAsText(file);
    },

    exportExcel: async function() {
        const itemsToExport = this.getFilteredItems();
        if (itemsToExport.length === 0) return this.toast('추출할 데이터가 없습니다.');

        const wb = new ExcelJS.Workbook(); 
        const ws = wb.addWorksheet('Data Analysis');
        
        ws.columns = [
            { header: '제목', key: 'title', width: 40 },
            { header: '출처', key: 'source', width: 30 },
            { header: '1. 요약', key: 'sum', width: 50 },
            { header: '2. 인사이트', key: 'ins', width: 50 },
            { header: '3. 키워드', key: 'key', width: 30 },
            { header: '4. 예상문제', key: 'que', width: 50 }
        ];

        const stripHTML = (html) => (html || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n').replace(/<[^>]*>/g, '').trim();

        itemsToExport.forEach(x => {
            ws.addRow({
                title: x.title, 
                source: x.source || '',
                sum: stripHTML(x.summary), 
                ins: stripHTML(x.insight), 
                key: stripHTML(x.keywords),
                que: stripHTML(x.questions)
            });
        });

        ws.eachRow((row) => {
            row.eachCell((cell) => { cell.alignment = { vertical: 'top', wrapText: true }; });
        });

        const buf = await wb.xlsx.writeBuffer();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([buf]));
        a.download = `Analysis_Note_${new Date().toISOString().slice(0,10)}.xlsx`;
        a.click();
    },

    toast: function(m) {
        const t = document.getElementById('toast'); 
        document.getElementById('toast-msg').textContent = m;
        t.style.opacity = '1'; t.style.bottom = '30px'; 
        setTimeout(() => { t.style.opacity = '0'; t.style.bottom = '-50px'; }, 1500);
    }
};

window.onload = () => App.init();
</script>
