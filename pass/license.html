<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LICENSE LOG</title>
    
    <!-- 1. 외부 CDN 리소스 폴백(Fallback) 처리 (스크립트 에러 핸들러) -->
    <script>
        function handleScriptError(fallbackSrc) {
            document.documentElement.classList.add('icons-failed');
            var s = document.createElement('script');
            s.src = fallbackSrc;
            document.head.appendChild(s);
        }
    </script>
    
    <script src="https://cdn.tailwindcss.com" onerror="handleScriptError('../nexus/tailwindcss.js')"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" onerror="handleScriptError('../nexus/exceljs.min.js')"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: {
                            50: '#F7FBFA', 100: '#EEF5F3', 200: '#DDEBE7',
                            300: '#BDD4CD', 400: '#8FB4A8', 500: '#5C8D80',
                            600: '#4A7469', 700: '#35534B',
                        }
                    }
                }
            }
        }
    </script>

    <!-- 1. 외부 CDN 리소스 폴백 (CSS) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" onerror="this.onerror=null; this.href='../nexus/pretendard.css';" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" onerror="this.onerror=null; this.href='../nexus/all.min.css';">
    
    <style>
        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
            color: #334155; 
            background-color: #F8FAFC;
            background-image: radial-gradient(at 0% 0%, hsla(160, 20%, 96%, 1) 0, transparent 50%), radial-gradient(at 100% 100%, hsla(210, 20%, 96%, 1) 0, transparent 50%);
        }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-header {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
        }
        
        .timeline-line::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 24px;
            bottom: 80px;
            width: 2px;
            background: linear-gradient(to bottom, #DDEBE7, rgba(221, 235, 231, 0.2)); 
            z-index: 0;
            border-radius: 2px;
        }

        .shadow-premium { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.06); }
        .shadow-card { box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03); }

        .wysiwyg-editor [contenteditable=true]:empty:before {
            content: attr(data-placeholder);
            color: #94a3b8;
            display: block;
        }

        /* 2. 오프라인 상태 감지 배너 CSS */
        #offline-banner { 
            display: none; 
            background: #4B5563; 
            color: white; 
            text-align: center; 
            padding: 8px; 
            font-size: 14px; 
            font-weight: 600; 
            z-index: 1000; 
            flex-shrink: 0; 
        }

        /* 4. 폰트 깨짐 방지용 이모지 폴백(Fallback) CSS */
        .icons-failed i[class*="fa-"]::before {
            font-style: normal !important;
            font-family: sans-serif !important;
            display: inline-block;
            text-align: center;
            line-height: 1;
        }
        .icons-failed i.fa-certificate::before { content: "📜"; }
        .icons-failed i.fa-search::before { content: "🔍"; }
        .icons-failed i.fa-file-export::before { content: "📤"; }
        .icons-failed i.fa-plus::before { content: "➕"; }
        .icons-failed i.fa-award::before { content: "🏆"; }
        .icons-failed i.fa-flag-checkered::before { content: "🏁"; }
        .icons-failed i.fa-calendar-alt::before,
        .icons-failed i.fa-calendar-check::before { content: "📅"; }
        .icons-failed i.fa-book-open::before { content: "📖"; }
        .icons-failed i.fa-edit::before,
        .icons-failed i.fa-pen::before,
        .icons-failed i.fa-pen-to-square::before,
        .icons-failed i.fa-pen-nib::before { content: "✏️"; }
        .icons-failed i.fa-trash-alt::before,
        .icons-failed i.fa-trash::before { content: "🗑️"; }
        .icons-failed i.fa-tasks::before { content: "📋"; }
        .icons-failed i.fa-hourglass-half::before { content: "⏳"; }
        .icons-failed i.fa-check::before,
        .icons-failed i.fa-check-circle::before { content: "✔️"; }
        .icons-failed i.fa-id-card::before { content: "🪪"; }
        .icons-failed i.fa-times::before { content: "❌"; }
        .icons-failed i.fa-paperclip::before { content: "📎"; }
        .icons-failed i.fa-file-alt::before { content: "📄"; }
        .icons-failed i.fa-link::before { content: "🔗"; }
        .icons-failed i.fa-minus-circle::before { content: "➖"; }
        .icons-failed i.fa-print::before { content: "🖨️"; }
        .icons-failed i.fa-bullseye::before { content: "🎯"; }
        .icons-failed i.fa-sticky-note::before { content: "📝"; }

        /* 인쇄 전용 스타일 */
        #print-area { display: none; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; padding: 20px; background: white; color: black; }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden selection:bg-sage-200 selection:text-sage-700">

    <!-- 2. 오프라인 상태 감지 배너 -->
    <div id="offline-banner">현재 기기가 오프라인 상태입니다. 모든 데이터는 안전하게 저장되며 로컬 오프라인 모드가 적용됩니다.</div>

    <!-- 기존 body의 레이아웃 유지를 위한 컨테이너 -->
    <div class="flex-1 flex overflow-hidden w-full">
        <!-- 사이드바 -->
        <aside class="w-[340px] bg-white/80 backdrop-blur-xl border-r border-slate-100 flex flex-col shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-20 shrink-0">
            <div class="p-7 pb-5">
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight flex items-center mb-7">
                    <span class="bg-sage-500 text-white w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-sm shadow-md shadow-sage-500/20">
                        <i class="fas fa-certificate"></i>
                    </span>
                    LICENSE LOG
                </h1>
                
                <div class="relative group">
                    <i class="fas fa-search absolute left-4 top-3.5 text-slate-400 text-sm group-focus-within:text-sage-600 transition-colors"></i>
                    <input type="text" id="project-search" placeholder="자격증 검색..." 
                        class="w-full bg-slate-50/50 hover:bg-slate-50 border border-slate-200 rounded-2xl pl-11 pr-4 py-3 text-sm text-slate-700 focus:outline-none focus:ring-4 focus:ring-sage-500/10 focus:border-sage-500 transition-all placeholder-slate-400 shadow-sm">
                </div>
            </div>

            <div class="px-7 pb-3 flex justify-between items-end">
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest px-1">My Certifications</p>
                <button onclick="exportAllExcel()" title="엑셀 전체 백업" class="text-xs text-slate-400 hover:text-sage-600 transition-colors"><i class="fas fa-file-export mr-1"></i>백업</button>
            </div>

            <div class="flex-1 overflow-y-auto px-5 space-y-2.5 pb-4 scrollbar-hide" id="project-list"></div>

            <div class="p-5 border-t border-slate-100 bg-white/50 backdrop-blur-md">
                <button onclick="openProjectModal()" class="w-full bg-white hover:bg-sage-50 text-sage-600 py-3.5 rounded-2xl text-sm font-semibold transition-all duration-300 flex items-center justify-center border border-sage-200 shadow-card hover:shadow-premium group">
                    <i class="fas fa-plus mr-2 group-hover:rotate-90 transition-transform duration-300"></i> 새 자격증 추가
                </button>
            </div>
        </aside>

        <!-- 메인 컨텐츠 영역 -->
        <main class="flex-1 flex flex-col h-full relative min-w-0">
            
            <!-- 선택 안된 상태 -->
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-white/40 backdrop-blur-sm z-0">
                <div class="w-28 h-28 bg-gradient-to-br from-sage-50 to-white rounded-full flex items-center justify-center mb-6 border border-sage-100 shadow-premium">
                    <i class="fas fa-award text-5xl text-sage-500 opacity-80"></i>
                </div>
                <h3 class="text-2xl font-bold text-slate-700 mb-3 tracking-tight">목표 자격증을 선택하세요</h3>
                <p class="text-slate-500 font-medium">좌측 사이드바에서 자격증을 선택하여 일정 및 출제동향/노트를 관리하세요.</p>
            </div>

            <!-- 메인 화면 -->
            <div id="main-content" class="hidden flex-col h-full relative z-10">
                <header class="glass-header px-10 pt-8 pb-4 sticky top-0 z-20">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <div class="flex items-center gap-2 mb-3">
                                <span class="w-2 h-2 rounded-full bg-sage-500 shadow-[0_0_8px_rgba(92,141,128,0.6)]"></span>
                                <span class="text-xs font-bold text-sage-500 uppercase tracking-widest bg-sage-50 px-2.5 py-1 rounded-md border border-sage-100" id="header-status">접수기간 대기중</span>
                            </div>
                            <h2 class="text-4xl font-extrabold text-slate-800 tracking-tight leading-none mb-2" id="current-project-title"></h2>
                            <p class="text-slate-500 font-medium text-sm flex items-center" id="current-project-desc"></p>
                        </div>
                        <div class="text-right flex flex-col items-end justify-center bg-white border border-slate-100 rounded-3xl px-8 py-4 shadow-card">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">시험까지 남은 시간</span>
                            <div class="text-5xl font-black text-sage-600 tracking-tighter" id="header-d-day">-</div>
                        </div>
                    </div>

                    <div class="bg-white/80 backdrop-blur-md rounded-2xl border border-white shadow-premium p-1.5 flex justify-between items-center text-sm mb-6">
                        <div class="text-center px-6 py-3 flex-1 rounded-xl hover:bg-slate-50/50 transition-colors">
                            <div class="text-[11px] text-slate-400 font-bold uppercase tracking-wider mb-1">원서 접수</div>
                            <div class="font-bold text-slate-700 text-base tracking-tight" id="date-reg"></div>
                        </div>
                        <div class="w-px h-10 bg-slate-100"></div>
                        <div class="text-center px-6 py-3 flex-1 rounded-xl hover:bg-red-50/30 transition-colors">
                            <div class="text-[11px] text-red-400 font-bold uppercase tracking-wider mb-1"><i class="fas fa-flag-checkered mr-1.5"></i>시험일</div>
                            <div class="font-bold text-red-500 text-base tracking-tight" id="date-exam"></div>
                        </div>
                        <div class="w-px h-10 bg-slate-100"></div>
                        <div class="text-center px-6 py-3 flex-1 rounded-xl hover:bg-blue-50/30 transition-colors">
                            <div class="text-[11px] text-blue-400 font-bold uppercase tracking-wider mb-1">합격자 발표</div>
                            <div class="font-bold text-slate-700 text-base tracking-tight" id="date-result"></div>
                        </div>
                    </div>

                    <!-- 탭 메뉴 & 관리 버튼 -->
                    <div class="flex justify-between items-center border-t border-slate-200/60 pt-4">
                        <div class="flex gap-2 bg-slate-100/80 p-1 rounded-2xl">
                            <button id="tab-btn-timeline" onclick="switchTab('timeline')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all bg-white text-slate-800 shadow-sm">
                                <i class="fas fa-calendar-alt mr-2 text-sage-500"></i>학습 일정 (Timeline)
                            </button>
                            <button id="tab-btn-notes" onclick="switchTab('notes')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-500 hover:text-slate-800">
                                <i class="fas fa-book-open mr-2 text-sage-500"></i>시험정보 & 노트 (<span id="note-count-badge">0</span>)
                            </button>
                        </div>

                        <div class="flex items-center gap-2">
                            <button onclick="editCurrentProject()" class="text-slate-400 hover:text-sage-600 hover:bg-sage-50 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all">
                                <i class="far fa-edit mr-1"></i> 정보 수정
                            </button>
                            <button onclick="deleteCurrentProject()" class="text-slate-400 hover:text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all">
                                <i class="far fa-trash-alt mr-1"></i> 자격증 삭제
                            </button>
                        </div>
                    </div>
                </header>

                <!-- 탭 1: 타임라인 메인 영역 -->
                <div id="tab-content-timeline" class="flex-1 overflow-y-auto px-10 py-8 scrollbar-hide">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-lg font-bold text-slate-800"><i class="fas fa-tasks text-sage-500 mr-2"></i>학습 마일스톤</h3>
                        <button onclick="openMilestoneModal()" class="bg-gradient-to-r from-sage-500 to-sage-600 hover:from-sage-600 hover:to-sage-700 text-white px-5 py-2 rounded-xl text-xs font-bold transition-all shadow-md shadow-sage-500/30 flex items-center hover:-translate-y-0.5">
                            <i class="fas fa-plus mr-1.5"></i> 일정 등록
                        </button>
                    </div>

                    <div class="grid grid-cols-3 gap-5 mb-10">
                        <div class="bg-white/80 backdrop-blur p-6 rounded-3xl shadow-card border border-white flex items-center justify-between group hover:shadow-premium transition-all">
                            <div>
                                <span class="text-slate-400 text-[11px] font-bold uppercase tracking-wider block mb-1">Total Schedules</span>
                                <strong class="text-3xl font-extrabold text-slate-700" id="stat-total">0</strong>
                            </div>
                            <div class="w-14 h-14 rounded-2xl bg-slate-50 flex items-center justify-center text-slate-400 group-hover:scale-110 transition-transform">
                                <i class="far fa-calendar-check text-xl"></i>
                            </div>
                        </div>
                        <div class="bg-white/80 backdrop-blur p-6 rounded-3xl shadow-card border border-white flex items-center justify-between group hover:shadow-premium transition-all">
                            <div>
                                <span class="text-amber-500 text-[11px] font-bold uppercase tracking-wider block mb-1">In Progress</span>
                                <strong class="text-3xl font-extrabold text-slate-700" id="stat-remain">0</strong>
                            </div>
                            <div class="w-14 h-14 rounded-2xl bg-amber-50 flex items-center justify-center text-amber-500 group-hover:scale-110 transition-transform">
                                <i class="fas fa-hourglass-half text-xl"></i>
                            </div>
                        </div>
                        <div class="bg-white/80 backdrop-blur p-6 rounded-3xl shadow-card border border-white flex items-center justify-between group hover:shadow-premium transition-all">
                            <div>
                                <span class="text-sage-600 text-[11px] font-bold uppercase tracking-wider block mb-1">Completed</span>
                                <strong class="text-3xl font-extrabold text-slate-700" id="stat-done">0</strong>
                            </div>
                            <div class="w-14 h-14 rounded-2xl bg-sage-50 flex items-center justify-center text-sage-600 group-hover:scale-110 transition-transform">
                                <i class="fas fa-check text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="relative space-y-6 pb-20" id="milestone-list"></div>
                </div>

                <!-- 탭 2: 자격증 정보 & 출제동향 / 학습노트 메인 영역 -->
                <div id="tab-content-notes" class="hidden flex-1 overflow-y-auto px-10 py-8 scrollbar-hide">
                    <!-- 필터 및 검색 컨트롤 -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 bg-white/80 backdrop-blur p-5 rounded-3xl border border-white shadow-card">
                        <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto scrollbar-hide" id="note-category-filters">
                            <!-- JS 렌더링 -->
                        </div>
                        
                        <div class="flex items-center gap-3 w-full md:w-auto shrink-0">
                            <div class="relative flex-1 md:w-64">
                                <i class="fas fa-search absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                                <input type="text" id="note-search-input" placeholder="토픽/노트 검색..." oninput="renderNotes()" 
                                    class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-700 focus:outline-none focus:border-sage-500">
                            </div>
                            <button onclick="openNoteModal()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-md flex items-center shrink-0">
                                <i class="fas fa-pen-nib mr-1.5 text-sage-400"></i> 노트 작성
                            </button>
                        </div>
                    </div>

                    <!-- 노트 그리드 리스트 -->
                    <div id="notes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-20"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 자격증 등록/수정 모달 -->
    <div id="project-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50 transition-opacity duration-300">
        <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-lg p-9 border border-white transform transition-all">
            <h3 id="project-modal-title" class="text-2xl font-extrabold text-slate-800 mb-2 flex items-center tracking-tight">
                <i class="fas fa-id-card text-sage-500 mr-3"></i> 자격증 등록
            </h3>
            <p class="text-slate-500 text-sm mb-7 ml-8 font-medium">일정을 정확히 입력하면 D-Day가 자동 계산됩니다.</p>
            
            <form id="project-form" class="space-y-5">
                <input type="hidden" id="p-edit-id">
                
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">자격증 명</label>
                    <input type="text" id="p-name" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-3.5 focus:ring-4 focus:ring-sage-500/10 focus:border-sage-500 focus:bg-white outline-none transition-all text-slate-700 font-medium" placeholder="예: 정보처리기사 실기" required>
                </div>
                
                <div class="grid grid-cols-2 gap-5">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">접수 시작일</label>
                        <input type="date" id="p-reg-start" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-3.5 focus:ring-4 focus:ring-sage-500/10 focus:border-sage-500 focus:bg-white outline-none transition-all text-slate-700" required>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">접수 마감일</label>
                        <input type="date" id="p-reg-end" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-3.5 focus:ring-4 focus:ring-sage-500/10 focus:border-sage-500 focus:bg-white outline-none transition-all text-slate-700" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-5">
                    <div>
                        <label class="block text-[11px] font-bold text-red-400 uppercase tracking-widest mb-1.5 ml-1">시험일 (D-Day)</label>
                        <input type="date" id="p-exam-date" class="w-full bg-red-50/50 border border-red-100 rounded-2xl px-5 py-3.5 focus:ring-4 focus:ring-red-500/10 focus:border-red-400 focus:bg-white outline-none text-slate-800 font-bold transition-all" required>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-blue-400 uppercase tracking-widest mb-1.5 ml-1">합격자 발표일</label>
                        <input type="date" id="p-result-date" class="w-full bg-blue-50/50 border border-blue-100 rounded-2xl px-5 py-3.5 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-400 focus:bg-white outline-none text-slate-700 transition-all" required>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 ml-1">메모 / 목표 점수</label>
                    <input type="text" id="p-desc" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-3.5 focus:ring-4 focus:ring-sage-500/10 focus:border-sage-500 focus:bg-white outline-none transition-all text-slate-700" placeholder="예: 80점 이상 목표, 기출 5회독">
                </div>

                <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-slate-100">
                    <button type="button" onclick="closeProjectModal()" class="px-6 py-3 text-slate-500 hover:bg-slate-100 rounded-2xl text-sm font-bold transition-colors">취소</button>
                    <button type="submit" class="px-8 py-3 bg-slate-800 text-white rounded-2xl hover:bg-slate-700 text-sm font-bold shadow-lg shadow-slate-800/20 transition-all hover:-translate-y-0.5">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 핵심 로직 자바스크립트 -->
    <script>
        // 3. 네트워크 상태 감지 및 배너/클래스 제어
        function updateNetworkStatus() {
            const banner = document.getElementById('offline-banner');
            if (navigator.onLine) {
                banner.style.display = 'none';
                document.documentElement.classList.remove('icons-failed');
            } else {
                banner.style.display = 'block';
                document.documentElement.classList.add('icons-failed');
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
        window.addEventListener('load', updateNetworkStatus);
        updateNetworkStatus(); // 초기 로드시 즉시 확인

        const DB_NAME = 'LicenseDB';
        const DB_VERSION = 1; 
        const STORE_NAME = 'certifications';

        const dbService = {
            db: null,
            async open() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        }
                    };
                    req.onsuccess = (e) => { this.db = e.target.result; resolve(this.db); };
                    req.onerror = (e) => reject(e.target.error);
                });
            },
            async getAllProjects() {
                return new Promise((resolve) => {
                    const tx = this.db.transaction([STORE_NAME], 'readonly');
                    tx.objectStore(STORE_NAME).getAll().onsuccess = (e) => resolve(e.target.result);
                });
            },
            async saveProject(project) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction([STORE_NAME], 'readwrite');
                    tx.objectStore(STORE_NAME).put(project).onsuccess = (e) => resolve(e.target.result);
                });
            },
            async deleteProject(id) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction([STORE_NAME], 'readwrite');
                    tx.objectStore(STORE_NAME).delete(id).onsuccess = () => resolve();
                });
            }
        };

        let projects = [];
        let activeProjectId = null;
        let activeTab = 'timeline';
        let activeCategoryFilter = 'ALL';
        
        let tempFiles = [];
        let tempLinks = [];

        const projectListEl = document.getElementById('project-list');
        const searchInput = document.getElementById('project-search');

        const NOTE_CATEGORIES = [
            'ALL', '1. 시험 정보', '2. 출제 동향', '3. 기출 분석', '4. 학습 전략', '5. 학원 일정'
        ];

        const getDDay = (targetDate) => {
            const today = new Date(); today.setHours(0,0,0,0);
            const target = new Date(targetDate); target.setHours(0,0,0,0);
            return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        };

        const formatDate = (dateStr) => {
            if(!dateStr) return '-';
            const d = new Date(dateStr);
            return `${d.getMonth()+1}.${d.getDate()}`;
        };

        (async function init() {
            await dbService.open();
            await loadProjects();
            renderCategoryFilters();
        })();

        async function loadProjects() {
            projects = await dbService.getAllProjects();
            
            // 데이터 구조 호환성 보장
            projects.forEach(p => {
                if(!p.milestones) p.milestones = [];
                if(!p.notes) p.notes = [];
            });

            renderProjectList(searchInput.value);
            if(activeProjectId) renderMainContent();
        }

        function renderProjectList(filter = '') {
            projectListEl.innerHTML = '';
            const filtered = projects.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()));
            
            if (filtered.length === 0) {
                projectListEl.innerHTML = `<div class="text-center text-xs font-medium text-slate-400 py-10 bg-slate-50 rounded-2xl border border-dashed border-slate-200">등록된 자격증이 없습니다.</div>`;
                return;
            }

            filtered.sort((a, b) => new Date(a.examDate) - new Date(b.examDate));

            filtered.forEach(p => {
                const isActive = p.id === activeProjectId;
                const dDay = getDDay(p.examDate);
                let dDayStr = dDay === 0 ? "D-Day" : (dDay > 0 ? `D-${dDay}` : "종료");
                let dDayClass = dDay <= 7 && dDay >= 0 ? "bg-red-50 text-red-500 font-bold" : "bg-slate-100 text-slate-500 font-medium";

                const activeClass = isActive 
                    ? 'bg-gradient-to-br from-sage-50 to-white border-sage-200 ring-1 ring-sage-200 shadow-sm' 
                    : 'bg-white border-white hover:border-slate-200 hover:shadow-card shadow-[0_2px_10px_rgba(0,0,0,0.01)]';

                projectListEl.insertAdjacentHTML('beforeend', `
                    <div onclick="selectProject(${p.id})" class="cursor-pointer p-4 rounded-2xl border mb-3 transition-all relative overflow-hidden group ${activeClass}">
                        <div class="flex justify-between items-start mb-2 gap-2">
                            <span class="font-bold text-[15px] text-slate-700 truncate leading-snug">${p.name}</span>
                            <span class="text-[10px] px-2 py-1 rounded-md shrink-0 ${dDayClass}">${dDayStr}</span>
                        </div>
                        <div class="flex items-center text-xs text-slate-400 font-medium gap-3">
                             <span><i class="far fa-calendar-alt mr-1"></i>${p.examDate}</span>
                             <span><i class="far fa-sticky-note mr-1"></i>노트 ${p.notes ? p.notes.length : 0}</span>
                        </div>
                        ${isActive ? '<div class="absolute left-0 top-0 bottom-0 w-1 bg-sage-500"></div>' : ''}
                    </div>
                `);
            });
        }

        searchInput.addEventListener('input', (e) => renderProjectList(e.target.value));
        
        window.selectProject = (id) => { 
            activeProjectId = id; 
            renderProjectList(searchInput.value); 
            renderMainContent(); 
        };

        function switchTab(tab) {
            activeTab = tab;
            const btnTimeline = document.getElementById('tab-btn-timeline');
            const btnNotes = document.getElementById('tab-btn-notes');
            const contentTimeline = document.getElementById('tab-content-timeline');
            const contentNotes = document.getElementById('tab-content-notes');

            if (tab === 'timeline') {
                btnTimeline.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all bg-white text-slate-800 shadow-sm";
                btnNotes.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-500 hover:text-slate-800";
                contentTimeline.classList.remove('hidden');
                contentNotes.classList.add('hidden');
            } else {
                btnNotes.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all bg-white text-slate-800 shadow-sm";
                btnTimeline.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-500 hover:text-slate-800";
                contentNotes.classList.remove('hidden');
                contentTimeline.classList.add('hidden');
                renderNotes();
            }
        }

        function renderMainContent() {
            const main = document.getElementById('main-content');
            const empty = document.getElementById('empty-state');
            const project = projects.find(p => p.id === activeProjectId);

            if (!project) {
                empty.classList.remove('hidden');
                main.classList.remove('flex');
                main.classList.add('hidden');
                return;
            }

            empty.classList.add('hidden');
            main.classList.remove('hidden');
            main.classList.add('flex');

            document.getElementById('current-project-title').innerText = project.name;
            document.getElementById('current-project-desc').innerHTML = project.desc ? `<i class="fas fa-bullseye text-sage-400 mr-2"></i> ${project.desc}` : '';
            document.getElementById('note-count-badge').innerText = project.notes ? project.notes.length : 0;

            const dDay = getDDay(project.examDate);
            const dDayEl = document.getElementById('header-d-day');
            
            if (dDay > 0) {
                dDayEl.innerText = dDay;
                dDayEl.className = "text-5xl font-black text-sage-600 tracking-tighter";
            } else if (dDay === 0) {
                dDayEl.innerText = "D-DAY";
                dDayEl.className = "text-5xl font-black text-red-500 tracking-tighter animate-pulse";
            } else {
                dDayEl.innerText = "END";
                dDayEl.className = "text-5xl font-black text-slate-300 tracking-tighter";
            }

            document.getElementById('date-reg').innerText = `${formatDate(project.regStart)} ~ ${formatDate(project.regEnd)}`;
            document.getElementById('date-exam').innerText = formatDate(project.examDate); 
            document.getElementById('date-result').innerText = formatDate(project.resultDate);

            renderMilestones(project);
            if (activeTab === 'notes') renderNotes();
        }

        // ================= 마일스톤 기능 =================
        function renderMilestones(project) {
            const listEl = document.getElementById('milestone-list');
            listEl.innerHTML = '';

            const sorted = [...project.milestones].sort((a, b) => new Date(a.date) - new Date(b.date));
            document.getElementById('stat-total').innerText = sorted.length;
            document.getElementById('stat-done').innerText = sorted.filter(m => m.status === 'done').length;
            document.getElementById('stat-remain').innerText = sorted.filter(m => m.status === 'progress').length;

            if(sorted.length === 0) {
                listEl.classList.remove('timeline-line');
                listEl.innerHTML = `
                    <div class="text-center py-20 border-2 border-dashed border-slate-200 rounded-3xl bg-white/50">
                        <p class="text-slate-500 font-bold mb-1">등록된 일정이 없습니다.</p>
                        <button onclick="openMilestoneModal()" class="text-xs text-sage-600 font-bold hover:underline">첫 일정 추가하기</button>
                    </div>`;
                return;
            }

            listEl.classList.add('timeline-line'); 

            sorted.forEach((item, idx) => {
                const st = {
                    'pending': { l: '예정', c: 'bg-slate-50 text-slate-500 ring-slate-200' },
                    'progress': { l: '진행중', c: 'bg-amber-50 text-amber-600 ring-amber-200' },
                    'done': { l: '완료', c: 'bg-sage-50 text-sage-600 ring-sage-200' }
                }[item.status];

                listEl.insertAdjacentHTML('beforeend', `
                    <div class="relative pl-8 group">
                        <div class="absolute left-[13px] top-6 w-4 h-4 bg-white border-[3px] ${item.status === 'done' ? 'border-sage-500' : 'border-slate-200'} rounded-full z-10 transition-all"></div>
                        <div class="bg-white/90 p-6 rounded-2xl border border-white shadow-card hover:shadow-premium transition-all flex justify-between items-center">
                            <div>
                                <div class="flex items-center gap-2 mb-1.5">
                                    <span class="text-[10px] font-extrabold text-sage-600 uppercase bg-sage-50 px-2 py-0.5 rounded border border-sage-100">${item.chapter}</span>
                                    <span class="text-xs text-slate-400 font-semibold">${item.date}</span>
                                </div>
                                <h3 class="text-base font-bold text-slate-800 ${item.status === 'done' ? 'line-through text-slate-300' : ''}">${item.title}</h3>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="px-2.5 py-1 rounded-lg text-xs font-bold uppercase ring-1 ring-inset ${st.c}">${st.l}</span>
                                <div class="opacity-0 group-hover:opacity-100 transition-all flex gap-1">
                                    <button onclick="editMilestone(${item.id})" class="w-8 h-8 rounded-lg bg-slate-50 hover:bg-sage-50 text-slate-400 hover:text-sage-600 flex items-center justify-center"><i class="fas fa-pen text-xs"></i></button>
                                    <button onclick="deleteMilestone(${item.id})" class="w-8 h-8 rounded-lg bg-slate-50 hover:bg-red-50 text-slate-400 hover:text-red-500 flex items-center justify-center"><i class="fas fa-trash text-xs"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `);
            });
        }

        // ================= 노트 / 출제동향 기능 =================
        function renderCategoryFilters() {
            const container = document.getElementById('note-category-filters');
            container.innerHTML = '';
            NOTE_CATEGORIES.forEach(cat => {
                const label = cat === 'ALL' ? '전체 보기' : cat;
                const isSelected = activeCategoryFilter === cat;
                const btnClass = isSelected 
                    ? 'bg-sage-500 text-white shadow-sm' 
                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200';
                container.insertAdjacentHTML('beforeend', `
                    <button onclick="setCategoryFilter('${cat}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold shrink-0 transition-all ${btnClass}">
                        ${label}
                    </button>
                `);
            });
        }

        function setCategoryFilter(cat) {
            activeCategoryFilter = cat;
            renderCategoryFilters();
            renderNotes();
        }

        function renderNotes() {
            const project = projects.find(p => p.id === activeProjectId);
            if (!project) return;

            const grid = document.getElementById('notes-grid');
            grid.innerHTML = '';

            const searchKey = document.getElementById('note-search-input').value.toLowerCase();
            let notes = project.notes || [];

            if (activeCategoryFilter !== 'ALL') {
                notes = notes.filter(n => n.category.includes(activeCategoryFilter));
            }

            if (searchKey) {
                notes = notes.filter(n => (n.title + n.desc).toLowerCase().includes(searchKey));
            }

            if (notes.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-20 bg-white/50 border-2 border-dashed border-slate-200 rounded-3xl">
                        <i class="fas fa-book-open text-4xl text-slate-300 mb-3 block"></i>
                        <p class="text-slate-500 font-bold mb-1">등록된 노트나 출제동향이 없습니다.</p>
                        <button onclick="openNoteModal()" class="text-xs text-sage-600 font-bold hover:underline">새 노트 작성하기</button>
                    </div>`;
                return;
            }

            notes.forEach(note => {
                const fileCount = note.files ? note.files.length : 0;
                const linkCount = note.links ? note.links.length : 0;
                
                grid.insertAdjacentHTML('beforeend', `
                    <div class="bg-white/90 rounded-3xl p-6 border border-white shadow-card hover:shadow-premium transition-all flex flex-col justify-between group relative">
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-[10px] font-extrabold text-sage-600 bg-sage-50 border border-sage-100 px-2.5 py-1 rounded-md uppercase tracking-wider">${note.category}</span>
                            </div>
                            <h4 class="text-lg font-bold text-slate-800 mb-2 group-hover:text-sage-600 transition-colors leading-snug">${note.title}</h4>
                            <p class="text-xs text-slate-500 line-clamp-3 mb-4 leading-relaxed">${note.desc.replace(/<[^>]*>/g, '')}</p>
                        </div>

                        <div class="pt-4 border-t border-slate-100 flex justify-between items-center">
                            <div class="flex gap-3 text-xs text-slate-400">
                                ${fileCount > 0 ? `<span><i class="fas fa-paperclip mr-1"></i>${fileCount}</span>` : ''}
                                ${linkCount > 0 ? `<span><i class="fas fa-link mr-1"></i>${linkCount}</span>` : ''}
                            </div>
                            <div class="flex gap-1.5">
                                <button onclick="printNote(${note.id})" title="A4 인쇄" class="w-8 h-8 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-400 hover:text-slate-700 flex items-center justify-center transition-all"><i class="fas fa-print text-xs"></i></button>
                                <button onclick="editNote(${note.id})" title="수정" class="w-8 h-8 rounded-xl bg-slate-50 hover:bg-sage-50 text-slate-400 hover:text-sage-600 flex items-center justify-center transition-all"><i class="fas fa-pen text-xs"></i></button>
                                <button onclick="deleteNote(${note.id})" title="삭제" class="w-8 h-8 rounded-xl bg-slate-50 hover:bg-red-50 text-slate-400 hover:text-red-500 flex items-center justify-center transition-all"><i class="fas fa-trash text-xs"></i></button>
                            </div>
                        </div>
                    </div>
                `);
            });
        }

        // 노트 모달 관련 이벤트 & 핸들러
        const noteModal = document.getElementById('note-modal');
        const noteForm = document.getElementById('note-form');

        function openNoteModal() {
            if (!activeProjectId) return alert('자격증을 선택해주세요.');
            noteForm.reset();
            document.getElementById('n-edit-id').value = '';
            document.getElementById('n-desc').innerHTML = '';
            document.getElementById('note-modal-title').innerHTML = '<i class="fas fa-edit text-sage-500 mr-2.5"></i> 노트 및 출제동향 작성';
            tempFiles = [];
            tempLinks = [];
            renderTempFiles();
            renderTempLinks();
            noteModal.classList.remove('hidden');
        }

        function closeNoteModal() { noteModal.classList.add('hidden'); }

        // 클립보드 이미지 Paste 지원
        document.getElementById('n-desc').addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf("image") !== -1) {
                    const file = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        tempFiles.push({ name: 'pasted_image.png', type: item.type, data: ev.target.result });
                        renderTempFiles();
                    };
                    reader.readAsDataURL(file);
                }
            }
        });

        document.getElementById('n-file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                tempFiles.push({ name: file.name, type: file.type, data: ev.target.result });
                renderTempFiles();
            };
            reader.readAsDataURL(file);
        });

        function renderTempFiles() {
            const list = document.getElementById('n-file-list');
            list.innerHTML = '';
            tempFiles.forEach((f, idx) => {
                const isImg = f.type.startsWith('image');
                list.insertAdjacentHTML('beforeend', `
                    <div class="relative group w-12 h-12 rounded-xl border overflow-hidden bg-white shrink-0 flex items-center justify-center">
                        ${isImg ? `<img src="${f.data}" onclick="openImageViewer('${f.data}')" class="w-full h-full object-cover cursor-pointer">` : '<i class="fas fa-file-alt text-slate-400"></i>'}
                        <button type="button" onclick="tempFiles.splice(${idx},1); renderTempFiles();" class="absolute top-0.5 right-0.5 bg-black/60 text-white w-4 h-4 rounded-full text-[9px] flex items-center justify-center">&times;</button>
                    </div>
                `);
            });
        }

        function addNoteLinkRow(title = '', url = '') {
            tempLinks.push({ title, url });
            renderTempLinks();
        }

        function renderTempLinks() {
            const container = document.getElementById('n-link-list');
            container.innerHTML = '';
            tempLinks.forEach((l, idx) => {
                container.insertAdjacentHTML('beforeend', `
                    <div class="flex items-center gap-2">
                        <input type="text" placeholder="제목" value="${l.title}" oninput="tempLinks[${idx}].title=this.value" class="w-1/3 bg-slate-50 border rounded-xl px-3 py-1.5 text-xs">
                        <input type="text" placeholder="https://..." value="${l.url}" oninput="tempLinks[${idx}].url=this.value" class="flex-1 bg-slate-50 border rounded-xl px-3 py-1.5 text-xs text-sage-600">
                        <button type="button" onclick="tempLinks.splice(${idx},1); renderTempLinks();" class="text-red-400 hover:text-red-600 px-1"><i class="fas fa-minus-circle"></i></button>
                    </div>
                `);
            });
        }

        noteForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const project = projects.find(p => p.id === activeProjectId);
            const nId = document.getElementById('n-edit-id').value;

            const noteData = {
                id: nId ? parseInt(nId) : Date.now(),
                category: document.getElementById('n-category').value,
                title: document.getElementById('n-title').value,
                desc: document.getElementById('n-desc').innerHTML,
                files: tempFiles,
                links: tempLinks.filter(l => l.url)
            };

            if (nId) {
                const idx = project.notes.findIndex(n => n.id === parseInt(nId));
                project.notes[idx] = noteData;
            } else {
                project.notes.push(noteData);
            }

            await dbService.saveProject(project);
            await loadProjects();
            closeNoteModal();
        });

        window.editNote = (nId) => {
            const project = projects.find(p => p.id === activeProjectId);
            const note = project.notes.find(n => n.id === nId);
            
            document.getElementById('n-edit-id').value = note.id;
            document.getElementById('n-category').value = note.category;
            document.getElementById('n-title').value = note.title;
            document.getElementById('n-desc').innerHTML = note.desc;
            
            tempFiles = note.files || [];
            tempLinks = note.links || [];
            renderTempFiles();
            renderTempLinks();

            document.getElementById('note-modal-title').innerHTML = '<i class="fas fa-edit text-sage-500 mr-2.5"></i> 노트 수정';
            noteModal.classList.remove('hidden');
        };

        window.deleteNote = async (nId) => {
            if (!confirm('이 노트를 삭제하시겠습니까?')) return;
            const project = projects.find(p => p.id === activeProjectId);
            project.notes = project.notes.filter(n => n.id !== nId);
            await dbService.saveProject(project);
            await loadProjects();
        };

        // 이미지 라이트박스 뷰어
        function openImageViewer(src) {
            document.getElementById('viewer-img').src = src;
            document.getElementById('image-viewer-modal').classList.remove('hidden');
            document.getElementById('image-viewer-modal').classList.add('flex');
        }
        function closeImageViewer() {
            document.getElementById('image-viewer-modal').classList.add('hidden');
            document.getElementById('image-viewer-modal').classList.remove('flex');
        }

        // A4 인쇄 기능
        function printNote(nId) {
            const project = projects.find(p => p.id === activeProjectId);
            const note = project.notes.find(n => n.id === nId);
            if (!note) return;

            const printArea = document.getElementById('print-area');
            printArea.innerHTML = `
                <div style="font-family: Pretendard, sans-serif; padding: 20px;">
                    <div style="border-bottom: 2px solid #35534B; padding-bottom: 15px; margin-bottom: 20px;">
                        <span style="font-size: 12px; font-weight: bold; color: #5C8D80;">${project.name} | ${note.category}</span>
                        <h1 style="font-size: 24px; font-weight: 800; margin: 8px 0;">${note.title}</h1>
                    </div>
                    <div style="font-size: 14px; line-height: 1.8; margin-bottom: 30px;">
                        ${note.desc}
                    </div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px;">
                        ${(note.files || []).filter(f => f.type.startsWith('image')).map(f => `<img src="${f.data}" style="max-width: 100%; border-radius: 8px;">`).join('')}
                    </div>
                </div>
            `;
            window.print();
        }

        // ================= 모달 & 자격증 프로젝트 로직 =================
        const pModal = document.getElementById('project-modal');
        const pForm = document.getElementById('project-form');
        const mModal = document.getElementById('milestone-modal');
        const mForm = document.getElementById('milestone-form');

        window.openProjectModal = () => { 
            pForm.reset(); 
            document.getElementById('p-edit-id').value = ''; 
            document.getElementById('project-modal-title').innerHTML = '<i class="fas fa-id-card text-sage-500 mr-3"></i> 자격증 등록';
            pModal.classList.remove('hidden'); 
        };

        window.editCurrentProject = () => {
            const project = projects.find(p => p.id === activeProjectId);
            if (!project) return;
            document.getElementById('p-edit-id').value = project.id;
            document.getElementById('p-name').value = project.name;
            document.getElementById('p-desc').value = project.desc || '';
            document.getElementById('p-reg-start').value = project.regStart;
            document.getElementById('p-reg-end').value = project.regEnd;
            document.getElementById('p-exam-date').value = project.examDate;
            document.getElementById('p-result-date').value = project.resultDate;
            document.getElementById('project-modal-title').innerHTML = '<i class="fas fa-pen-to-square text-sage-500 mr-3"></i> 자격증 정보 수정';
            pModal.classList.remove('hidden');
        };

        window.closeProjectModal = () => pModal.classList.add('hidden');
        window.closeMilestoneModal = () => mModal.classList.add('hidden');

        pForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('p-edit-id').value;
            let existingMilestones = [];
            let existingNotes = [];
            
            if (editId) {
                const existingProject = projects.find(p => p.id === parseInt(editId));
                if (existingProject) {
                    existingMilestones = existingProject.milestones || [];
                    existingNotes = existingProject.notes || [];
                }
            }

            const projectData = { 
                id: editId ? parseInt(editId) : Date.now(), 
                name: document.getElementById('p-name').value, 
                desc: document.getElementById('p-desc').value,
                regStart: document.getElementById('p-reg-start').value,
                regEnd: document.getElementById('p-reg-end').value,
                examDate: document.getElementById('p-exam-date').value,
                resultDate: document.getElementById('p-result-date').value,
                milestones: existingMilestones,
                notes: existingNotes
            };
            
            await dbService.saveProject(projectData);
            await loadProjects();
            selectProject(projectData.id);
            closeProjectModal();
        });

        window.deleteCurrentProject = async () => {
            if(confirm('정말 삭제하시겠습니까? 해당 자격증의 모든 일정과 노트 데이터가 삭제됩니다.')) {
                await dbService.deleteProject(activeProjectId);
                activeProjectId = null;
                await loadProjects();
            }
        };

        window.openMilestoneModal = (isEdit = false) => {
            if(!activeProjectId) return alert("자격증을 먼저 선택해주세요.");
            mModal.classList.remove('hidden');
            if(!isEdit) {
                mForm.reset();
                document.getElementById('m-edit-id').value = '';
                document.getElementById('m-modal-title').innerText = "일정 등록";
                document.getElementById('m-date').valueAsDate = new Date();
            }
        };

        mForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const project = projects.find(p => p.id === activeProjectId);
            const mId = document.getElementById('m-edit-id').value;
            const newData = {
                id: mId ? parseInt(mId) : Date.now(),
                chapter: document.getElementById('m-chapter').value,
                title: document.getElementById('m-title').value,
                date: document.getElementById('m-date').value,
                status: document.getElementById('m-status').value
            };
            
            if(mId) {
                const idx = project.milestones.findIndex(m => m.id === parseInt(mId));
                project.milestones[idx] = newData;
            } else {
                project.milestones.push(newData);
            }
            
            await dbService.saveProject(project);
            await loadProjects();
            closeMilestoneModal();
        });

        window.editMilestone = (mId) => {
            const project = projects.find(p => p.id === activeProjectId);
            const item = project.milestones.find(m => m.id === mId);
            document.getElementById('m-edit-id').value = item.id;
            document.getElementById('m-chapter').value = item.chapter;
            document.getElementById('m-title').value = item.title;
            document.getElementById('m-date').value = item.date;
            document.getElementById('m-status').value = item.status;
            document.getElementById('m-modal-title').innerText = "일정 수정";
            openMilestoneModal(true);
        };

        window.deleteMilestone = async (mId) => {
            if(!confirm('이 일정을 삭제하시겠습니까?')) return;
            const project = projects.find(p => p.id === activeProjectId);
            project.milestones = project.milestones.filter(m => m.id !== mId);
            await dbService.saveProject(project);
            await loadProjects();
        };

        // 엑셀 내보내기 백업 기능
        async function exportAllExcel() {
            if (projects.length === 0) return alert('백업할 데이터가 없습니다.');
            const wb = new ExcelJS.Workbook();
            
            // 1. 자격증 및 일정 시트
            const ws1 = wb.addWorksheet('자격증_일정');
            ws1.columns = [
                { header: '자격증명', key: 'name', width: 20 },
                { header: '시험일', key: 'examDate', width: 15 },
                { header: '구분', key: 'chapter', width: 15 },
                { header: '일정 제목', key: 'title', width: 30 },
                { header: '일정 날짜', key: 'date', width: 15 },
                { header: '상태', key: 'status', width: 10 }
            ];
            
            // 2. 노트 시트
            const ws2 = wb.addWorksheet('학습_노트');
            ws2.columns = [
                { header: '자격증명', key: 'name', width: 20 },
                { header: '카테고리', key: 'category', width: 15 },
                { header: '토픽명', key: 'title', width: 30 },
                { header: '본문 내용', key: 'desc', width: 50 }
            ];

            projects.forEach(p => {
                (p.milestones || []).forEach(m => {
                    ws1.addRow({ name: p.name, examDate: p.examDate, chapter: m.chapter, title: m.title, date: m.date, status: m.status });
                });
                (p.notes || []).forEach(n => {
                    ws2.addRow({ name: p.name, category: n.category, title: n.title, desc: n.desc.replace(/<[^>]*>/g, '') });
                });
            });

            const buf = await wb.xlsx.writeBuffer();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([buf]));
            a.download = `LicenseLog_Backup_${new Date().toISOString().slice(0,10)}.xlsx`;
            a.click();
        }

        // 키보드 숏컷: 백틱(`) 키로 창 닫기 (about:blank 이동)
        window.addEventListener('keydown', function(e) {
            if (e.key === '`') {
                const activeEl = document.activeElement;
                const isInput = activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable;
                
                // 폼이나 에디터에서 입력 중이 아닐 때만 창 닫기(about:blank로 이동) 실행
                if (!isInput) {
                    e.preventDefault();
                    window.location.href = 'about:blank';
                }
            }
        });
    </script>
</body>
</html>
